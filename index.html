function drawFlourish(ctx, cx, cy, size, color){
  ctx.save(); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy-size);
  ctx.quadraticCurveTo(cx+size*0.25, cy-size*0.25, cx+size, cy);
  ctx.quadraticCurveTo(cx+size*0.25, cy+size*0.25, cx, cy+size);
  ctx.quadraticCurveTo(cx-size*0.25, cy+size*0.25, cx-size, cy);
  ctx.quadraticCurveTo(cx-size*0.25, cy-size*0.25, cx, cy-size);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,size*0.22,0,Math.PI*2); ctx.fillStyle = PAL.cream; ctx.fill();
  ctx.restore();
}

function drawPillBadge(ctx, cx, cy, text, font, padX, bg, fg, h){
  ctx.font = font;
  const w = ctx.measureText(text).width + padX*2;
  const x = cx-w/2, y = cy-h/2, r = h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, cx, cy+1);
  ctx.textBaseline='alphabetic';
  return w;
}

function drawSealStamp(ctx, cx, cy, r){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = PAL.green2; ctx.fill();
  ctx.lineWidth = r*0.09; ctx.strokeStyle = PAL.gold; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.8,0,Math.PI*2); ctx.strokeStyle = PAL.gold; ctx.lineWidth = r*0.035; ctx.stroke();
  ctx.fillStyle = '#EADFC0'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `700 ${Math.round(r*0.32)}px 'Amiri', serif`;
  ctx.fillText('القرآن', cx, cy-r*0.17);
  ctx.fillText('الكريم', cx, cy+r*0.2);
  ctx.textBaseline='alphabetic';
  [-1,1].forEach(dir=>{
    ctx.beginPath();
    ctx.moveTo(cx+dir*r*0.5, cy+r*0.82);
    ctx.lineTo(cx+dir*r*0.62, cy+r*1.7);
    ctx.lineTo(cx+dir*r*0.36, cy+r*1.42);
    ctx.lineTo(cx+dir*r*0.16, cy+r*1.62);
    ctx.closePath();
    ctx.fillStyle = PAL.gold; ctx.fill();
  });
  ctx.restore();
}

function drawIconCircle(ctx, cx, cy, r, type, bg){
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = bg; ctx.fill();
  ctx.save(); ctx.translate(cx,cy);
  const s = r*0.95;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  if(type==='star'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a1 = -Math.PI/2 + i*(2*Math.PI/5), a2 = a1 + Math.PI/5;
      const ox=Math.cos(a1)*s*0.55, oy=Math.sin(a1)*s*0.55, ix=Math.cos(a2)*s*0.22, iy=Math.sin(a2)*s*0.22;
      if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
      ctx.lineTo(ix,iy);
    }
    ctx.closePath(); ctx.fill();
  } else if(type==='people'){
    ctx.beginPath(); ctx.arc(-s*0.2,-s*0.08,s*0.17,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.2,-s*0.08,s*0.17,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s*0.42,s*0.4); ctx.quadraticCurveTo(0,s*0.05,s*0.42,s*0.4); ctx.lineTo(s*0.42,s*0.55); ctx.lineTo(-s*0.42,s*0.55); ctx.closePath(); ctx.fill();
  } else if(type==='clip'){
    ctx.lineWidth = s*0.1;
    ctx.strokeRect(-s*0.3,-s*0.35,s*0.6,s*0.7);
    ctx.beginPath(); ctx.moveTo(-s*0.15,-s*0.35); ctx.lineTo(-s*0.15,-s*0.46); ctx.lineTo(s*0.15,-s*0.46); ctx.lineTo(s*0.15,-s*0.35); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s*0.17,-s*0.05); ctx.lineTo(s*0.17,-s*0.05);
    ctx.moveTo(-s*0.17,s*0.12); ctx.lineTo(s*0.17,s*0.12);
    ctx.moveTo(-s*0.17,s*0.29); ctx.lineTo(s*0.02,s*0.29);
    ctx.lineWidth = s*0.08; ctx.stroke();
  } else if(type==='cal'){
    ctx.lineWidth = s*0.09;
    ctx.strokeRect(-s*0.32,-s*0.28,s*0.64,s*0.6);
    ctx.beginPath(); ctx.moveTo(-s*0.32,-s*0.06); ctx.lineTo(s*0.32,-s*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.15,-s*0.38); ctx.lineTo(-s*0.15,-s*0.2); ctx.moveTo(s*0.15,-s*0.38); ctx.lineTo(s*0.15,-s*0.2); ctx.stroke();
  } else if(type==='user'){
    ctx.beginPath(); ctx.arc(0,-s*0.16,s*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s*0.4,s*0.5); ctx.quadraticCurveTo(0,s*0.06,s*0.4,s*0.5); ctx.lineTo(s*0.4,s*0.55); ctx.lineTo(-s*0.4,s*0.55); ctx.closePath(); ctx.fill();
  } else if(type==='ribbon'){
    ctx.beginPath(); ctx.arc(0,-s*0.05,s*0.32,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.16,s*0.2); ctx.lineTo(-s*0.28,s*0.55); ctx.lineTo(-s*0.05,s*0.4); ctx.lineTo(s*0.05,s*0.4); ctx.lineTo(s*0.28,s*0.55); ctx.lineTo(s*0.16,s*0.2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* Real uploaded logo artwork, loaded once and cached as an Image so
   canvas drawImage() can use it (falls back to the hand-drawn
   drawLogoMark() if it hasn't loaded yet or fails to load). */
let _logoImg = null, _logoImgPromise = null;
function loadLogoImage(){
  if(_logoImgPromise) return _logoImgPromise;
  _logoImgPromise = new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ _logoImg = img; resolve(img); };
    img.onerror = ()=> resolve(null);
    img.src = LOGO_DATA_URI;
  });
  return _logoImgPromise;
}

function drawHeader(ctx, W, H, brandY, includeSwoosh){
  drawFrame(ctx, W, H);
  if(includeSwoosh !== false) drawBottomSwoosh(ctx, W, H);
  drawLanterns(ctx, W, H);
  // Leave clear space between the logo and the title text below it so
  // they never visually touch or crowd each other.
  const logoSize = 104;
  const logoGap = 36;
  const logoBottom = brandY - logoGap;
  if(_logoImg){
    const logoW = logoSize * (_logoImg.width / _logoImg.height);
    ctx.drawImage(_logoImg, W/2 - logoW/2, logoBottom - logoSize, logoW, logoSize);
  } else {
    drawLogoMark(ctx, W/2, logoBottom - logoSize, logoSize);
  }
  ctx.direction = 'rtl'; ctx.textAlign = 'center';
  ctx.fillStyle = PAL.green;
  ctx.font = "700 28px 'Amiri', serif";
  ctx.fillText('مركز السيد هاشم', W/2, brandY);
  ctx.font = "500 18px 'Tajawal'";
  ctx.fillText('لتعليم و تحفيظ القرآن الكريم', W/2, brandY+28);
}

const JUZ_ORDINALS = [null,'الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر',
  'الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون',
  'الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون'];

function juzOrdinal(n){
  return JUZ_ORDINALS[n] || String(n);
}

function formatJuzRange(juzVal){
  const nums = (String(juzVal).match(/\d+/g) || []).map(Number);
  if(nums.length === 0) return String(juzVal);
  const min = Math.min(...nums), max = Math.max(...nums);
  return min === max ? `الجزء ${juzOrdinal(min)}` : `من الجزء ${juzOrdinal(min)} حتى الجزء ${juzOrdinal(max)}`;
}

function certificateNumber(record){
  const d = new Date(record.date);
  const pad = n => String(n).padStart(2,'0');
  const idTail = String(record.id).replace(/\D/g,'').slice(-4).padStart(4,'0');
  return `QH-${d.getFullYear()}-${pad(d.getMonth()+1)}${pad(d.getDate())}-${idTail}`;
}

function gradeLabel(score){
  if(score>=95) return 'ممتاز جداً';
  if(score>=90) return 'ممتاز';
  if(score>=85) return 'جيد جداً';
  if(score>=80) return 'جيد';
  return 'مقبول';
}

async function drawCertificate(record){
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  await loadLogoImage();
  const W = 1500, H = 1000;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = PAL.cream; ctx.fillRect(0,0,W,H);

  drawHeader(ctx, W, H, 235, false);

  ctx.direction = 'rtl'; ctx.textAlign = 'center';

  ctx.fillStyle = PAL.gold;
  ctx.font = "700 70px 'Amiri', serif";
  ctx.fillText('شهادة اجتياز', W/2, 345);
  drawFlourish(ctx, W/2-260, 335, 16, PAL.gold);
  drawFlourish(ctx, W/2+260, 335, 16, PAL.gold);
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-225,368); ctx.lineTo(W/2+225,368); ctx.stroke();

  // "تشهد إدارة ..." — the word "إدارة" specifically drawn bold, rest at
  // normal weight, reconstructed in correct RTL reading order.
  (function(){
    const before = 'تشهد ', boldWord = 'إدارة', after = ' مركز السيد هاشم لتعليم وتحفيظ القرآن الكريم بأن الطالب';
    const normalFont = "500 29px 'Tajawal'", boldFont = "800 29px 'Tajawal'";
    ctx.textAlign = 'left';
    ctx.font = normalFont; const wBefore = ctx.measureText(before).width;
    ctx.font = boldFont; const wBold = ctx.measureText(boldWord).width;
    ctx.font = normalFont; const wAfter = ctx.measureText(after).width;
    let x = W/2 - (wBefore+wBold+wAfter)/2;
    ctx.fillStyle = PAL.ink;
    ctx.font = normalFont; ctx.fillText(after, x, 425); x += wAfter;
    ctx.font = boldFont; ctx.fillText(boldWord, x, 425); x += wBold;
    ctx.font = normalFont; ctx.fillText(before, x, 425);
    ctx.textAlign = 'center';
  })();

  ctx.fillStyle = PAL.green;
  ctx.font = "700 58px 'Amiri', serif";
  ctx.fillText(record.studentName, W/2, 495);
  ctx.strokeStyle = PAL.goldLight; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W/2-310,517); ctx.lineTo(W/2+310,517); ctx.stroke();

  ctx.fillStyle = PAL.ink;
  ctx.font = "500 28px 'Tajawal'";
  ctx.fillText('قد اجتاز اختبار حفظ وتلاوة', W/2, 565);

  drawPillBadge(ctx, W/2, 618, formatJuzRange(record.juz), "700 27px 'Tajawal'", 34, PAL.green, '#fff', 54);

  ctx.fillStyle = PAL.ink;
  ctx.font = "500 24px 'Tajawal'";
  ctx.fillText('بتقدير', W/2, 685);

  const grade = gradeLabel(record.score);
  ctx.fillStyle = PAL.green;
  ctx.font = "700 60px 'Amiri', serif";
  ctx.fillText(grade, W/2, 745);
  const gw = ctx.measureText(grade).width;
  drawFlourish(ctx, W/2-gw/2-30, 725, 12, PAL.gold);
  drawFlourish(ctx, W/2+gw/2+30, 725, 12, PAL.gold);

  ctx.fillStyle = PAL.ink;
  ctx.font = "500 23px 'Tajawal'";
  ctx.fillText('نسأل الله تعالى أن يبارك له في حفظه،', W/2, 805);
  ctx.fillText('وأن يجعله من أهل القرآن وخاصته.', W/2, 835);

  // Bottom info: one single row — تاريخ الإصدار، المحفّظ، مدير المركز،
  // المختبِر — evenly spread across the width using the side margins.
  function footerCol(cx, label, value){
    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.ink; ctx.font = "600 17px 'Tajawal'";
    ctx.fillText(label, cx, 900);
    ctx.font = "700 20px 'Tajawal'"; ctx.fillStyle = PAL.green;
    ctx.fillText(value, cx, 929);
  }
  const issueDateStr = new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
  footerCol(W-175, 'تاريخ إصدار الشهادة:', issueDateStr);
  footerCol(W-560, 'اسم المحفّظ:', record.teacherName || '—');
  footerCol(560, 'مدير المركز:', CENTER_DIRECTOR_NAME);
  footerCol(175, 'اسم المختبِر:', record.testerName);

  return canvas;
}

async function shareCertificate(record, btnEl){
  if(btnEl){ btnEl.disabled = true; }
  try{
    const canvas = await drawCertificate(record);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const fileName = `شهادة-${record.studentName}.png`.replace(/\s+/g,'-');
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({
        files: [file],
        title: 'شهادة اجتياز',
        text: `شهادة اجتياز الطالب ${record.studentName} - الدرجة: ${record.score}`,
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('تم حفظ الشهادة كصورة، تقدر ترسلها للمحفّظ من معرض الصور');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذّرت مشاركة الشهادة، حاول مرة ثانية');
    }
  }finally{
    if(btnEl){ btnEl.disabled = false; }
  }
}

/* ---------------- PROGRESS CERTIFICATE (شهادة تقدّم) ---------------- */
/* Groups consecutive completed juz numbers into ranges and writes them
   out in words, e.g. [1,2,3,7,9,10] -> "من الجزء الأول حتى الجزء
   الثالث، والجزء السابع، ومن الجزء التاسع حتى الجزء العاشر". */
function groupJuzRangesText(nums){
  if(!nums || nums.length===0) return 'لم يبدأ الحفظ بعد';
  const sorted = [...new Set(nums)].sort((a,b)=>a-b);
  const ranges = [];
  let start = sorted[0], prev = sorted[0];
  for(let i=1;i<=sorted.length;i++){
    const n = sorted[i];
    if(n === prev+1){ prev = n; continue; }
    ranges.push([start, prev]);
    start = n; prev = n;
  }
  return ranges.map(([a,b]) => a===b ? `الجزء ${juzOrdinal(a)}` : `من الجزء ${juzOrdinal(a)} حتى الجزء ${juzOrdinal(b)}`).join('، و');
}

/* Wraps Arabic text across multiple centered lines within maxWidth,
   used for the variable-length list of completed juz ranges. */
function wrapCenteredText(ctx, text, cx, startY, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let y = startY;
  words.forEach(word=>{
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, cx, y);
      line = word; y += lineHeight;
    } else {
      line = test;
    }
  });
  if(line) ctx.fillText(line, cx, y);
}

/* ---------------- SCORE-OVER-TIME CHART (student detail page) ---------------- */
function drawScoreChart(canvas, examsAsc){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = Math.max(280, rect.width || 320), H = 140;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);

  const padL = 30, padR = 12, padT = 14, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const scores = examsAsc.map(e=>e.score);
  const minScore = Math.max(0, Math.min(...scores) - 5);
  const maxScore = 100;

  // gridlines + y labels
  ctx.strokeStyle = 'rgba(107,99,85,0.18)';
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft') || '#6B6355';
  ctx.font = "500 10px 'Tajawal'";
  ctx.textAlign = 'left';
  [0,50,100].forEach(v=>{
    if(v < minScore) return;
    const y = padT + plotH * (1 - (v-minScore)/(maxScore-minScore));
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillText(String(v), 2, y+3);
  });

  // line
  const green = getComputedStyle(document.documentElement).getPropertyValue('--green') || '#1B4332';
  const gold = getComputedStyle(document.documentElement).getPropertyValue('--gold') || '#C08A28';
  ctx.strokeStyle = green.trim(); ctx.lineWidth = 2.2; ctx.beginPath();
  examsAsc.forEach((e,i)=>{
    const x = padL + (plotW * (examsAsc.length===1 ? 0.5 : i/(examsAsc.length-1)));
    const y = padT + plotH * (1 - (e.score-minScore)/(maxScore-minScore));
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // points
  examsAsc.forEach((e,i)=>{
    const x = padL + (plotW * (examsAsc.length===1 ? 0.5 : i/(examsAsc.length-1)));
    const y = padT + plotH * (1 - (e.score-minScore)/(maxScore-minScore));
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fillStyle = e.score>=80 ? green.trim() : '#A23E36'; ctx.fill();
  });

  // first/last date labels
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft') || '#6B6355';
  ctx.font = "500 10px 'Tajawal'";
  ctx.textAlign = 'right';
  const firstD = new Date(examsAsc[0].date).toLocaleDateString('ar-EG', {month:'short', day:'numeric'});
  const lastD = new Date(examsAsc[examsAsc.length-1].date).toLocaleDateString('ar-EG', {month:'short', day:'numeric'});
  ctx.fillText(firstD, padL+34, H-6);
  ctx.fillText(lastD, W-padR, H-6);
}

/* ---------------- PERIOD REPORT (شهري / سنوي) ---------------- */
async function drawMonthlyReport(period){
  period = period || 'month';
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  await loadLogoImage();
  const now = new Date();
  const periodLabel = period==='year'
    ? now.toLocaleDateString('ar-EG', {year:'numeric'})
    : now.toLocaleDateString('ar-EG', {year:'numeric', month:'long'});
  const periodExams = state.exams.filter(e=>{
    const d = new Date(e.date);
    if(period==='year') return d.getFullYear()===now.getFullYear();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });

  const byStudent = {};
  periodExams.forEach(e=>{
    const key = e.studentName.trim();
    if(!byStudent[key] || new Date(e.date) > new Date(byStudent[key].date)){
      byStudent[key] = { ...byStudent[key], date: e.date, teacherName: e.teacherName };
    }
    byStudent[key].count = (byStudent[key].count||0) + 1;
    byStudent[key].total = (byStudent[key].total||0) + e.score;
  });
  const rows = Object.keys(byStudent)
    .map(name => ({
      name, count: byStudent[name].count,
      avg: Math.round(byStudent[name].total / byStudent[name].count),
      teacherName: byStudent[name].teacherName,
      date: byStudent[name].date,
    }))
    .sort((a,b)=> b.count - a.count);

  const maxRows = 14;
  const shownRows = rows.slice(0, maxRows);
  const extra = rows.length - shownRows.length;
  const avgAll = periodExams.length ? Math.round(periodExams.reduce((s,e)=>s+e.score,0)/periodExams.length) : 0;

  const W = 1500;
  const rowH = 58;
  const tableTop = 615;
  const H = tableTop + 60 + shownRows.length*rowH + (extra>0?36:0) + 190;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = PAL.cream; ctx.fillRect(0,0,W,H);
  drawHeader(ctx, W, H, 225);

  ctx.direction = 'rtl'; ctx.textAlign = 'center';
  ctx.fillStyle = PAL.green;
  ctx.font = "700 46px 'Amiri', serif";
  ctx.fillText(period==='year' ? 'التقرير السنوي' : 'التقرير الشهري', W/2, 335);
  drawFlourish(ctx, W/2-180, 325, 14, PAL.gold);
  drawFlourish(ctx, W/2+180, 325, 14, PAL.gold);

  drawPillBadge(ctx, W/2, 385, periodLabel, "700 22px 'Tajawal'", 30, PAL.gold, '#fff', 46);

  // Stat cards
  const cardW = 380, cardH = 108, gap = 30, cardY = 435;
  const totalW = cardW*3 + gap*2;
  const startX = (W-totalW)/2;
  const cardsData = [
    { val: avgAll, lbl: 'متوسط الدرجات', icon:'star' },
    { val: rows.length, lbl: 'عدد الطلاب', icon:'people' },
    { val: periodExams.length, lbl: 'إجمالي الاختبارات', icon:'clip' },
  ];
  cardsData.forEach((c,i)=>{
    const x = startX + i*(cardW+gap);
    ctx.beginPath();
    ctx.moveTo(x+14,cardY); ctx.lineTo(x+cardW-14,cardY);
    ctx.arcTo(x+cardW,cardY,x+cardW,cardY+14,14);
    ctx.lineTo(x+cardW,cardY+cardH-14); ctx.arcTo(x+cardW,cardY+cardH,x+cardW-14,cardY+cardH,14);
    ctx.lineTo(x+14,cardY+cardH); ctx.arcTo(x,cardY+cardH,x,cardY+cardH-14,14);
    ctx.lineTo(x,cardY+14); ctx.arcTo(x,cardY,x+14,cardY,14);
    ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#E3D9C4'; ctx.lineWidth = 1.5; ctx.stroke();

    drawIconCircle(ctx, x+cardW-58, cardY+cardH/2, 30, c.icon, PAL.green);
    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.green; ctx.font = "700 34px 'Amiri', serif";
    ctx.fillText(String(c.val), x+cardW/2-25, cardY+cardH/2+2);
    ctx.fillStyle = PAL.inkSoft; ctx.font = "600 16px 'Tajawal'";
    ctx.fillText(c.lbl, x+cardW/2-25, cardY+cardH/2+30);
  });

  // Table
  const tX = startX, tW = totalW;
  const colWidths = { name:0.27, teacher:0.24, date:0.19, count:0.15, avg:0.15 };
  const cols = [
    { key:'name', label:'اسم الطالب', w: tW*colWidths.name },
    { key:'teacher', label:'المحفّظ', w: tW*colWidths.teacher },
    { key:'date', label:'آخر اختبار', w: tW*colWidths.date },
    { key:'count', label:'عدد الاختبارات', w: tW*colWidths.count },
    { key:'avg', label:'متوسط الدرجة', w: tW*colWidths.avg },
  ];
  // header row (rightmost column = اسم الطالب, matching RTL reading order)
  let cx = tX + tW;
  ctx.font = "700 19px 'Tajawal'";
  cols.forEach(col=>{
    const x0 = cx - col.w;
    ctx.fillStyle = PAL.green; ctx.fillRect(x0, tableTop, col.w, 54);
    ctx.strokeStyle = PAL.cream; ctx.lineWidth = 1; ctx.strokeRect(x0, tableTop, col.w, 54);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(col.label, x0+col.w/2, tableTop+34);
    col._x0 = x0;
    cx = x0;
  });

  ctx.font = "500 18px 'Tajawal'";
  shownRows.forEach((row,i)=>{
    const y = tableTop + 54 + i*rowH;
    ctx.fillStyle = i%2===0 ? '#FFFFFF' : '#FAF4E4';
    ctx.fillRect(tX, y, tW, rowH);
    const d = new Date(row.date);
    const dateStr = d.toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'});
    const values = { name:row.name, teacher:row.teacherName, date:dateStr, count:String(row.count), avg:String(row.avg) };
    ctx.fillStyle = PAL.ink;
    cols.forEach(col=>{
      ctx.textAlign = 'center';
      ctx.fillText(values[col.key], col._x0+col.w/2, y+rowH/2+6);
    });
  });
  ctx.strokeStyle = '#E3D9C4'; ctx.lineWidth = 1.5;
  ctx.strokeRect(tX, tableTop, tW, 54 + shownRows.length*rowH);

  let afterTableY = tableTop + 54 + shownRows.length*rowH + 30;
  if(extra>0){
    ctx.fillStyle = PAL.inkSoft; ctx.font = "500 16px 'Tajawal'"; ctx.textAlign = 'center';
    ctx.fillText(`و ${extra} طالب/ـة آخرين...`, W/2, afterTableY);
    afterTableY += 34;
  }

  // Dua plaque
  const plaqueW = 620, plaqueH = 110, plaqueX = W/2-plaqueW/2, plaqueY = afterTableY+10;
  ctx.beginPath();
  ctx.moveTo(plaqueX+30, plaqueY);
  ctx.lineTo(plaqueX+plaqueW-30, plaqueY);
  ctx.quadraticCurveTo(plaqueX+plaqueW, plaqueY, plaqueX+plaqueW, plaqueY+plaqueH/2);
  ctx.quadraticCurveTo(plaqueX+plaqueW, plaqueY+plaqueH, plaqueX+plaqueW-30, plaqueY+plaqueH);
  ctx.lineTo(plaqueX+30, plaqueY+plaqueH);
  ctx.quadraticCurveTo(plaqueX, plaqueY+plaqueH, plaqueX, plaqueY+plaqueH/2);
  ctx.quadraticCurveTo(plaqueX, plaqueY, plaqueX+30, plaqueY);
  ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = PAL.green; ctx.font = "600 21px 'Tajawal'"; ctx.textAlign = 'center';
  ctx.fillText('نسأل الله أن يتقبل من الجميع', W/2, plaqueY+45);
  ctx.fillText('وأن يجعل القرآن نوراً لهم في الدنيا والآخرة', W/2, plaqueY+78);

  return { canvas, monthExams: periodExams };
}

async function generateMonthlyReport(btnEl, period){
  period = period || 'month';
  if(btnEl) btnEl.disabled = true;
  try{
    const { canvas, monthExams } = await drawMonthlyReport(period);
    if(monthExams.length === 0){
      showToast(period==='year' ? 'لا توجد اختبارات مسجّلة هالسنة بعد' : 'لا توجد اختبارات مسجّلة هذا الشهر بعد');
      return;
    }
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const now = new Date();
    const fileName = period==='year'
      ? `تقرير-سنوي-${now.getFullYear()}.png`
      : `تقرير-شهري-${now.getFullYear()}-${now.getMonth()+1}.png`;
    const file = new File([blob], fileName, { type:'image/png' });
    const title = period==='year' ? 'التقرير السنوي' : 'التقرير الشهري';

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title, text: title + ' لمركز السيد هاشم' });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast(period==='year' ? 'تم حفظ التقرير السنوي كصورة' : 'تم حفظ التقرير الشهري كصورة');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذّر إصدار التقرير، حاول مرة ثانية');
    }
  }finally{
    if(btnEl) btnEl.disabled = false;
  }
}

/* Booking rules helpers (used by the schedule form) — see requirement:
   bookings only on Sat/Mon/Wed, max BOOKING_MAX_PER_DAY per day, and a
   student whose most recent exam was a fail (<80) within the last
   week can't book again until the cooldown passes. */
function isAllowedBookingDay(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  return BOOKING_ALLOWED_WEEKDAYS.includes(d.getDay());
}
function bookingDayCount(dateStr){
  return state.schedule.filter(s=>s.date===dateStr && !s.done).length;
}
function studentBookingBlockedReason(studentName){
  const trimmed = (studentName||'').trim();
  if(!trimmed) return null;
  const examsForStudent = state.exams.filter(e=>e.studentName.trim()===trimmed).sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!examsForStudent.length) return null;
  const last = examsForStudent[0];
  const daysSince = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24);
  if(last.score < 80 && daysSince < BOOKING_FAIL_COOLDOWN_DAYS){
    const daysLeft = Math.max(1, Math.ceil(BOOKING_FAIL_COOLDOWN_DAYS - daysSince));
    const daysWord = daysLeft===1 ? 'يوم واحد' : daysLeft===2 ? 'يومين' : `${daysLeft} أيام`;
    return `المحفظ الحبيب: في حال عدم نجاح الطالب في الاختبار يحرم من الحجز خلال أسبوع. (متبقي تقريباً ${daysWord})`;
  }
  return null;
}

function attachScheduleHandlers(){
  document.querySelectorAll('.notif-read').forEach(b=>{
    b.onclick = async ()=>{
      const n = state.notifications.find(x=>x.id===b.dataset.id);
      if(n){
        if(!n.readBy) n.readBy = [];
        if(!n.readBy.includes(state.currentUser)) n.readBy.push(state.currentUser);
        await saveNotifications();
        render();
      }
    };
  });

  const toggleBtn = document.getElementById('btn-toggle-schedule-form');
  const formWrap = document.getElementById('schedule-form-wrap');
  if(toggleBtn && formWrap) toggleBtn.onclick = ()=>{
    formWrap.style.display = formWrap.style.display==='none' ? 'block' : 'none';
  };

  const saveBtn = document.getElementById('btn-save-schedule');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const errEl = document.getElementById('sch-error');
    if(errEl) errEl.textContent = '';
    const studentName = document.getElementById('sch-student').value.trim();
    const date = document.getElementById('sch-date').value;
    const note = document.getElementById('sch-note').value.trim();
    const teacherSel = document.getElementById('sch-teacher');
    const teacherName = state.currentRole==='teacher' ? (state.currentTeacherLink || '') : (teacherSel ? teacherSel.value : '');
    if(!studentName || !date){ showToast('الرجاء تعبئة اسم الطالب والتاريخ'); return; }
    if(!isAllowedBookingDay(date)){
      const msg = 'الحجز متاح بس أيام السبت والاثنين والأربعاء — اختر تاريخ تاني.';
      if(errEl) errEl.textContent = msg; showToast(msg); return;
    }
    if(bookingDayCount(date) >= BOOKING_MAX_PER_DAY){
      const msg = `المحفظ الحبيب: العدد عند المختبر مكتمل لهذا اليوم (${BOOKING_MAX_PER_DAY} طلاب) — بإمكانك تحجز بموعد تاني.`;
      if(errEl) errEl.textContent = msg; showToast(msg); return;
    }
    const blockReason = studentBookingBlockedReason(studentName);
    if(blockReason){
      if(errEl) errEl.textContent = blockReason; showToast(blockReason); return;
    }
    state.schedule.push({ id: 'sc_' + Date.now(), studentName, teacherName, date, note, done:false, createdAt: new Date().toISOString() });
    await saveSchedule();
    showToast('تم إضافة الموعد');
    render();
  };

  document.querySelectorAll('.sch-done').forEach(b=>{
    b.onclick = async ()=>{
      const item = state.schedule.find(s => s.id===b.dataset.id);
      if(item) item.done = true;
      await saveSchedule();
      render();
    };
  });

  document.querySelectorAll('.sch-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('حذف هذا الموعد؟')) return;
      state.schedule = state.schedule.filter(s => s.id!==b.dataset.id);
      await saveSchedule();
      render();
    };
  });
}

    const phoneDigits = student.phone.replace(/[^\d+]/g, '').replace(/^0+/, '');

    <p style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">اعمل نسخة احتياطية وقت ما بدك، وقدر تحدّثها لاحقاً بأحدث البيانات أو تسترجعها أو تحذفها.</p>
    <div class="data-btn-row">
      <button id="btn-create-manual-backup">+ إنشاء نسخة احتياطية الآن</button>
    </div>
    ${manualBackups.length===0
      ? `<p style="font-size:12px; color:var(--ink-soft); margin-top:8px;">ما في نسخ احتياطية يدوية بعد.</p>`
      : manualBackups.map(b=>`
        <div class="backup-row">
          <span>${escapeHtml(b.label)}</span>
          <span style="display:flex;gap:6px;">
            <button class="update-manual-backup" data-key="${b.key}">تحديث</button>
            <button class="restore-backup" data-key="${b.key}">استرجاع</button>
            <button class="del-manual-backup" data-key="${b.key}">حذف</button>
          </span>
        </div>`).join('')
    }
  </div>

  <div class="settings-block">
    <h3>البيانات</h3>
    ${(!firebaseAuth || isAdmin) ? `<button class="btn btn-danger" id="btn-clear-data">حذف جميع سجلات الاختبارات</button>` : `<p style="font-size:12px; color:var(--ink-soft);">حذف كل السجلات متاح للمدير فقط.</p>`}
  </div>

  ${(!firebaseAuth && isAdmin) ? `
  <div class="settings-block">
    <h3 style="color:var(--red);">إعادة ضبط كاملة</h3>
    <p style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">بيمسح كل شي نهائياً — الاختبارات، الطلاب، المواعيد، وكل الحسابات (بما فيها حسابك) — والبرنامج برجع بالضبط زي أول مرة فتحته، وبيطلبلك تعمل حساب مدير جديد من الصفر. اعمل نسخة احتياطية أو صدّر البيانات قبل ما تكمل، لأنه مافي رجعة بعدها.</p>
    <button class="btn btn-danger" id="btn-full-reset">إعادة ضبط البرنامج بالكامل والبدء من جديد</button>
  </div>
  ` : ''}
  ` : `
  <div class="settings-block">
    <p style="font-size:12px; color:var(--ink-soft);">إدارة الحسابات، تصدير/استيراد البيانات، والنسخ الاحتياطية متاحة للمدير والمختبِر فقط.</p>
  </div>
  `}

  <button class="btn btn-ghost" id="btn-logout-2">تسجيل الخروج</button>
  `;
}

function attachSettingsHandlers(){
  const themeBtn = document.getElementById('btn-toggle-theme');
  if(themeBtn) themeBtn.onclick = toggleTheme;

  const sendNotifBtn = document.getElementById('btn-send-notif');
  if(sendNotifBtn) sendNotifBtn.onclick = async ()=>{
    const targetSel = document.getElementById('notif-target');
    const msgEl = document.getElementById('notif-message');
    const message = msgEl.value.trim();
    if(!message){ showToast('اكتب نص الإشعار الأول'); return; }
    state.notifications.unshift({
      id: 'nt_' + Date.now(),
      message,
      teacherName: targetSel.value || null,
      from: state.currentUser,
      createdAt: new Date().toISOString(),
      readBy: [],
    });
    await saveNotifications();
    showToast('تم إرسال الإشعار');
    render();
  };

  document.querySelectorAll('.del-notif').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('حذف هذا الإشعار؟')) return;
      state.notifications = state.notifications.filter(n=>n.id!==b.dataset.id);
      await saveNotifications();
      render();
    };
  });

  const exportJsonBtn = document.getElementById('btn-export-json');
  if(exportJsonBtn) exportJsonBtn.onclick = exportDataJSON;

  const exportExcelBtn = document.getElementById('btn-export-excel');
  if(exportExcelBtn) exportExcelBtn.onclick = exportDataExcel;

  const importTriggerBtn = document.getElementById('btn-import-trigger');
  const importInput = document.getElementById('import-file-input');
  if(importTriggerBtn && importInput){
    importTriggerBtn.onclick = ()=> importInput.click();
    importInput.onchange = ()=>{
      if(importInput.files && importInput.files[0]){
        if(confirm('رح يتم دمج بيانات الملف مع البيانات الحالية، بدون حذف أي شي موجود. متابعة؟')){
          importDataFromFile(importInput.files[0]);
        }
        importInput.value = '';
      }
    };
  }

  document.querySelectorAll('.restore-backup').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('استرجاع هذه النسخة رح يستبدل كل البيانات الحالية بمحتوى النسخة الاحتياطية. متابعة؟')){
        restoreBackup(b.dataset.key);
      }
    };
  });

  const createManualBackupBtn = document.getElementById('btn-create-manual-backup');
  if(createManualBackupBtn) createManualBackupBtn.onclick = ()=>{
    const label = prompt('اسم النسخة الاحتياطية (اختياري):', '');
    if(label === null) return; // cancelled
    createManualBackup(label);
    showToast('تم إنشاء النسخة الاحتياطية');
    render();
  };

  document.querySelectorAll('.update-manual-backup').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('تحديث هذه النسخة رح يستبدل محتواها بأحدث البيانات الحالية. متابعة؟')){
        updateManualBackup(b.dataset.key);
        showToast('تم تحديث النسخة الاحتياطية');
        render();
      }
    };
  });

  document.querySelectorAll('.del-manual-backup').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('حذف هذه النسخة الاحتياطية نهائياً؟')){
        deleteManualBackup(b.dataset.key);
        showToast('تم حذف النسخة الاحتياطية');
        render();
      }
    };
  });

  document.getElementById('btn-change-pass').onclick = async ()=>{
    const val = document.getElementById('new-pass').value;
    if(!val || val.length<4){ showToast('كلمة المرور يجب ألا تقل عن 4 أحرف'); return; }

    if (firebaseAuth){
      if(val.length < 6){ showToast('كلمة المرور يجب ألا تقل عن 6 أحرف'); return; }
      try{
        await firebaseAuth.currentUser.updatePassword(val);
        showToast('تم تحديث كلمة المرور');
        document.getElementById('new-pass').value = '';
      }catch(e){
        showToast(mapAuthError(e));
      }
      return;
    }

    const acc = state.accounts.find(a=>a.username===state.currentUser);
    if(acc){ acc.password = val; await saveAccounts(); showToast('تم تحديث كلمة المرور'); render(); }
  };

  // Account management: works in both Firebase Auth mode (writes to
  // Firestore) and legacy mode (writes to the shared local accounts array).
  const saveMyEmailBtn = document.getElementById('btn-save-my-email');
  if(saveMyEmailBtn) saveMyEmailBtn.onclick = async ()=>{
    const val = document.getElementById('my-email').value.trim();
    if(!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ showToast('اكتب بريد إلكتروني صحيح'); return; }
    const myAcc = state.accounts.find(a=>(a.localId && a.localId===state.currentLocalId) || (!state.currentLocalId && a.username===state.currentUser));
    if(!myAcc) return;
    if(state.accounts.some(a=>a!==myAcc && (a.email||'').toLowerCase()===val.toLowerCase())){
      showToast('هذا البريد الإلكتروني مستخدم من حساب تاني'); return;
    }
    myAcc.email = val; await saveAccounts(); showToast('تم حفظ البريد الإلكتروني'); render();
  };

  document.querySelectorAll('.save-email').forEach(b=>{
    b.onclick = async ()=>{
      const lid = b.dataset.lid;
      const input = document.querySelector(`.email-edit[data-lid="${CSS.escape(lid)}"]`);
      if(!input) return;
      const val = input.value.trim();
      if(!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ showToast('اكتب بريد إلكتروني صحيح'); return; }
      const acc = state.accounts.find(a=>a.localId===lid);
      if(!acc) return;
      if(state.accounts.some(a=>a!==acc && (a.email||'').toLowerCase()===val.toLowerCase())){
        showToast('هذا البريد الإلكتروني مستخدم من حساب تاني'); return;
      }
      acc.email = val; await saveAccounts(); showToast('تم حفظ البريد الإلكتروني'); render();
    };
  });

  document.querySelectorAll('.toggle-acct').forEach(b=>{
    b.onclick = async ()=>{
      const uid = b.dataset.uid;
      const lid = b.dataset.lid;
      if(firebaseAuth){
        if(!uid) return;
        const acc = state.accounts.find(a=>a.uid===uid);
        const willDisable = !(acc && acc.disabled);
        if(!confirm(willDisable ? 'تعطيل هذا الحساب؟ لن يقدر صاحبه يسجّل دخول.' : 'تفعيل هذا الحساب؟')) return;
        try{
          await firestoreDb.collection('users').doc(uid).update({ disabled: willDisable });
          await loadAccountsFromFirestore();
          showToast(willDisable ? 'تم تعطيل الحساب' : 'تم تفعيل الحساب');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        const acc = state.accounts.find(a=>a.localId===lid);
        if(!acc) return;
        const willDisable = !acc.disabled;
        if(!confirm(willDisable ? 'تعطيل هذا الحساب؟ لن يقدر صاحبه يسجّل دخول.' : 'تفعيل هذا الحساب؟')) return;
        acc.disabled = willDisable;
        await saveAccounts();
        showToast(willDisable ? 'تم تعطيل الحساب' : 'تم تفعيل الحساب');
        render();
      }
    };
  });

  document.querySelectorAll('.role-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.dataset.uid;
      const lid = sel.dataset.lid;
      const newRole = sel.value;
      if(!confirm(`تبديل دور هذا الحساب إلى "${roleLabel[newRole]}"؟`)){ render(); return; }
      if(firebaseAuth){
        if(!uid) return;
        try{
          const updates = { role: newRole };
          if(newRole !== 'teacher') updates.teacherLink = null;
          await firestoreDb.collection('users').doc(uid).update(updates);
          await loadAccountsFromFirestore();
          showToast('تم تحديث الدور');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        const acc = state.accounts.find(a=>a.localId===lid);
        if(!acc) return;
        acc.role = newRole;
        if(newRole !== 'teacher') acc.teacherLink = null;
        await saveAccounts();
        showToast('تم تحديث الدور');
        render();
      }
    };
  });

  document.querySelectorAll('.teacher-link-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.dataset.uid;
      const lid = sel.dataset.lid;
      const newLink = sel.value || null;
      if(firebaseAuth){
        if(!uid) return;
        try{
          await firestoreDb.collection('users').doc(uid).update({ teacherLink: newLink });
          await loadAccountsFromFirestore();
          showToast('تم ربط الحساب بالمحفّظ');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        const acc = state.accounts.find(a=>a.localId===lid);
        if(!acc) return;
        acc.teacherLink = newLink;
        await saveAccounts();
        showToast('تم ربط الحساب بالمحفّظ');
        render();
      }
    };
  });

  // Deletes the account's Firestore profile. In Firebase mode this is
  // effectively a full delete from the app's point of view — without a
  // profile doc the account can no longer sign in (onAuthStateChanged
  // signs them out automatically, see app startup code below). Note: the
  // underlying Firebase Authentication login entry itself can only be
  // fully removed from the Firebase Console (client apps can't delete
  // other users' Auth entries without a backend) — this is rare to need
  // since the account is already locked out of the app either way.
  document.querySelectorAll('.del-acct').forEach(b=>{
    b.onclick = async ()=>{
      const uid = b.dataset.uid;
      const lid = b.dataset.lid;
      if(firebaseAuth){
        if(!uid) return;
        if(!confirm('حذف هذا الحساب نهائياً؟ لن يقدر صاحبه يسجّل دخول أو يستخدم البرنامج بعدها.')) return;
        try{
          await firestoreDb.collection('users').doc(uid).delete();
          await loadAccountsFromFirestore();
          showToast('تم حذف الحساب');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        if(!confirm('حذف هذا الحساب؟')) return;
        state.accounts = state.accounts.filter(a=>a.localId!==lid);
        await saveAccounts();
        render();
      }
    };
  });

  const refreshAcctsBtn = document.getElementById('btn-refresh-accounts');
  if(refreshAcctsBtn) refreshAcctsBtn.onclick = async ()=>{
    refreshAcctsBtn.disabled = true;
    await loadAccountsFromFirestore();
    showToast('تم تحديث قائمة الحسابات');
    render();
  };

  const clearBtn = document.getElementById('btn-clear-data');
  if(clearBtn) clearBtn.onclick = async ()=>{
    if(!confirm('سيتم حذف جميع سجلات الاختبارات نهائياً. هل أنت متأكد؟')) return;
    state.exams = [];
    await saveExams();
    showToast('تم حذف جميع السجلات');
    render();
  };

  // Full factory reset (legacy/local mode, admin only) — wipes every
  // stored collection including accounts, then drops back to the
  // "create the first admin account" screen, exactly like a brand-new
  // install. Guarded by two separate confirmations since it cannot be
  // undone from inside the app.
  const fullResetBtn = document.getElementById('btn-full-reset');
  if(fullResetBtn) fullResetBtn.onclick = async ()=>{
    if(!confirm('هاد رح يمسح كل شي نهائياً: الاختبارات، الطلاب، المواعيد، وكل الحسابات (بما فيها حسابك). ما في رجعة بعد هالخطوة. متأكد إنك بدك تكمل؟')) return;
    const typed = prompt('اكتب كلمة "حذف" بالضبط للتأكيد النهائي:');
    if(typed !== 'حذف'){ showToast('ما تمت العملية — الكلمة المكتوبة مش مطابقة'); return; }
    state.exams = [];
    state.students = [];
    state.schedule = [];
    state.accounts = [];
    state.notifications = [];
    await saveExams();
    await saveStudents();
    await saveSchedule();
    await saveAccounts();
    await saveNotifications();
    state.currentUser = null;
    state.currentRole = null;
    state.currentTeacherLink = null;
    state.currentLocalId = null;
    state.authMode = 'register';
    showToast('تم إعادة ضبط البرنامج بالكامل');
    render();
  };

  document.getElementById('btn-logout-2').onclick = doLogout;
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

/* App startup:
   - Firebase Auth mode: wait for Firebase to report whether a session
     is already persisted (auto-login across reloads) before rendering,
     and re-check the user's Firestore profile (role/disabled) every
     time auth state changes.
   - Legacy mode: no session to restore, just load data and render. */
if (firebaseAuth){
  let firstAuthCheck = true;
  let firstCheckDone = false;

  // Failsafe: on a slow/flaky connection, Firebase's initial handshake
  // (and the Firestore profile lookup below) can hang far longer than a
  // user will wait. If nothing has resolved within 6 seconds, stop
  // waiting and show the login screen anyway — onAuthStateChanged keeps
  // listening in the background and will still update the view later
  // if/when the connection catches up.
  const finishFirstCheck = async ()=>{
    if (firstCheckDone) return;
    firstCheckDone = true;
    firstAuthCheck = false;
    await loadAppData();
  };
  setTimeout(()=>{ finishFirstCheck(); }, 6000);

  firebaseAuth.onAuthStateChanged(async (user)=>{
    if (user){
      try{
        const timeout = new Promise((_,reject)=> setTimeout(()=> reject(new Error('timeout')), 8000));
        const doc = await Promise.race([
          firestoreDb.collection('users').doc(user.uid).get(),
          timeout
        ]);
        if (doc.exists && !doc.data().disabled){
          state.currentUser = doc.data().username;
          state.currentRole = doc.data().role || 'examiner';
          state.currentTeacherLink = doc.data().teacherLink || null;
          state.currentUid = user.uid;
        } else {
          await firebaseAuth.signOut();
          state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
        }
      }catch(e){
        console.warn('تعذّر تحميل بيانات الحساب', e);
      }
    } else {
      state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
    }
    if (!firstCheckDone){
      await finishFirstCheck();
    } else {
      render();
    }
  });
} else {
  loadAppData();
}

/* Connectivity feedback: lets the examiner know their results are
   still safe (saved locally) even with no internet, and confirms when
   everything has synced back up automatically. */
window.addEventListener('offline', ()=>{
  showToast('غير متصل بالإنترنت — النتائج بتنحفظ عندك وبترفع تلقائياً لما يرجع الاتصال');
});
window.addEventListener('online', ()=>{
  showToast('رجع الاتصال بالإنترنت — جاري رفع البيانات المحفوظة');
});

/* Register the service worker so the app shell (this page's HTML/CSS/JS,
   fonts, and icons) loads instantly even with zero connectivity — the
   actual data (exams/students/schedule/accounts) is handled separately
   by Firestore's own offline persistence above. Must be served over
   https:// (or from localhost) — browsers block service workers on
   file:// and plain http://, so this silently does nothing in those
   cases rather than breaking the app. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .catch(e => console.warn('تعذّر تسجيل service worker', e));
  });
}

</script>
