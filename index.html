function appCreditHTML(){ return `<div class="app-credit"><img src="${APP_SIGNATURE_IMG}" alt="التوقيع الإلكتروني"><span>©2026</span></div>`; }

function authScreen(){
  const isRegister = state.authMode === 'register' || (state.accounts.length === 0 && !accountsLoadFailed);
  const isRecover = state.authMode === 'recover' && state.accounts.length > 0;
  const cs = getCenterSettings();
  return `
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand-mark"><img src="${cs.logoDataUri}" alt="شعار ${escapeHtml(cs.name)}"></div>
      <div class="brand-name">${escapeHtml(cs.name)}</div>
      <div class="brand-badge">${escapeHtml(cs.tagline)}</div>
      <div class="brand-title-row">
        ${sparkleIconSvg()}
        <h1>برنامج اختبارات القرآن الكريم</h1>
        ${sparkleIconSvg()}
      </div>
      <div class="brand-sub-row">
        <span class="ln"></span>
        <p>${escapeHtml(cs.fullName)}</p>
        <span class="ln"></span>
      </div>
    </div>
    <div class="card">
      ${isRecover ? recoverForm() : (isRegister ? registerForm() : loginForm())}
    </div>
    ${appCreditHTML()}
  </div>`;
}

function sparkleIconSvg(){
  return `<svg viewBox="0 0 24 24"><path d="M12 2c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6z"/></svg>`;
}
function userIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
}
function lockIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
}
function eyeIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
}
function loginIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>`;
}
function bookIconSvg(){
  return `<svg viewBox="0 0 24 24"><path d="M12 3C9.5 1.5 6 1.5 3 3v16c3-1.5 6.5-1.5 9 0 2.5-1.5 6-1.5 9 0V3c-3-1.5-6.5-1.5-9 0z"/></svg>`;
}

function loginForm(){
  return `
    <div class="field">
      <div class="field-label-row">
        <div class="field-icon">${userIconSvg()}</div>
        <label>البريد الإلكتروني</label>
      </div>
      <div class="input-wrap">
        <span class="in-icon">${userIconSvg()}</span>
        <input type="email" id="login-email" placeholder="أدخل بريدك الإلكتروني">
      </div>
    </div>
    <div class="field">
      <div class="field-label-row">
        <div class="field-icon">${lockIconSvg()}</div>
        <label>كلمة المرور</label>
      </div>
      <div class="input-wrap">
        <span class="in-icon">${lockIconSvg()}</span>
        <input type="password" id="login-pass" placeholder="أدخل كلمة المرور">
        <button type="button" class="toggle-eye" id="toggle-login-pass">${eyeIconSvg()}</button>
      </div>
    </div>
    <div class="options-row">
      <button type="button" class="forgot-link" id="forgot-pass">نسيت كلمة المرور؟</button>
      <label class="remember-row"><input type="checkbox" id="remember-me"> تذكرني</label>
    </div>
    <div id="auth-error" class="error-msg"></div>
    <button class="btn btn-primary" id="btn-login">تسجيل الدخول ${loginIconSvg()}</button>
    <p class="hint">لا تملك حساباً؟ <button class="link-btn" id="go-register">إنشاء حساب جديد</button></p>
    ${!firebaseAuth ? `<p class="hint">ما بتعرف تدخل ولا بتذكر الإيميل؟ <button class="link-btn" id="go-recover">استرجاع الوصول للحساب</button></p>` : ''}
    <div class="card-footer-divider"><span class="ln"></span>${bookIconSvg()}<span class="ln"></span></div>
    <div class="card-footer-text">${sparkleIconSvg()} خيركم من تعلم القرآن و علمه ${sparkleIconSvg()}</div>
  `;
}

/* Legacy-mode, on-device account recovery — lets someone locked out
   (missing/forgotten email, or forgotten password) regain access from
   right inside the app, no developer tools or desktop needed. Works by
   matching the account by username (not email, since that's exactly
   what may be missing) and directly updating its email/password in the
   local accounts store. Only shown when Firebase Auth isn't configured;
   with Firebase, the real "نسيت كلمة المرور" email flow is the correct,
   secure path instead. */
function recoverForm(){
  return `
    <p class="hint" style="margin-bottom:14px; font-weight:700; color:var(--ink);">استرجاع الوصول للحساب</p>
    <p class="hint" style="margin-bottom:14px;">اختر حسابك من القائمة وحدّد بريد إلكتروني (وكلمة سر جديدة لو نسيتها)، وبتقدر تسجّل دخول فوراً بعدها.</p>
    <div class="field">
      <label>اختر الحساب</label>
      <select id="rec-username">
        ${state.accounts.map((a,i)=>`<option value="${escapeHtml(a.localId||a.username)}">${escapeHtml(a.username)}${a.email ? ' — ' + escapeHtml(a.email) : ''}${a.role ? ' — ' + (roleLabel[a.role]||a.role) : ''}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <div class="field-label-row">
        <div class="field-icon">${userIconSvg()}</div>
        <label>البريد الإلكتروني (جديد أو للتصحيح)</label>
      </div>
      <div class="input-wrap">
        <span class="in-icon">${userIconSvg()}</span>
        <input type="email" id="rec-email" placeholder="اكتب بريدك الإلكتروني">
      </div>
    </div>
    <div class="field">
      <div class="field-label-row">
        <div class="field-icon">${lockIconSvg()}</div>
        <label>كلمة مرور جديدة (اختياري — اتركها فاضية لو بتذكر القديمة)</label>
      </div>
      <div class="input-wrap">
        <span class="in-icon">${lockIconSvg()}</span>
        <input type="password" id="rec-pass" placeholder="اتركها فاضية لو مش بدك تغيّرها">
        <button type="button" class="toggle-eye" id="toggle-rec-pass">${eyeIconSvg()}</button>
      </div>
    </div>
    <div id="auth-error" class="error-msg"></div>
    <button class="btn btn-primary" id="btn-recover">حفظ واسترجاع الوصول</button>
    <p class="hint"><button class="link-btn" id="go-login-from-recover">‹ رجوع لتسجيل الدخول</button></p>
  `;
}

function registerForm(){
  const forced = state.accounts.length === 0;
  return `
    ${forced ? '<p class="hint" style="margin-bottom:10px;">أنشئ أول حساب مدير لبدء استخدام التطبيق</p>' : ''}
    <div class="field">
      <label>الاسم الكامل</label>
      <input type="text" id="reg-user" placeholder="اسمك الكامل">
    </div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="reg-email" placeholder="بريدك الإلكتروني (لاستعادة كلمة المرور)">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="reg-pass" placeholder="اختر كلمة مرور">
    </div>
    ${!forced ? `
    <div class="field">
      <label>نوع الحساب</label>
      <select id="reg-role">
        <option value="examiner">مختبِر (يدير البرنامج)</option>
        <option value="teacher">محفّظ (يحجز اختبارات ويطّلع على نتائج طلابه)</option>
      </select>
    </div>
    <div class="field" id="reg-teacher-link-wrap" style="display:none;">
      <label>أي محفّظ من القائمة أنت؟</label>
      <select id="reg-teacher-link">
        <option value="">اختر اسمك من القائمة</option>
        ${TEACHERS.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
      </select>
    </div>` : ''}
    <div id="auth-error" class="error-msg"></div>
    <button class="btn btn-primary" id="btn-register">إنشاء الحساب</button>
    ${!forced ? '<p class="hint">لديك حساب بالفعل؟ <button class="link-btn" id="go-login">تسجيل الدخول</button></p>' : ''}
  `;
}

function attachAuthHandlers(){
  const goReg = document.getElementById('go-register');
  if(goReg) goReg.onclick = ()=>{ state.authMode='register'; render(); };
  const goLog = document.getElementById('go-login');
  if(goLog) goLog.onclick = ()=>{ state.authMode='login'; render(); };

  const btnLogin = document.getElementById('btn-login');
  if(btnLogin) btnLogin.onclick = async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const p = document.getElementById('login-pass').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if(!email || !p){ errEl.textContent='الرجاء إدخال البريد الإلكتروني وكلمة المرور'; return; }

    if (firebaseAuth){
      btnLogin.disabled = true;
      try{
        const cred = await firebaseAuth.signInWithEmailAndPassword(email, p);
        const doc = await firestoreDb.collection('users').doc(cred.user.uid).get();
        const data = doc.exists ? doc.data() : null;
        if(!data || data.disabled){
          await firebaseAuth.signOut();
          errEl.textContent = data && data.disabled ? 'هذا الحساب معطّل — تواصل مع المدير' : 'تعذّر إيجاد بيانات الحساب';
          return;
        }
        state.currentUser = data.username || email;
        state.currentRole = data.role || 'examiner';
        state.currentTeacherLink = data.teacherLink || null;
        state.currentUid = cred.user.uid;
        state.view = state.currentRole==='teacher' ? 'schedule' : 'dashboard';
        render();
      }catch(e){
        errEl.textContent = mapAuthError(e);
      }finally{
        btnLogin.disabled = false;
      }
      return;
    }

    // Legacy fallback (no Firebase Auth configured — see setup notes above).
    const found = state.accounts.find(a=> (a.email||'').toLowerCase()===email.toLowerCase() && a.password===p);
    if(!found){ errEl.textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة'; return; }
    if(found.disabled){ errEl.textContent='هذا الحساب معطّل — تواصل مع المدير'; return; }
    state.currentUser = found.username;
    state.currentRole = found.role || 'examiner';
    state.currentTeacherLink = found.teacherLink || null;
    state.currentLocalId = found.localId || null;
    state.view = state.currentRole==='teacher' ? 'schedule' : 'dashboard';
    render();
  };

  // Allow pressing Enter in either login field to submit.
  const loginEmail = document.getElementById('login-email');
  const loginPass = document.getElementById('login-pass');
  [loginEmail, loginPass].forEach(el => {
    if(el) el.addEventListener('keydown', e => {
      if(e.key === 'Enter') btnLogin.click();
    });
  });

  // Remember-me: prefill last used email if previously saved.
  const rememberBox = document.getElementById('remember-me');
  if(loginEmail){
    const savedEmail = localStorage.getItem('remembered-email');
    if(savedEmail){ loginEmail.value = savedEmail; if(rememberBox) rememberBox.checked = true; }
  }
  if(btnLogin){
    const originalOnclick = btnLogin.onclick;
    btnLogin.onclick = ()=>{
      originalOnclick();
      if(rememberBox){
        if(rememberBox.checked) localStorage.setItem('remembered-email', loginEmail.value.trim());
        else localStorage.removeItem('remembered-email');
      }
    };
  }

  // Toggle password visibility.
  const toggleEye = document.getElementById('toggle-login-pass');
  if(toggleEye) toggleEye.onclick = ()=>{
    const isHidden = loginPass.type === 'password';
    loginPass.type = isHidden ? 'text' : 'password';
  };

  // Forgot password — sends a real reset email via Firebase Auth when
  // the app is connected to Firebase; otherwise explains that this
  // requires the Firebase setup described at the top of the code, and
  // that an admin can reset the password manually from Settings.
  const forgotBtn = document.getElementById('forgot-pass');
  if(forgotBtn) forgotBtn.onclick = async ()=>{
    const errEl = document.getElementById('auth-error');
    const emailVal = document.getElementById('login-email').value.trim();
    if(!firebaseAuth){
      showToast('استرجاع كلمة المرور عبر البريد يتطلب ربط التطبيق بـ Firebase — لحد هيك تواصل مع المدير ليعيد تعيينها لك من الإعدادات');
      return;
    }
    if(!emailVal){ if(errEl) errEl.textContent = 'اكتب بريدك الإلكتروني بالحقل فوق أولاً'; return; }
    forgotBtn.disabled = true;
    try{
      await firebaseAuth.sendPasswordResetEmail(emailVal);
      showToast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
    }catch(e){
      if(errEl) errEl.textContent = mapAuthError(e);
    }finally{
      forgotBtn.disabled = false;
    }
  };

  // On-device account recovery (legacy/local mode only) — see recoverForm().
  const goRecover = document.getElementById('go-recover');
  if(goRecover) goRecover.onclick = ()=>{ state.authMode='recover'; render(); };
  const goLoginFromRecover = document.getElementById('go-login-from-recover');
  if(goLoginFromRecover) goLoginFromRecover.onclick = ()=>{ state.authMode='login'; render(); };

  const recPass = document.getElementById('rec-pass');
  const toggleRecEye = document.getElementById('toggle-rec-pass');
  if(toggleRecEye && recPass) toggleRecEye.onclick = ()=>{
    const isHidden = recPass.type === 'password';
    recPass.type = isHidden ? 'text' : 'password';
  };

  const btnRecover = document.getElementById('btn-recover');
  if(btnRecover) btnRecover.onclick = async ()=>{
    const errEl = document.getElementById('auth-error');
    if(errEl) errEl.textContent = '';
    const localId = document.getElementById('rec-username').value;
    const email = document.getElementById('rec-email').value.trim();
    const newPass = recPass.value;
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      if(errEl) errEl.textContent = 'اكتب بريد إلكتروني صحيح'; return;
    }
    if(newPass && newPass.length < 4){
      if(errEl) errEl.textContent = 'كلمة المرور يجب ألا تقل عن 4 أحرف'; return;
    }
    if(state.accounts.some(a=>(a.localId||a.username)!==localId && (a.email||'').toLowerCase()===email.toLowerCase())){
      if(errEl) errEl.textContent = 'هذا البريد الإلكتروني مستخدم من حساب تاني'; return;
    }
    const acc = state.accounts.find(a=>(a.localId||a.username)===localId);
    if(!acc){ if(errEl) errEl.textContent = 'تعذّر إيجاد الحساب'; return; }
    acc.email = email;
    if(newPass) acc.password = newPass;
    await saveAccounts();
    // Log the recovered account straight in — no need to retype anything.
    state.currentUser = acc.username;
    state.currentRole = acc.role || 'examiner';
    state.currentTeacherLink = acc.teacherLink || null;
    state.currentLocalId = acc.localId || null;
    state.authMode = 'login';
    state.view = state.currentRole==='teacher' ? 'schedule' : 'dashboard';
    showToast('تم استرجاع الوصول وتسجيل الدخول بنجاح');
    render();
  };

  // Registration: role selector reveals the "which محفّظ am I" field.
  const roleSel = document.getElementById('reg-role');
  const teacherLinkWrap = document.getElementById('reg-teacher-link-wrap');
  if(roleSel && teacherLinkWrap){
    const syncTeacherLinkVisibility = ()=>{
      teacherLinkWrap.style.display = roleSel.value==='teacher' ? 'block' : 'none';
    };
    roleSel.onchange = syncTeacherLinkVisibility;
    syncTeacherLinkVisibility();
  }

  const btnReg = document.getElementById('btn-register');
  if(btnReg) btnReg.onclick = async ()=>{
    const u = document.getElementById('reg-user').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const p = document.getElementById('reg-pass').value;
    const forced = state.accounts.length === 0;
    const role = forced ? 'admin' : (document.getElementById('reg-role').value || 'examiner');
    const teacherLinkEl = document.getElementById('reg-teacher-link');
    const teacherLink = (role==='teacher' && teacherLinkEl) ? teacherLinkEl.value : null;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if(!u || !email || !p){ errEl.textContent='الرجاء تعبئة جميع الحقول'; return; }
    if(role==='teacher' && !teacherLink){ errEl.textContent='الرجاء اختيار اسمك من قائمة المحفّظين'; return; }

    if (firebaseAuth){
      if(p.length < 6){ errEl.textContent='كلمة المرور يجب أن لا تقل عن 6 أحرف'; return; }
      btnReg.disabled = true;
      try{
        const cred = await firebaseAuth.createUserWithEmailAndPassword(email, p);
        await firestoreDb.collection('users').doc(cred.user.uid).set({
          username: u, email, role, teacherLink: teacherLink || null, disabled: false, createdAt: new Date().toISOString()
        });
        state.currentUser = u;
        state.currentRole = role;
        state.currentTeacherLink = teacherLink || null;
        state.currentUid = cred.user.uid;
        state.authMode = 'login';
        state.view = role==='teacher' ? 'schedule' : 'dashboard';
        render();
      }catch(e){
        errEl.textContent = mapAuthError(e);
      }finally{
        btnReg.disabled = false;
      }
      return;
    }

    // Legacy fallback (no Firebase Auth configured — see setup notes above).
    if(state.accounts.some(a=>(a.email||'').toLowerCase()===email.toLowerCase())){ errEl.textContent='هذا البريد الإلكتروني مستخدم بالفعل'; return; }
    if(p.length < 4){ errEl.textContent='كلمة المرور يجب أن لا تقل عن 4 أحرف'; return; }
    const newAcc = {localId: 'la_' + Date.now() + '_' + state.accounts.length, username:u, email, password:p, role, teacherLink: teacherLink || null, disabled:false};
    state.accounts.push(newAcc);
    await saveAccounts();
    state.currentUser = u;
    state.currentRole = role;
    state.currentTeacherLink = teacherLink || null;
    state.currentLocalId = newAcc.localId;
    state.authMode = 'login';
    state.view = role==='teacher' ? 'schedule' : 'dashboard';
    render();
  };
}

  return isTeacherRole && !['schedule','history','memorization','myStudents','settings'].includes(state.view) ? 'schedule' : state.view;

function syncStatusBadge(){
  const pending = getPendingSyncKeys().length;
  const online = navigator.onLine;
  let bg, text, label;
  if(!firestoreDb){
    return ''; // legacy/local-only mode — nothing to sync, badge would be noise
  }
  if(pending > 0){
    bg = 'rgba(224,180,92,0.25)'; text = '#E0B45C';
    label = online ? `⏳ جاري رفع ${pending} عنصر...` : `⏳ ${pending} عنصر بانتظار الاتصال`;
  } else if(!online){
    bg = 'rgba(224,180,92,0.25)'; text = '#E0B45C';
    label = '📴 غير متصل — البيانات محفوظة محلياً';
  } else {
    bg = 'rgba(255,255,255,0.15)'; text = '#fff';
    label = '✅ كل البيانات مرفوعة';
  }
  return `<div id="sync-status-badge" style="display:inline-block; margin-top:4px; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700; background:${bg}; color:${text};">${label}</div>`;
}

/* Shared logout: signs out of Firebase Auth when configured (this also
   clears the persisted session so a reload won't auto-login again),
   otherwise just clears local state (legacy mode). */
async function doLogout(){
  if (firebaseAuth){
    try{ await firebaseAuth.signOut(); }catch(e){ console.warn(e); }
    // onAuthStateChanged listener above will clear state and re-render.
  } else {
    state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
    render();
  }
}

function attachMainHandlers(){
  attachBackupBannerHandlers();
  document.getElementById('btn-logout').onclick = ()=>{
    if(state.view==='test' && testForm.stage==='scoring'){
      showToast('لازم تحفظ أو ترجع عن الاختبار الحالي قبل الخروج');
      return;
    }
    doLogout();
  };
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{
      if(state.view==='test' && testForm.stage==='scoring' && b.dataset.view !== 'test'){
        showToast('لازم تحفظ أو ترجع عن الاختبار الحالي قبل ما تتنقل لصفحة ثانية');
        return;
      }
      state.view = b.dataset.view; selectedStudentId = null; resetTestForm(); render();
    };
  });

  window.onbeforeunload = (state.view==='test' && testForm.stage==='scoring')
    ? (e)=>{ e.preventDefault(); e.returnValue = ''; return ''; }
    : null;

  const currentView = effectiveView();
  if(currentView==='dashboard') attachDashboardHandlers();
  if(currentView==='test') attachTestHandlers();
  if(currentView==='history') attachHistoryHandlers();
  if(currentView==='stats') attachStatsHandlers();
  if(currentView==='students') attachStudentsHandlers();
  if(currentView==='schedule') attachScheduleHandlers();
  if(currentView==='memorization') attachMemorizationHandlers();
  if(currentView==='myStudents') attachMyStudentsHandlers();
  if(currentView==='settings') attachSettingsHandlers();
}

let testForm = {
  studentName:'', teacherName:'', juz:'30', juzMode:'single', notes:'',
  clicks: [], // stack of {type, value}
  questionsDone: [false,false,false,false,false],
  stage: 'setup', // setup | scoring
  startedAt: null, // timestamp when scoring began — powers the live exam timer
};
function resetTestForm(){
  testForm = { studentName:'', teacherName:'', juz:'30', juzMode:'single', notes:'', clicks:[], questionsDone:[false,false,false,false,false], stage:'setup', startedAt:null };
}
function currentScore(){
  const total = testForm.clicks.reduce((s,c)=> s + c.value, 0);
  return Math.max(0, Math.round((100 - total)*10)/10);
}
function countOf(type){
  return testForm.clicks.filter(c=>c.type===type).length;
}
function elapsedExamSeconds(){
  return testForm.startedAt ? Math.max(0, Math.floor((Date.now() - testForm.startedAt)/1000)) : 0;
}
function formatDuration(totalSeconds){
  const m = Math.floor(totalSeconds/60), s = totalSeconds%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

/* Draft autosave — protects against losing an in-progress exam if the
   device closes/refreshes/loses power mid-scoring. Saved on-device
   only (each examiner's own draft, not synced), and offered back the
   next time the test setup page loads. */
function saveDraft(){
  if(testForm.stage !== 'scoring') return;
  try{ localStorage.setItem('exam_draft', JSON.stringify(testForm)); }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem('exam_draft'); }catch(e){}
}
let draftDismissed = false;
function getSavedDraft(){
  try{
    const raw = localStorage.getItem('exam_draft');
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(d && d.stage==='scoring' && d.studentName) return d;
    return null;
  }catch(e){ return null; }
}

const CENTER_NAME_DEFAULT = 'مركز السيد هاشم';
const CENTER_FULLNAME_DEFAULT = 'مركز السيد هاشم لتعليم وتحفيظ القرآن الكريم';
const CENTER_TAGLINE_DEFAULT = 'لتعليم و تحفيظ القرآن الكريم';
const BOOKING_ALLOWED_WEEKDAYS = [6, 1, 3]; // Saturday, Monday, Wednesday (JS getDay(): Sun=0..Sat=6)
let BOOKING_MAX_PER_DAY = 10;
const WEEKDAY_NAMES_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
// Admin-editable values (Settings) override these built-in defaults.
const TEACHERS_DEFAULT = TEACHERS.slice();
const BOOKING_WEEKDAYS_DEFAULT = BOOKING_ALLOWED_WEEKDAYS.slice();
const BOOKING_MAX_DEFAULT = BOOKING_MAX_PER_DAY;
function applyCenterOverrides(){
  const cs = state.centerSettings || {};
  const t = (Array.isArray(cs.teachers) && cs.teachers.length) ? cs.teachers : TEACHERS_DEFAULT;
  TEACHERS.length = 0; t.forEach(n=>TEACHERS.push(n));
  const w = (Array.isArray(cs.bookingWeekdays) && cs.bookingWeekdays.length) ? cs.bookingWeekdays : BOOKING_WEEKDAYS_DEFAULT;
  BOOKING_ALLOWED_WEEKDAYS.length = 0; w.forEach(d=>BOOKING_ALLOWED_WEEKDAYS.push(d));
  const m = parseInt(cs.bookingMaxPerDay, 10);
  BOOKING_MAX_PER_DAY = m > 0 ? m : BOOKING_MAX_DEFAULT;
}
function bookingDaysText(){
  const names = [...BOOKING_ALLOWED_WEEKDAYS].sort((a,b)=>a-b).map(d=>WEEKDAY_NAMES_AR[d]);
  return names.length>1 ? names.slice(0,-1).join('، ') + ' و' + names[names.length-1] : (names[0]||'');
}
const BOOKING_FAIL_COOLDOWN_DAYS = 7;

/* ---- Stage 1: start a new test (student / teacher / juz) ---- */
function studentHistoryPanelHTML(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return '';
  const prior = state.exams.filter(e=>e.studentName.trim()===trimmed).sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!prior.length) return '';
  return `
    <div style="font-size:12.5px;font-weight:700;color:var(--green);margin-bottom:6px;">سجل الطالب السابق (${prior.length} اختبار)</div>
    ${prior.slice(0,6).map(e=>{
      const d = new Date(e.date).toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'});
      const isRetry = !!e.stoppedEarly;
      const cls = isRetry ? 'score-low' : (e.score>=90 ? 'score-high' : e.score>=80 ? 'score-mid' : 'score-low');
      return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);">
        <span>${escapeHtml(formatJuzRange(e.juz))} · ${d}${e.notes ? ' · ' + escapeHtml(e.notes) : ''}</span>
        <span class="record-score ${cls}" style="padding:2px 8px;border-radius:8px;font-size:12px;">${isRetry ? 'إعادة' : e.score}</span>
      </div>`;
    }).join('')}
  `;
}

function attachTestHandlers(){
  if(testForm.stage === 'scoring') attachTestScoringHandlers();
  else attachTestSetupHandlers();
}

function attachTestSetupHandlers(){
  const resumeBtn = document.getElementById('btn-resume-draft');
  if(resumeBtn) resumeBtn.onclick = ()=>{
    const draft = getSavedDraft();
    if(draft){ testForm = draft; render(); }
  };
  const dismissBtn = document.getElementById('btn-dismiss-draft');
  if(dismissBtn) dismissBtn.onclick = ()=>{
    clearDraft();
    draftDismissed = true;
    render();
  };

  const sEl = document.getElementById('f-student');
  const tEl = document.getElementById('f-teacher');
  const jEl = document.getElementById('f-juz');
  const nEl = document.getElementById('f-notes');
  sEl.oninput = ()=>{
    testForm.studentName = sEl.value;
    const panel = document.getElementById('student-history-panel');
    if(panel){
      const html = studentHistoryPanelHTML(testForm.studentName);
      panel.innerHTML = html;
      panel.style.display = html ? 'block' : 'none';
    }
  };
  tEl.onchange = ()=> testForm.teacherName = tEl.value;
  if(nEl) nEl.oninput = ()=> testForm.notes = nEl.value;

  document.querySelectorAll('.juz-mode-btn').forEach(b=>{
    b.onclick = ()=>{
      testForm.juzMode = b.dataset.mode;
      if(testForm.juzMode==='multi' && !String(testForm.juz).startsWith('الأجزاء:')) testForm.juz = 'تجميعي';
      if(testForm.juzMode==='single' && String(testForm.juz).match(/^\d+$/) === null) testForm.juz = '30';
      render();
    };
  });

  if(jEl) jEl.onchange = ()=>{ testForm.juz = jEl.value; };

  document.querySelectorAll('.juz-check').forEach(cb=>{
    cb.onchange = ()=>{
      const selected = [...document.querySelectorAll('.juz-check:checked')]
        .map(x=>Number(x.value))
        .sort((a,b)=>a-b);
      testForm.juz = selected.length ? 'الأجزاء: ' + selected.join(' + ') : 'تجميعي';
    };
  });

  document.getElementById('btn-start-test').onclick = ()=>{
    const errs = [];
    if(!testForm.studentName.trim()) errs.push('student');
    if(!testForm.teacherName.trim()) errs.push('teacher');
    if(errs.includes('student')) document.getElementById('f-student').classList.add('error');
    if(errs.includes('teacher')) document.getElementById('f-teacher').classList.add('error');
    if(errs.length){ showToast('الرجاء تعبئة اسم الطالب والمحفّظ'); return; }

    testForm.studentName = testForm.studentName.trim();
    testForm.teacherName = testForm.teacherName.trim();

    // Gate 1: parts that require passing the cumulative ("تجميعي")
    // checkpoint exam first.
    const selectedJuzNums = (String(testForm.juz).match(/\d+/g)||[]).map(Number);
    const needsCumulativeCheck = selectedJuzNums.some(n=>CUMULATIVE_CHECKPOINT_JUZ.includes(n));
    if(needsCumulativeCheck){
      const passedCumulative = confirm('تذكير: هل اجتاز الطالب الاختبار التجميعي قبل التقدم لهذا الاختبار؟\n\nاضغط "موافق" = نعم، أو "إلغاء" = لا.');
      if(!passedCumulative){
        const skipAnyway = confirm('يرجى التقدم إلى الاختبار التجميعي قبل هذا الاختبار.\n\nهذا استثناء: إذا بدك كمختبِر تتجاوز هذا الشرط وتدخل الطالب على الاختبار رغم ذلك، دوس "موافق". وإلا دوس "إلغاء" للرجوع.');
        if(!skipAnyway) return;
      }
    }

    // Gate 2: student failed their last exam within the past week.
    const cooldownReason = studentTestCooldownBlockedReason(testForm.studentName);
    if(cooldownReason){
      const skipAnyway = confirm(cooldownReason + '\n\nهذا استثناء: إذا بدك كمختبِر تتجاوز هذا الشرط وتدخل الطالب على الاختبار الآن، دوس "موافق". وإلا دوس "إلغاء" للرجوع.');
      if(!skipAnyway) return;
    }

    testForm.clicks = [];
    testForm.questionsDone = [false,false,false,false,false];
    testForm.stage = 'scoring';
    testForm.startedAt = Date.now();
    saveDraft();
    render();
  };
}

let examTimerInterval = null;
function attachTestScoringHandlers(){
  if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval = null; }
  const timerEl = document.getElementById('exam-timer');
  if(timerEl){
    examTimerInterval = setInterval(()=>{
      const el = document.getElementById('exam-timer');
      if(!el){ clearInterval(examTimerInterval); examTimerInterval = null; return; }
      el.textContent = formatDuration(elapsedExamSeconds());
    }, 1000);
  }

  const notesEl = document.getElementById('f-scoring-notes');
  if(notesEl) notesEl.oninput = ()=>{ testForm.notes = notesEl.value; saveDraft(); };

  document.querySelectorAll('.deduct-btn').forEach(b=>{
    b.onclick = ()=>{
      testForm.clicks.push({ type: b.dataset.type, value: parseFloat(b.dataset.val) });
      saveDraft();
      rerenderTestOnly();
    };
  });

  document.querySelectorAll('.question-chip').forEach(b=>{
    b.onclick = ()=>{
      const i = Number(b.dataset.i);
      if(!testForm.questionsDone) testForm.questionsDone = [false,false,false,false,false];
      testForm.questionsDone[i] = !testForm.questionsDone[i];
      saveDraft();
      rerenderTestOnly();
    };
  });

  const undoBtn = document.getElementById('btn-undo');
  if(undoBtn) undoBtn.onclick = ()=>{
    testForm.clicks.pop();
    saveDraft();
    rerenderTestOnly();
  };

  const backBtn = document.getElementById('btn-back-setup');
  if(backBtn) backBtn.onclick = ()=>{
    if(testForm.clicks.length && !confirm('الرجوع رح يفقد الخصومات المسجّلة لهاد الاختبار، متأكد؟')) return;
    clearDraft();
    testForm.stage = 'setup';
    testForm.clicks = [];
    render();
  };

  const stopBtn = document.getElementById('btn-stop-test');
  if(stopBtn) stopBtn.onclick = async ()=>{
    if(!confirm('تنبيه: إيقاف الاختبار الآن رح يسجّل نتيجة الطالب بالعلامة الحالية (' + currentScore() + ' من 100) ويعتبر الاختبار منتهي — ولازم الطالب يعيد الاختبار لاحقاً. متأكد إنك بدك توقف الاختبار؟')) return;
    const record = {
      id: 'e_' + Date.now(),
      studentName: testForm.studentName.trim(),
      teacherName: testForm.teacherName.trim(),
      juz: testForm.juz,
      notes: (testForm.notes||'').trim(),
      testerName: state.currentUser,
      deductions: { lahn: countOf('lahn'), khataa: countOf('khataa'), tanbih: countOf('tanbih') },
      score: currentScore(),
      stoppedEarly: true,
      durationSeconds: elapsedExamSeconds(),
      date: new Date().toISOString(),
    };
    state.exams.unshift(record);
    upsertStudentFromExam(record);
    await saveExams();
    await saveStudents();
    clearDraft();
    if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval = null; }
    showToast('تم إيقاف الاختبار وتسجيل النتيجة — الطالب بحاجة لإعادة الاختبار');
    resetTestForm();
    render();
  };

  document.getElementById('btn-save').onclick = async ()=>{
    const record = {
      id: 'e_' + Date.now(),
      studentName: testForm.studentName.trim(),
      teacherName: testForm.teacherName.trim(),
      juz: testForm.juz,
      notes: (testForm.notes||'').trim(),
      testerName: state.currentUser,
      deductions: {
        lahn: countOf('lahn'),
        khataa: countOf('khataa'),
        tanbih: countOf('tanbih'),
      },
      score: currentScore(),
      durationSeconds: elapsedExamSeconds(),
      date: new Date().toISOString(),
    };
    state.exams.unshift(record);
    upsertStudentFromExam(record);
    await saveExams();
    await saveStudents();
    clearDraft();
    if(examTimerInterval){ clearInterval(examTimerInterval); examTimerInterval = null; }
    showToast('تم حفظ نتيجة الاختبار بنجاح');
    resetTestForm();
    render();
  };
}

function rerenderTestOnly(){
  document.getElementById('content').innerHTML = testView();
  attachTestHandlers();
}

/* ---------------- HISTORY VIEW ---------------- */
let historySearch = '';
let historyFilters = { score: 'all', juz: '', dateFrom: '', dateTo: '' };
let historyVisibleCount = 20;
let editingTeacherRecordId = null; // exam.id currently showing the "edit teacher" inline form (admin/examiner only)
let editingNameRecordId = null; // exam.id showing the inline student-name editor (admin/examiner only)
let editingScoreRecordId = null; // exam.id currently showing the "edit score" inline form (admin/examiner only)
const HISTORY_PAGE_SIZE = 20;

function applyHistoryFilters(list){
  return list.filter(e=>{
    if(!e.studentName.toLowerCase().includes(historySearch.toLowerCase())) return false;
    if(historyFilters.score==='high' && e.score<90) return false;
    if(historyFilters.score==='pass' && e.score<80) return false;
    if(historyFilters.score==='low' && e.score>=80) return false;
    if(historyFilters.juz){
      const wanted = historyFilters.juz.trim();
      if(wanted && !String(e.juz).includes(wanted)) return false;
    }
    if(historyFilters.dateFrom && new Date(e.date) < new Date(historyFilters.dateFrom)) return false;
    if(historyFilters.dateTo && new Date(e.date) > new Date(historyFilters.dateTo + 'T23:59:59')) return false;
    return true;
  });
}

function visibleExams(){

    ? state.exams.filter(e => e.teacherName === state.currentTeacherLink)
    : state.exams;
}

function iconReport(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`;

function iconShare(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>`;
}

function renderRecords(list, totalCount){
  const total = totalCount === undefined ? list.length : totalCount;
  if(list.length===0){
    return `<div class="empty-state">لا توجد نتائج اختبارات ${(historySearch || historyFilters.score!=='all' || historyFilters.juz || historyFilters.dateFrom || historyFilters.dateTo) ? 'مطابقة لبحثك/فلاترك' : 'بعد'}</div>`;
  }
  const canEditTeacher = state.currentRole !== 'teacher';
  const canEditScore = state.currentRole !== 'teacher';
  const canEditName = state.currentRole !== 'teacher';
  const cards = list.map(r=>{
    const isRetry = !!r.stoppedEarly;
    const scoreClass = isRetry ? 'score-low' : (r.score>=90 ? 'score-high' : r.score>=80 ? 'score-mid' : 'score-low');
    const alertClass = (isRetry || r.score<80) ? ' record-alert' : '';
    const d = new Date(r.date);
    const dateStr = d.toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'});
    const isEditingTeacher = canEditTeacher && editingTeacherRecordId === r.id;
    const isEditingScore = canEditScore && editingScoreRecordId === r.id;
    const isEditingName = canEditName && editingNameRecordId === r.id;
    const sameNameCount = isEditingName ? state.exams.filter(e=>e.studentName.trim().toLowerCase()===r.studentName.trim().toLowerCase()).length : 0;
    return `
    <div class="record${alertClass}">
      <div class="record-top">
        ${isEditingName ? `
        <div class="name-edit">
          <input type="text" class="name-edit-input" data-id="${r.id}" value="${escapeHtml(r.studentName)}" autocomplete="off">
          ${sameNameCount>1 ? `<label class="name-edit-all"><input type="checkbox" class="name-edit-allcb" data-id="${r.id}" checked> تطبيق على كل سجلات هذا الطالب (${sameNameCount})</label>` : ''}
          <div class="name-edit-btns">
            <button class="name-edit-save" data-id="${r.id}">حفظ</button>
            <button class="name-edit-cancel">إلغاء</button>
          </div>
        </div>` : `<div class="name">${escapeHtml(r.studentName)}${canEditName ? `<button class="name-edit-btn" data-id="${r.id}" title="تعديل اسم الطالب" aria-label="تعديل اسم الطالب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>` : ''}</div>`}
        ${isEditingScore ? `
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="number" min="0" max="100" step="0.5" class="score-edit-input" data-id="${r.id}" value="${isRetry ? 0 : r.score}" style="width:64px;font-family:'Tajawal';font-size:13px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);">
          <label style="font-size:11px;display:flex;align-items:center;gap:3px;white-space:nowrap;">
            <input type="checkbox" class="score-edit-retry" data-id="${r.id}" ${isRetry?'checked':''}> إعادة
          </label>
        </div>
        ` : `<div class="record-score ${scoreClass}">${isRetry ? 'إعادة' : r.score}</div>`}
      </div>
      ${isEditingScore ? `
      <div style="display:flex;gap:6px;justify-content:flex-end;margin:-4px 0 6px;">
        <button class="score-edit-save" data-id="${r.id}" style="font-size:11px;padding:2px 8px;">حفظ</button>
        <button class="score-edit-cancel" style="font-size:11px;padding:2px 8px;">إلغاء</button>
      </div>
      ` : ''}
      <div class="record-meta">
        ${isEditingTeacher ? `
        <span>المحفّظ:</span>
        <select class="teacher-edit-select" data-id="${r.id}" style="font-family:'Tajawal';font-size:12.5px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);">
          ${TEACHERS.map(n=>`<option value="${escapeHtml(n)}" ${r.teacherName===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
        </select>
        <button class="teacher-edit-save" data-id="${r.id}" style="font-size:11px;padding:2px 8px;">حفظ</button>
        <button class="teacher-edit-cancel" style="font-size:11px;padding:2px 8px;">إلغاء</button>
        ` : `المحفّظ: <b>${escapeHtml(r.teacherName)}</b>`} · الأجزاء المختبَر فيها: <b>${escapeHtml(String(r.juz))}</b><br>
        المختبِر: <b>${escapeHtml(r.testerName)}</b> · التاريخ: <b>${dateStr}</b>${r.durationSeconds ? ` · المدة: <b>${formatDuration(r.durationSeconds)}</b>` : ''}<br>
        لحن جلي: <b>${r.deductions.lahn}</b> · خطأ: <b>${r.deductions.khataa}</b> · تنبيه: <b>${r.deductions.tanbih}</b>
        ${r.notes ? `<br>ملاحظات: <b>${escapeHtml(r.notes)}</b>` : ''}
      </div>
      <div class="record-actions">
        ${!isRetry ? `<button class="record-share" data-id="${r.id}">${iconShare()} مشاركة شهادة</button>` : ''}
        ${(()=>{
          const st = state.students.find(s => s.name.trim().toLowerCase()===r.studentName.trim().toLowerCase());
          return st && st.phone ? `<button class="record-whatsapp" data-id="${r.id}">${iconWhatsappSvg()} إرسال لولي الأمر</button>` : '';
        })()}
        ${canEditTeacher && !isEditingTeacher ? `<button class="record-edit-teacher" data-id="${r.id}">تعديل المحفّظ</button>` : ''}
        ${canEditScore && !isEditingScore ? `<button class="record-edit-score" data-id="${r.id}">تعديل العلامة</button>` : ''}
        ${state.currentRole!=='teacher' ? `<button class="record-del" data-id="${r.id}">حذف السجل</button>` : ''}
      </div>
    </div>`;
  }).join('');
  const loadMore = total > list.length
    ? `<button class="btn-load-more" id="btn-load-more">تحميل المزيد (${total - list.length} متبقي)</button>`
    : '';
  return cards + loadMore;
}

function refreshHistoryList(){
  const filtered = applyHistoryFilters(visibleExams());
  const visible = filtered.slice(0, historyVisibleCount);
  document.getElementById('records-list').innerHTML = renderRecords(visible, filtered.length);
  attachDeleteHandlers();
  attachShareHandlers();
  attachTeacherEditHandlers();
  attachScoreEditHandlers();
  attachNameEditHandlers();
  const loadMoreBtn = document.getElementById('btn-load-more');
  if(loadMoreBtn) loadMoreBtn.onclick = ()=>{
    historyVisibleCount += HISTORY_PAGE_SIZE;
    refreshHistoryList();
  };
}

function attachHistoryHandlers(){
  const input = document.getElementById('search-input');
  input.oninput = ()=>{
    historySearch = input.value;
    historyVisibleCount = HISTORY_PAGE_SIZE;
    refreshHistoryList();
  };

  const scoreSel = document.getElementById('filter-score');
  const juzInput = document.getElementById('filter-juz');
  const fromInput = document.getElementById('filter-date-from');
  const toInput = document.getElementById('filter-date-to');
  const onFilterChange = ()=>{
    historyFilters = {
      score: scoreSel.value, juz: juzInput.value,
      dateFrom: fromInput.value, dateTo: toInput.value,
    };
    historyVisibleCount = HISTORY_PAGE_SIZE;
    refreshHistoryList();
  };
  scoreSel.onchange = onFilterChange;
  juzInput.oninput = onFilterChange;
  fromInput.onchange = onFilterChange;
  toInput.onchange = onFilterChange;

  document.getElementById('btn-clear-filters').onclick = ()=>{
    historyFilters = { score:'all', juz:'', dateFrom:'', dateTo:'' };
    historySearch = '';
    historyVisibleCount = HISTORY_PAGE_SIZE;
    document.getElementById('content').innerHTML = historyView();
    attachHistoryHandlers();
  };

  refreshHistoryList();

  const reportBtn = document.getElementById('btn-monthly-report');
  if(reportBtn) reportBtn.onclick = ()=> generateMonthlyReport(reportBtn);

  const dailyPngBtn = document.getElementById('btn-daily-png');
  if(dailyPngBtn) dailyPngBtn.onclick = ()=> exportDailyResults(dailyPngBtn);

  const dailyPdfBtn = document.getElementById('btn-daily-pdf');
  if(dailyPdfBtn) dailyPdfBtn.onclick = ()=> exportDailyResultsPDF(dailyPdfBtn);

  const batchCertsBtn = document.getElementById('btn-batch-certs');
  if(batchCertsBtn) batchCertsBtn.onclick = ()=> generateBatchCertificatesPDF(currentYearMonth(), batchCertsBtn);
}

function attachDeleteHandlers(){
  document.querySelectorAll('.record-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('هل تريد حذف هذا السجل؟\nبينتقل لسلة المحذوفات وبتقدر تسترجعه خلال 30 يوم.')) return;
      const ex = state.exams.find(e=>e.id===b.dataset.id);
      if(ex) await moveToTrash('exam', ex, `${ex.studentName} · ${ex.juz} · ${ex.score}`);
      state.exams = state.exams.filter(e=>e.id!==b.dataset.id);
      if(ex) recomputeJuzProgressForStudent(ex.studentName.trim().toLowerCase());
      await saveExams(); await saveStudents();
      showToast('نُقل السجل لسلة المحذوفات');
      render();
    };
  });
}

function attachShareHandlers(){
  document.querySelectorAll('.record-share').forEach(b=>{
    b.onclick = ()=>{
      const record = state.exams.find(e=>e.id===b.dataset.id);
      if(record) shareCertificate(record, b);
    };
  });
  document.querySelectorAll('.record-whatsapp').forEach(b=>{
    b.onclick = ()=>{
      const record = state.exams.find(e=>e.id===b.dataset.id);
      if(!record) return;
      const student = state.students.find(s => s.name.trim().toLowerCase()===record.studentName.trim().toLowerCase());
      if(!student || !student.phone) return;
      const phoneDigits = student.phone.replace(/[^\d+]/g, '').replace(/^0+/, '');
      const msg = generateParentMessage(record, student);
      window.open(`https://wa.me/${phoneDigits}?text=${encodeURIComponent(msg)}`, '_blank');
    };
  });
}

// Lets admin/examiner correct the "المحفّظ" name stored on an existing
// exam record — needed when it was picked wrong (or left unset) at test
// time, since that's the only thing that decides which teacher account
// sees this student under "نتائج طلابي".
function attachTeacherEditHandlers(){
  document.querySelectorAll('.record-edit-teacher').forEach(b=>{
    b.onclick = ()=>{
      editingTeacherRecordId = b.dataset.id;
      refreshHistoryList();
    };
  });
  document.querySelectorAll('.teacher-edit-cancel').forEach(b=>{
    b.onclick = ()=>{
      editingTeacherRecordId = null;
      refreshHistoryList();
    };
  });
  document.querySelectorAll('.teacher-edit-save').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const sel = document.querySelector(`.teacher-edit-select[data-id="${id}"]`);
      const newName = sel ? sel.value : '';
      const exam = state.exams.find(e=>e.id===id);
      if(exam && newName){
        exam.teacherName = newName;
        await saveExams();
        showToast('تم تحديث اسم المحفّظ');
      }
      editingTeacherRecordId = null;
      refreshHistoryList();
    };
  });
}

// Lets admin/examiner fix a misspelled student name from the history
// list: either on this record only, or on every record of that student
// (exams, student file, schedule and memorization entries).
function attachNameEditHandlers(){
  document.querySelectorAll('.name-edit-btn').forEach(b=>{
    b.onclick = ()=>{
      editingNameRecordId = b.dataset.id;
      refreshHistoryList();
      const inp = document.querySelector('.name-edit-input');
      if(inp){ inp.focus(); inp.select(); }
    };
  });
  document.querySelectorAll('.name-edit-cancel').forEach(b=>{
    b.onclick = ()=>{ editingNameRecordId = null; refreshHistoryList(); };
  });
  document.querySelectorAll('.name-edit-input').forEach(inp=>{
    inp.onkeydown = ev=>{
      if(ev.key==='Enter'){ const sb = document.querySelector(`.name-edit-save[data-id="${inp.dataset.id}"]`); if(sb) sb.click(); }
      if(ev.key==='Escape'){ editingNameRecordId = null; refreshHistoryList(); }
    };
  });
  document.querySelectorAll('.name-edit-save').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const inp = document.querySelector(`.name-edit-input[data-id="${id}"]`);
      const cb = document.querySelector(`.name-edit-allcb[data-id="${id}"]`);
      const exam = state.exams.find(e=>e.id===id);
      const newName = inp ? inp.value.replace(/\s+/g,' ').trim() : '';
      if(!exam) { editingNameRecordId = null; refreshHistoryList(); return; }
      if(!newName){ showToast('اكتب اسم الطالب'); return; }
      const oldKey = exam.studentName.trim().toLowerCase();
      const newKey = newName.toLowerCase();
      const entryExists = state.students.some(x=>x.name.trim().toLowerCase()===newKey);
      if(oldKey === newKey && exam.studentName.trim() === newName && entryExists){ editingNameRecordId = null; refreshHistoryList(); return; }
      const all = !!(cb && cb.checked);
      let changed = 0;
      state.exams.forEach(e=>{
        if(e.id===id || (all && e.studentName.trim().toLowerCase()===oldKey)){
          if(e.studentName !== newName){ e.studentName = newName; changed++; }
        }
      });
      // If the old name has no exams left, the student has effectively been
      // renamed (not split), so everything attached to them moves too.
      const examsLeft = state.exams.some(e=>e.studentName.trim().toLowerCase()===oldKey);
      const moveAll = all || !examsLeft;
      if(moveAll && oldKey !== newKey){
        (state.schedule||[]).forEach(x=>{ if((x.studentName||'').trim().toLowerCase()===oldKey) x.studentName = newName; });
        (state.memorization||[]).forEach(x=>{ if((x.studentName||'').trim().toLowerCase()===oldKey) x.studentName = newName; });
        await saveSchedule(); await saveMemorization();
      }
      // Keep the student file in step with the records, so the student
      // stays under their teacher instead of falling into "غير محدد".
      const oldSt = state.students.find(x=>x.name.trim().toLowerCase()===oldKey);
      let newSt = state.students.find(x=>x.name.trim().toLowerCase()===newKey && x!==oldSt);
      if(oldSt && oldKey !== newKey){
        if(moveAll){
          if(!newSt){ oldSt.name = newName; newSt = oldSt; }
          else {
            ['phone','notes','nationalId','birthDate','registeredByTeacher'].forEach(k=>{ if(!newSt[k] && oldSt[k]) newSt[k] = oldSt[k]; });
            state.students = state.students.filter(x=>x!==oldSt);
          }
        } else if(!newSt){
          newSt = { id: makeStudentId(), name: newName, phone:'', notes:'', juzProgress:[], createdAt: new Date().toISOString() };
          if(oldSt.registeredByTeacher) newSt.registeredByTeacher = oldSt.registeredByTeacher;
          state.students.push(newSt);
        }
      } else if(!oldSt && !newSt){
        state.students.push({ id: makeStudentId(), name: newName, phone:'', notes:'', juzProgress:[], createdAt: new Date().toISOString() });
      }
      recomputeJuzProgressForStudent(oldKey);
      recomputeJuzProgressForStudent(newKey);
      await saveExams();
      await saveStudents();
      showToast(changed>1 ? `تم تعديل الاسم في ${changed} سجلات` : 'تم تعديل اسم الطالب');
      editingNameRecordId = null;
      refreshHistoryList();
    };
  });
}

// Recomputes a student's juzProgress from scratch, from their current
// exam history — used after a score edit so a corrected score properly
// adds/removes a completed juz (passing exams add it; a score walked
// back below 80, or marked إعادة, correctly drops it again, unless
// another passing exam for that juz still backs it up).
function recomputeJuzProgressForStudent(studentNameTrimmedLower){
  const student = state.students.find(s => s.name.trim().toLowerCase()===studentNameTrimmedLower);
  if(!student) return;
  student.juzProgress = [];
  state.exams
    .filter(e => e.studentName.trim().toLowerCase()===studentNameTrimmedLower && !e.stoppedEarly && e.score >= 80)
    .forEach(e=>{
      (String(e.juz).match(/\d+/g) || []).map(Number).forEach(n=>{
        if(n>=1 && n<=30 && !student.juzProgress.includes(n)) student.juzProgress.push(n);
      });
    });
}

// Lets admin/examiner correct a previously-recorded score (typo while
// scoring, wrong button pressed, etc.) directly from the history list,
// and keeps the student's completed-juz list consistent with the
// corrected score.
function attachScoreEditHandlers(){
  document.querySelectorAll('.record-edit-score').forEach(b=>{
    b.onclick = ()=>{
      editingScoreRecordId = b.dataset.id;
      refreshHistoryList();
    };
  });
  document.querySelectorAll('.score-edit-cancel').forEach(b=>{
    b.onclick = ()=>{
      editingScoreRecordId = null;
      refreshHistoryList();
    };
  });
  document.querySelectorAll('.score-edit-save').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const input = document.querySelector(`.score-edit-input[data-id="${id}"]`);
      const retryCb = document.querySelector(`.score-edit-retry[data-id="${id}"]`);
      const exam = state.exams.find(e=>e.id===id);
      if(exam && input){
        let newScore = parseFloat(input.value);
        if(isNaN(newScore)) newScore = 0;
        newScore = Math.max(0, Math.min(100, newScore));
        exam.score = newScore;
        exam.stoppedEarly = !!(retryCb && retryCb.checked);
        recomputeJuzProgressForStudent(exam.studentName.trim().toLowerCase());
        await saveExams();
        await saveStudents();
        showToast('تم تحديث العلامة');
      }
      editingScoreRecordId = null;
      refreshHistoryList();
    };
  });
}

/* ============================================================
   Shared decorative canvas helpers for the certificate & the
   monthly report, styled after the ornate green/gold Islamic
   certificate template (arch frame, hanging lanterns, logo,
   pill badges, seal stamp, table).
   ============================================================ */
const PAL = { green:'#1B4332', green2:'#0F2E22', gold:'#C08A28', goldLight:'#D9B15C', cream:'#FCF8EC', ink:'#26231C', inkSoft:'#6B6355', red:'#C0392B' };

function buildArchPath(ctx, W, H, margin, shoulderY, stepW, apexY){
  ctx.beginPath();
  ctx.moveTo(margin, H-margin);
  ctx.lineTo(margin, shoulderY);
  ctx.lineTo(margin+stepW, shoulderY);
  ctx.bezierCurveTo(margin+stepW, shoulderY-70, W/2-130, apexY+50, W/2, apexY);
  ctx.bezierCurveTo(W/2+130, apexY+50, W-margin-stepW, shoulderY-70, W-margin-stepW, shoulderY);
  ctx.lineTo(W-margin, shoulderY);
  ctx.lineTo(W-margin, H-margin);
  ctx.closePath();
}

function drawFrame(ctx, W, H){
  buildArchPath(ctx, W, H, 34, H*0.18, W*0.115, H*0.035);
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 9; ctx.stroke();
  buildArchPath(ctx, W, H, 56, H*0.18-16, W*0.115-16, H*0.035+16);
  ctx.strokeStyle = PAL.green; ctx.lineWidth = 3; ctx.stroke();
}

function drawBottomSwoosh(ctx, W, H){
  ctx.beginPath();
  ctx.moveTo(0, H*0.885);
  ctx.bezierCurveTo(W*0.22, H*0.885, W*0.36, H*0.80, W/2, H*0.80);
  ctx.bezierCurveTo(W*0.64, H*0.80, W*0.78, H*0.885, W, H*0.885);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = PAL.green; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, H*0.885);
  ctx.bezierCurveTo(W*0.22, H*0.885, W*0.36, H*0.80, W/2, H*0.80);
  ctx.bezierCurveTo(W*0.64, H*0.80, W*0.78, H*0.885, W, H*0.885);
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 3.5; ctx.stroke();
}

function drawLantern(ctx, cx, topY, w, h, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1.3, w*0.045);
  ctx.beginPath(); ctx.moveTo(cx, topY-h*0.32); ctx.lineTo(cx, topY); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, topY-h*0.34, w*0.07, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-w*0.2, topY+h*0.06);
  ctx.quadraticCurveTo(cx, topY-h*0.1, cx+w*0.2, topY+h*0.06);
  ctx.closePath(); ctx.fill();
  const bodyTop = topY+h*0.08, bodyBot = topY+h*0.72;
  ctx.beginPath();
  ctx.moveTo(cx-w*0.3, bodyTop+h*0.06);
  ctx.lineTo(cx-w*0.4, bodyTop+h*0.32);
  ctx.lineTo(cx-w*0.26, bodyBot);
  ctx.lineTo(cx+w*0.26, bodyBot);
  ctx.lineTo(cx+w*0.4, bodyTop+h*0.32);
  ctx.lineTo(cx+w*0.3, bodyTop+h*0.06);
  ctx.closePath();
  ctx.globalAlpha = 0.14; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(cx+i*w*0.13, bodyTop+h*0.12);
    ctx.lineTo(cx+i*w*0.09, bodyBot-h*0.03);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx-w*0.09, bodyBot); ctx.lineTo(cx, bodyBot+h*0.13); ctx.lineTo(cx+w*0.09, bodyBot);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, bodyBot+h*0.22, w*0.045, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLanterns(ctx, W, H){
  drawLantern(ctx, W*0.075, H*0.045, 60, 145, PAL.gold);
  drawLantern(ctx, W*0.155, H*0.10, 46, 105, PAL.goldLight);
  drawLantern(ctx, W*0.925, H*0.045, 60, 145, PAL.gold);
  drawLantern(ctx, W*0.845, H*0.10, 46, 105, PAL.goldLight);
}

function drawFlourish(ctx, cx, cy, size, color){
  ctx.save(); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy-size);
  ctx.quadraticCurveTo(cx+size*0.25, cy-size*0.25, cx+size, cy);
  ctx.quadraticCurveTo(cx+size*0.25, cy+size*0.25, cx, cy+size);
  ctx.quadraticCurveTo(cx-size*0.25, cy+size*0.25, cx-size, cy);
  ctx.quadraticCurveTo(cx-size*0.25, cy-size*0.25, cx, cy-size);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,size*0.22,0,Math.PI*2); ctx.fillStyle = PAL.cream; ctx.fill();
  ctx.restore();
}

function drawPillBadge(ctx, cx, cy, text, font, padX, bg, fg, h){
  ctx.font = font;
  const w = ctx.measureText(text).width + padX*2;
  const x = cx-w/2, y = cy-h/2, r = h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, cx, cy+1);
  ctx.textBaseline='alphabetic';
  return w;
}

function drawRibbonBanner(ctx, cx, cy, w, h, text, font, textColor){
  const tailW = 28;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-w/2-tailW, cy-h/2);
  ctx.lineTo(cx-w/2, cy-h/2);
  ctx.lineTo(cx-w/2, cy+h/2);
  ctx.lineTo(cx-w/2-tailW, cy+h/2);
  ctx.lineTo(cx-w/2-tailW+13, cy);
  ctx.closePath();
  ctx.fillStyle = PAL.green2; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx+w/2+tailW, cy-h/2);
  ctx.lineTo(cx+w/2, cy-h/2);
  ctx.lineTo(cx+w/2, cy+h/2);
  ctx.lineTo(cx+w/2+tailW, cy+h/2);
  ctx.lineTo(cx+w/2+tailW-13, cy);
  ctx.closePath();
  ctx.fillStyle = PAL.green2; ctx.fill();

  ctx.fillStyle = PAL.green;
  ctx.fillRect(cx-w/2, cy-h/2, w, h);
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 3;
  ctx.strokeRect(cx-w/2, cy-h/2, w, h);
  ctx.strokeStyle = PAL.goldLight; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx-w/2+12, cy-h/2+7); ctx.lineTo(cx+w/2-12, cy-h/2+7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-w/2+12, cy+h/2-7); ctx.lineTo(cx+w/2-12, cy+h/2-7); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = textColor || '#fff';
  ctx.font = font;
  ctx.fillText(text, cx, cy+3);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawLaurelSpray(ctx, cx, cy, color, side){
  const leafCount = 5;
  for(let i=0;i<leafCount;i++){
    const t = i/(leafCount-1);
    const angle = (Math.PI/2) + side*(t*0.95);
    const dist = 12 + t*36;
    const x = cx + Math.cos(angle)*dist*side;
    const y = cy - Math.sin(angle)*dist;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-angle*side + Math.PI/2);
    ctx.beginPath();
    ctx.ellipse(0,0, 5.5, 12.5, 0,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.88 - t*0.18;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function drawSealStamp(ctx, cx, cy, r){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = PAL.green2; ctx.fill();
  ctx.lineWidth = r*0.09; ctx.strokeStyle = PAL.gold; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.8,0,Math.PI*2); ctx.strokeStyle = PAL.gold; ctx.lineWidth = r*0.035; ctx.stroke();
  ctx.fillStyle = '#EADFC0'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `700 ${Math.round(r*0.32)}px 'Amiri', serif`;
  ctx.fillText('القرآن', cx, cy-r*0.17);
  ctx.fillText('الكريم', cx, cy+r*0.2);
  ctx.textBaseline='alphabetic';
  [-1,1].forEach(dir=>{
    ctx.beginPath();
    ctx.moveTo(cx+dir*r*0.5, cy+r*0.82);
    ctx.lineTo(cx+dir*r*0.62, cy+r*1.7);
    ctx.lineTo(cx+dir*r*0.36, cy+r*1.42);
    ctx.lineTo(cx+dir*r*0.16, cy+r*1.62);
    ctx.closePath();
    ctx.fillStyle = PAL.gold; ctx.fill();
  });
  ctx.restore();
}

function drawIconCircle(ctx, cx, cy, r, type, bg){
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = bg; ctx.fill();
  ctx.save(); ctx.translate(cx,cy);
  const s = r*0.95;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  if(type==='star'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a1 = -Math.PI/2 + i*(2*Math.PI/5), a2 = a1 + Math.PI/5;
      const ox=Math.cos(a1)*s*0.55, oy=Math.sin(a1)*s*0.55, ix=Math.cos(a2)*s*0.22, iy=Math.sin(a2)*s*0.22;
      if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
      ctx.lineTo(ix,iy);
    }
    ctx.closePath(); ctx.fill();
  } else if(type==='people'){
    ctx.beginPath(); ctx.arc(-s*0.2,-s*0.08,s*0.17,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.2,-s*0.08,s*0.17,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s*0.42,s*0.4); ctx.quadraticCurveTo(0,s*0.05,s*0.42,s*0.4); ctx.lineTo(s*0.42,s*0.55); ctx.lineTo(-s*0.42,s*0.55); ctx.closePath(); ctx.fill();
  } else if(type==='clip'){
    ctx.lineWidth = s*0.1;
    ctx.strokeRect(-s*0.3,-s*0.35,s*0.6,s*0.7);
    ctx.beginPath(); ctx.moveTo(-s*0.15,-s*0.35); ctx.lineTo(-s*0.15,-s*0.46); ctx.lineTo(s*0.15,-s*0.46); ctx.lineTo(s*0.15,-s*0.35); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s*0.17,-s*0.05); ctx.lineTo(s*0.17,-s*0.05);
    ctx.moveTo(-s*0.17,s*0.12); ctx.lineTo(s*0.17,s*0.12);
    ctx.moveTo(-s*0.17,s*0.29); ctx.lineTo(s*0.02,s*0.29);
    ctx.lineWidth = s*0.08; ctx.stroke();
  } else if(type==='cal'){
    ctx.lineWidth = s*0.09;
    ctx.strokeRect(-s*0.32,-s*0.28,s*0.64,s*0.6);
    ctx.beginPath(); ctx.moveTo(-s*0.32,-s*0.06); ctx.lineTo(s*0.32,-s*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.15,-s*0.38); ctx.lineTo(-s*0.15,-s*0.2); ctx.moveTo(s*0.15,-s*0.38); ctx.lineTo(s*0.15,-s*0.2); ctx.stroke();
  } else if(type==='user'){
    ctx.beginPath(); ctx.arc(0,-s*0.16,s*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s*0.4,s*0.5); ctx.quadraticCurveTo(0,s*0.06,s*0.4,s*0.5); ctx.lineTo(s*0.4,s*0.55); ctx.lineTo(-s*0.4,s*0.55); ctx.closePath(); ctx.fill();
  } else if(type==='ribbon'){
    ctx.beginPath(); ctx.arc(0,-s*0.05,s*0.32,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*0.16,s*0.2); ctx.lineTo(-s*0.28,s*0.55); ctx.lineTo(-s*0.05,s*0.4); ctx.lineTo(s*0.05,s*0.4); ctx.lineTo(s*0.28,s*0.55); ctx.lineTo(s*0.16,s*0.2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* Real uploaded logo artwork, loaded once and cached as an Image so
   canvas drawImage() can use it (falls back to the hand-drawn
   drawLogoMark() if it hasn't loaded yet or fails to load). */
let _logoImg = null, _logoImgPromise = null, _logoImgSrc = null;
function loadLogoImage(){
  const targetSrc = getCenterSettings().logoDataUri;
  // If the logo was changed (custom upload swapped in/out), invalidate
  // the cache so the new artwork actually gets used on canvases drawn
  // after the change, instead of the old cached Image.
  if(_logoImgPromise && _logoImgSrc !== targetSrc){
    _logoImgPromise = null; _logoImg = null;
  }
  if(_logoImgPromise) return _logoImgPromise;
  _logoImgSrc = targetSrc;
  _logoImgPromise = new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ _logoImg = img; resolve(img); };
    img.onerror = ()=> resolve(null);
    img.src = targetSrc;
  });
  return _logoImgPromise;
}

function drawWatermarkPattern(ctx, W, H){
  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = PAL.gold;
  const step = 62;
  for(let y = step/2; y < H; y += step){
    const row = Math.round(y/step);
    const offsetX = (row % 2) * (step/2);
    for(let x = step/2 + offsetX; x < W; x += step){
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.PI/4);
      ctx.fillRect(-4.5, -4.5, 9, 9);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawCornerOrnament(ctx, x, y, size, color, flipX, flipY){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = size*0.055; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, size*0.62);
  ctx.quadraticCurveTo(size*0.12, size*0.18, size*0.62, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(size*0.14, size*0.42);
  ctx.quadraticCurveTo(size*0.24, size*0.24, size*0.42, size*0.14);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(size*0.64, size*0.02, size*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(size*0.02, size*0.64, size*0.05, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawCornerOrnaments(ctx, W, H){
  drawCornerOrnament(ctx, 96, H-96, 46, PAL.gold, false, false);
  drawCornerOrnament(ctx, W-96, H-96, 46, PAL.gold, true, false);
  drawCornerOrnament(ctx, 258, 208, 40, PAL.goldLight, false, true);
  drawCornerOrnament(ctx, W-258, 208, 40, PAL.goldLight, true, true);
}

/* Report polish helpers: colored score pill (green ≥90, gold 80-89, red below / retry) and a rounded plaque */
function drawScorePill(ctx, cx, cy, text, score, failed){
  const w = Math.max(64, ctx.measureText(text).width + 34), h = 36, r = 18;
  let bg, fg, bd;
  if(failed || score < 80){ bg='#FBE1DE'; fg=PAL.red; bd='#E9B7B1'; }
  else if(score >= 90){ bg=PAL.green; fg='#fff'; bd=PAL.green; }
  else { bg='#F6E7C3'; fg='#8A5E12'; bd=PAL.gold; }
  ctx.beginPath(); ctx.moveTo(cx-w/2+r, cy-h/2); ctx.lineTo(cx+w/2-r, cy-h/2);
  ctx.arc(cx+w/2-r, cy, r, -Math.PI/2, Math.PI/2); ctx.lineTo(cx-w/2+r, cy+h/2);
  ctx.arc(cx-w/2+r, cy, r, Math.PI/2, -Math.PI/2); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = bd; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = fg; ctx.textAlign = 'center';
  ctx.fillText(text, cx, cy+7);
}
function drawPlaque(ctx, cx, y, w, h, lines){
  const x = cx-w/2, r = 34;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+h/2);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h/2);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = PAL.gold; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x+8,y+8,w-16,h-16,r-8) : ctx.rect(x+8,y+8,w-16,h-16);
  ctx.strokeStyle = 'rgba(192,138,40,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = 'center'; ctx.direction = 'rtl';
  lines.forEach((l,i)=>{ ctx.fillStyle = l.color || PAL.green; ctx.font = l.font; ctx.fillText(l.text, cx, y + h/2 + (i-(lines.length-1)/2)*34 + 7); });
}

function drawHeader(ctx, W, H, brandY, includeSwoosh){
  drawFrame(ctx, W, H);
  if(includeSwoosh !== false) drawBottomSwoosh(ctx, W, H);
  drawLanterns(ctx, W, H);
  // Leave clear space between the logo and the title text below it so
  // they never visually touch or crowd each other.
  const logoSize = 124;
  const logoGap = 30;
  const logoBottom = brandY - logoGap;
  if(_logoImg){
    const logoW = logoSize * (_logoImg.width / _logoImg.height);
    // soft cream plate so the arch lines don't cut through the emblem
    ctx.save();
    const grd = ctx.createRadialGradient(W/2, logoBottom-logoSize/2, logoSize*0.3, W/2, logoBottom-logoSize/2, logoW*0.78);
    grd.addColorStop(0, 'rgba(252,248,236,1)'); grd.addColorStop(0.7, 'rgba(252,248,236,0.96)'); grd.addColorStop(1, 'rgba(252,248,236,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(W/2, logoBottom-logoSize/2, logoW*0.78, logoSize*0.78, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.drawImage(_logoImg, W/2 - logoW/2, logoBottom - logoSize, logoW, logoSize);
  } else {
    drawLogoMark(ctx, W/2, logoBottom - logoSize, logoSize);
  }
  ctx.direction = 'rtl'; ctx.textAlign = 'center';
  ctx.fillStyle = PAL.green;
  ctx.font = "700 28px 'Amiri', serif";
  ctx.fillText(getCenterSettings().name, W/2, brandY);
  ctx.font = "500 18px 'Tajawal'";
  ctx.fillText('لتعليم و تحفيظ القرآن الكريم', W/2, brandY+28);
}

const JUZ_ORDINALS = [null,'الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر',
  'الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون',
  'الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون','السابع والعشرون','الثامن والعشرون','التاسع والعشرون','الثلاثون'];

// Popular nicknames for the last 10 juz' (21-30), used widely in
// memorization circles — each juz here either starts a clean new surah
// (28-30) or is commonly referred to by the surah it mostly covers.
const JUZ_NICKNAMES = {
  21: 'العنكبوت', 22: 'الأحزاب', 23: 'يس', 24: 'الزمر', 25: 'فصلت',
  26: 'الأحقاف', 27: 'الذاريات', 28: 'المجادلة', 29: 'تبارك', 30: 'عمّ',
};

function juzOrdinal(n){
  return JUZ_ORDINALS[n] || String(n);
}

function formatJuzRange(juzVal){
  const nums = (String(juzVal).match(/\d+/g) || []).map(Number);
  if(nums.length === 0) return String(juzVal);
  const min = Math.min(...nums), max = Math.max(...nums);
  return min === max ? `الجزء ${juzOrdinal(min)}` : `من الجزء ${juzOrdinal(min)} حتى الجزء ${juzOrdinal(max)}`;
}

function certificateNumber(record){
  const d = new Date(record.date);
  const pad = n => String(n).padStart(2,'0');
  const idTail = String(record.id).replace(/\D/g,'').slice(-4).padStart(4,'0');
  return `QH-${d.getFullYear()}-${pad(d.getMonth()+1)}${pad(d.getDate())}-${idTail}`;
}

function gradeLabel(score){
  if(score>=95) return 'ممتاز جداً';
  if(score>=90) return 'ممتاز';
  if(score>=85) return 'جيد جداً';
  if(score>=80) return 'جيد';
  return 'مقبول';
}

/* Rule-based "smart template" message generator (no AI/API involved —
   just picks and fills in the right wording from real numbers we
   already have: score, deduction counts, retry status). Used for the
   WhatsApp message sent to a parent about one exam result. */
function generateParentMessage(record, student){
  const isRetry = !!record.stoppedEarly;
  const juzText = formatJuzRange(record.juz);
  const d = new Date(record.date).toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
  const header = `${getCenterSettings().fullName}\nالطالب: ${record.studentName}\nالتاريخ: ${d}`;

  if(isRetry){
    return `${header}\n\nنحيطكم علماً أن الطالب لم يُكمل اختبار ${juzText} هذه المرة، وسيُعاد الاختبار لاحقاً بعد مزيد من المراجعة. نشكر تعاونكم ومتابعتكم مع الطالب في البيت.`;
  }

  const heavyLahn = record.deductions.lahn > 2;
  const manyKhataa = record.deductions.khataa > 3;

  if(record.score >= 95){
    return `${header}\n\nالحمدلله، اجتاز الطالب اختبار ${juzText} بتفوّق وامتياز (${record.score}/100 — ${gradeLabel(record.score)}). بارك الله فيه وفي جهده وجهدكم معه، ونسأل الله أن يجعله من أهل القرآن.`;
  }
  if(record.score >= 80){
    if(heavyLahn || manyKhataa){
      return `${header}\n\nاجتاز الطالب اختبار ${juzText} بعلامة ${record.score}/100 (${gradeLabel(record.score)}). لوحظ بعض اللحن والأخطاء أثناء التسميع، فنرجو المتابعة معه بمراجعة أحكام التلاوة قبل الاختبار القادم حتى يثبت الحفظ أكتر.`;
    }
    return `${header}\n\nالحمدلله، اجتاز الطالب اختبار ${juzText} بنجاح (${record.score}/100 — ${gradeLabel(record.score)}). أداء جيد، وبانتظار الجزء القادم بإذن الله.`;
  }
  // score < 80 — did not pass
  return `${header}\n\nنأسف لإبلاغكم أن الطالب لم يجتز اختبار ${juzText} هذه المرة (${record.score}/100). يُرجى مراجعة الحفظ معه بشكل إضافي، وبإمكانه إعادة التقديم بعد أسبوع من تاريخ هذا الاختبار إن شاء الله.`;
}
