let _certBgPromise = null;
function loadCertBg(){
  if(_certBgPromise) return _certBgPromise;
  _certBgPromise = new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = CERT_BG_SRC;
  });
  return _certBgPromise;
}
/* Shrinks a font until the text fits maxW. */
function certFit(ctx, text, weight, family, size, minSize, maxW){
  let s = size;
  ctx.font = `${weight} ${s}px ${family}`;
  while(ctx.measureText(text).width > maxW && s > minSize){ s -= 2; ctx.font = `${weight} ${s}px ${family}`; }
  return s;
}
/* Shared page for both certificates: artwork backdrop, centre logo and
   name, ribbon title, witness line and the name plaque. */
async function drawCertBase(ctx, W, H, titleText, studentName){
  try{ await Promise.all(["700 40px 'Aref Ruqaa'","400 30px 'Cairo'","700 30px 'Cairo'","800 30px 'Cairo'"].map(f=>document.fonts.load(f,'أبجد'))); }catch(e){}
  const bg = await loadCertBg();
  if(bg) ctx.drawImage(bg, 0, 0, W, H);
  else { ctx.fillStyle = PAL.cream; ctx.fillRect(0,0,W,H); }
  const cs = getCenterSettings();
  ctx.direction = 'rtl'; ctx.textAlign = 'center';

  // Logo + centre name
  const logoH = 132, logoTop = 34;
  if(_logoImg){
    const logoW = logoH * (_logoImg.width / _logoImg.height);
    ctx.drawImage(_logoImg, W/2 - logoW/2, logoTop, logoW, logoH);
  } else {
    drawLogoMark(ctx, W/2, logoTop, logoH);
  }
  ctx.fillStyle = PAL.green;
  ctx.font = "700 40px 'Aref Ruqaa', serif";
  ctx.fillText(cs.name, W/2, 206);
  ctx.font = "500 25px 'Cairo'";
  ctx.fillText('لتعليم و تحفيظ القرآن الكريم', W/2, 242);

  // Ribbon title (ribbon is part of the artwork)
  ctx.fillStyle = '#fffaf0';
  certFit(ctx, titleText, 700, "'Aref Ruqaa', serif", 72, 44, 380);
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
  ctx.fillText(titleText, W/2, 342);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // Witness line — "إدارة" in bold, rest regular, kept in correct RTL order.
  (function(){
    const before = 'تشهد ', boldWord = 'إدارة', after = ' ' + cs.fullName + ' بأن الطالب';
    const normalFont = "500 30px 'Cairo'", boldFont = "800 30px 'Cairo'";
    ctx.textAlign = 'left';
    ctx.font = normalFont; const wBefore = ctx.measureText(before).width;
    ctx.font = boldFont; const wBold = ctx.measureText(boldWord).width;
    ctx.font = normalFont; const wAfter = ctx.measureText(after).width;
    let x = W/2 - (wBefore+wBold+wAfter)/2;
    ctx.fillStyle = PAL.green;
    ctx.font = normalFont; ctx.fillText(after, x, 418); x += wAfter;
    ctx.font = boldFont; ctx.fillText(boldWord, x, 418); x += wBold;
    ctx.font = normalFont; ctx.fillText(before, x, 418);
    ctx.textAlign = 'center';
  })();

  // Student name on the artwork plaque
  ctx.fillStyle = PAL.green;
  certFit(ctx, studentName, 700, "'Aref Ruqaa', serif", 68, 36, 560);
  ctx.fillText(studentName, W/2, 524);
}
function certPill(ctx, cx, cy, text, maxW){
  const size = certFit(ctx, text, 700, "'Cairo'", 28, 18, maxW);
  const w = Math.max(300, ctx.measureText(text).width + 100), h = 54;
  const x = cx - w/2, y = cy - h/2;
  const g = ctx.createLinearGradient(0, y, 0, y+h);
  g.addColorStop(0, '#12684c'); g.addColorStop(1, '#0a3d2c');
  ctx.save();
  ctx.shadowColor = 'rgba(10,50,35,.28)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  rrPath(ctx, x, y, w, h, h/2); ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  rrPath(ctx, x, y, w, h, h/2);
  const gold = ctx.createLinearGradient(x, 0, x+w, 0);
  gold.addColorStop(0, '#b8893a'); gold.addColorStop(.5, '#e9cc8a'); gold.addColorStop(1, '#b8893a');
  ctx.strokeStyle = gold; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#fffaf0'; ctx.font = `700 ${size}px 'Cairo'`; ctx.textAlign = 'center';
  ctx.fillText(text, cx, cy + size*0.34);
}
function certFooterCol(ctx, cx, label, value){
  ctx.textAlign = 'center';
  ctx.fillStyle = PAL.ink; ctx.font = "500 21px 'Cairo'";
  ctx.fillText(label, cx, 905);
  certFit(ctx, value, 700, "'Cairo'", 25, 16, 290);
  ctx.fillStyle = PAL.green;
  ctx.fillText(value, cx, 940);
}

async function drawCertificate(record){
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  await loadLogoImage();
  const W = 1536, H = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  await drawCertBase(ctx, W, H, 'شهادة اجتياز', record.studentName);
  ctx.direction = 'rtl'; ctx.textAlign = 'center';

  ctx.fillStyle = PAL.green;
  ctx.font = "500 29px 'Cairo'";
  ctx.fillText('قد اجتاز اختبار حفظ وتلاوة', W/2, 592);

  certPill(ctx, W/2, 636, formatJuzRange(record.juz), 640);

  ctx.fillStyle = PAL.ink;
  ctx.font = "500 26px 'Cairo'";
  ctx.fillText('بتقدير', W/2, 698);

  const grade = gradeLabel(record.score);
  ctx.fillStyle = PAL.green;
  ctx.font = "700 70px 'Aref Ruqaa', serif";
  ctx.fillText(grade, W/2, 758);
  const gw = ctx.measureText(grade).width;
  drawFlourish(ctx, W/2-gw/2-46, 736, 15, PAL.gold);
  drawFlourish(ctx, W/2+gw/2+46, 736, 15, PAL.gold);

  ctx.fillStyle = PAL.green;
  ctx.font = "500 27px 'Cairo'";
  ctx.fillText('نسأل الله تعالى أن يبارك له في حفظه،', W/2, 806);
  ctx.fillText('وأن يجعله من أهل القرآن وخاصته.', W/2, 844);

  const issueDateStr = new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
  certFooterCol(ctx, 1236, 'تاريخ الإصدار', issueDateStr);
  certFooterCol(ctx, 928, 'اسم المحفّظ', record.teacherName || '—');
  certFooterCol(ctx, 604, 'مدير المركز', getCenterSettings().directorName);
  certFooterCol(ctx, 312, 'اسم المختبِر', record.testerName || '—');

  return canvas;
}

async function shareCertificate(record, btnEl){
  if(btnEl){ btnEl.disabled = true; }
  try{
    const canvas = await drawCertificate(record);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const fileName = `شهادة-${record.studentName}.png`.replace(/\s+/g,'-');
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({
        files: [file],
        title: 'شهادة اجتياز',
        text: `شهادة اجتياز الطالب ${record.studentName} - الدرجة: ${record.score}`,
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('تم حفظ الشهادة كصورة، تقدر ترسلها للمحفّظ من معرض الصور');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذّرت مشاركة الشهادة، حاول مرة ثانية');
    }
  }finally{
    if(btnEl){ btnEl.disabled = false; }
  }
}

/* ---------------- PROGRESS CERTIFICATE (شهادة تقدّم) ---------------- */
/* Groups consecutive completed juz numbers into ranges and writes them
   out in words, e.g. [1,2,3,7,9,10] -> "من الجزء الأول حتى الجزء
   الثالث، والجزء السابع، ومن الجزء التاسع حتى الجزء العاشر". */
function groupJuzRangesText(nums){
  if(!nums || nums.length===0) return 'لم يبدأ الحفظ بعد';
  const sorted = [...new Set(nums)].sort((a,b)=>a-b);
  const ranges = [];
  let start = sorted[0], prev = sorted[0];
  for(let i=1;i<=sorted.length;i++){
    const n = sorted[i];
    if(n === prev+1){ prev = n; continue; }
    ranges.push([start, prev]);
    start = n; prev = n;
  }
  return ranges.map(([a,b]) => a===b ? `الجزء ${juzOrdinal(a)}` : `من الجزء ${juzOrdinal(a)} حتى الجزء ${juzOrdinal(b)}`).join('، و');
}

async function drawProgressCertificate(student){
  await (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  await loadLogoImage();
  const exams = state.exams
    .filter(e => e.studentName.trim().toLowerCase()===student.name.trim().toLowerCase());
  const avgScore = exams.length ? Math.round(exams.reduce((s,e)=>s+e.score,0)/exams.length) : null;
  const rangesText = groupJuzRangesText(student.juzProgress);

  const W = 1536, H = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  await drawCertBase(ctx, W, H, 'شهادة تقدّم', student.name);
  ctx.direction = 'rtl'; ctx.textAlign = 'center';

  ctx.fillStyle = PAL.green;
  ctx.font = "500 29px 'Cairo'";
  ctx.fillText('وقد أتمّ بحمد الله حفظ', W/2, 592);

  certPill(ctx, W/2, 636, `${student.juzProgress.length} من 30 جزءاً`, 640);

  ctx.fillStyle = PAL.ink;
  ctx.font = "500 25px 'Cairo'";
  wrapCenteredText(ctx, rangesText, W/2, 702, 900, 34);

  if(avgScore !== null){
    ctx.fillStyle = PAL.green;
    ctx.font = "700 26px 'Cairo'";
    ctx.fillText(`متوسط الدرجات في ${exams.length} اختبار: ${avgScore} / 100`, W/2, 790);
  }

  ctx.fillStyle = PAL.green;
  ctx.font = "500 25px 'Cairo'";
  ctx.fillText('نسأل الله تعالى أن يبارك له في حفظه، وأن يجعله من أهل القرآن وخاصته.', W/2, 840);

  const issueDateStr = new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
  certFooterCol(ctx, 1236, 'تاريخ الإصدار', issueDateStr);
  certFooterCol(ctx, 928, 'صدرت بواسطة', state.currentUser || '—');
  certFooterCol(ctx, 604, 'مدير المركز', getCenterSettings().directorName);

  return canvas;
}

/* Wraps Arabic text across multiple centered lines within maxWidth,
   used for the variable-length list of completed juz ranges. */
function wrapCenteredText(ctx, text, cx, startY, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let y = startY;
  words.forEach(word=>{
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, cx, y);
      line = word; y += lineHeight;
    } else {
      line = test;
    }
  });
  if(line) ctx.fillText(line, cx, y);
}

async function shareProgressCertificate(student, btnEl){
  if(btnEl){ btnEl.disabled = true; }
  try{
    const canvas = await drawProgressCertificate(student);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const fileName = `شهادة-تقدم-${student.name}.png`.replace(/\s+/g,'-');
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({
        files: [file], title: 'شهادة تقدّم',
        text: `شهادة تقدّم الطالب ${student.name} — ${student.juzProgress.length}/30 جزء`,
      });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('تم حفظ شهادة التقدّم كصورة');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذّرت مشاركة الشهادة، حاول مرة ثانية');
    }
  }finally{
    if(btnEl){ btnEl.disabled = false; }
  }
}

/* ---------------- SCORE-OVER-TIME CHART (student detail page) ---------------- */
function drawScoreChart(canvas, examsAsc){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = Math.max(280, rect.width || 320), H = 140;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);

  const padL = 30, padR = 12, padT = 14, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const scores = examsAsc.map(e=>e.score);
  const minScore = Math.max(0, Math.min(...scores) - 5);
  const maxScore = 100;

  // gridlines + y labels
  ctx.strokeStyle = 'rgba(107,99,85,0.18)';
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft') || '#6B6355';
  ctx.font = "500 10px 'Tajawal'";
  ctx.textAlign = 'left';
  [0,50,100].forEach(v=>{
    if(v < minScore) return;
    const y = padT + plotH * (1 - (v-minScore)/(maxScore-minScore));
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W-padR, y); ctx.stroke();
    ctx.fillText(String(v), 2, y+3);
  });

  // line
  const green = getComputedStyle(document.documentElement).getPropertyValue('--green') || '#1B4332';
  const gold = getComputedStyle(document.documentElement).getPropertyValue('--gold') || '#C08A28';
  ctx.strokeStyle = green.trim(); ctx.lineWidth = 2.2; ctx.beginPath();
  examsAsc.forEach((e,i)=>{
    const x = padL + (plotW * (examsAsc.length===1 ? 0.5 : i/(examsAsc.length-1)));
    const y = padT + plotH * (1 - (e.score-minScore)/(maxScore-minScore));
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // points
  examsAsc.forEach((e,i)=>{
    const x = padL + (plotW * (examsAsc.length===1 ? 0.5 : i/(examsAsc.length-1)));
    const y = padT + plotH * (1 - (e.score-minScore)/(maxScore-minScore));
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fillStyle = e.score>=80 ? green.trim() : '#A23E36'; ctx.fill();
  });

  // first/last date labels
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft') || '#6B6355';
  ctx.font = "500 10px 'Tajawal'";
  ctx.textAlign = 'right';
  const firstD = new Date(examsAsc[0].date).toLocaleDateString('ar-EG', {month:'short', day:'numeric'});
  const lastD = new Date(examsAsc[examsAsc.length-1].date).toLocaleDateString('ar-EG', {month:'short', day:'numeric'});
  ctx.fillText(firstD, padL+34, H-6);
  ctx.fillText(lastD, W-padR, H-6);
}

   one giant image. A single tall canvas (one row per student, no cap)
   used to blow past the browser's max canvas size on devices with many

let _reportArt = null;
async function loadReportArt(){
  if(_reportArt) return _reportArt;
  const load = src => new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
  const [header, footerPlaque, footerPlain] = await Promise.all([load(REPORT_ART_SRC.header), load(REPORT_ART_SRC.footerPlaque), load(REPORT_ART_SRC.footerPlain)]);
  _reportArt = { header, footerPlaque, footerPlain };
  return _reportArt;
}
function rrPath(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
const MONTHLY_REPORT_ROWS_PER_PAGE = 18;

async function drawMonthlyReportPages(period, monthStr){

  await loadLogoImage();
  const now = new Date();
  // For a monthly report, monthStr (format 'YYYY-MM') lets the caller pick

      ctx.fillStyle = RC.greenD; ctx.font = "900 66px 'Tajawal'"; ctx.fillText(reportName, W/2, 298); ctx.restore();
      // period pill with side ornaments
      const pw = 300, ph = 58, pcy = 358;
      ctx.save(); ctx.shadowColor='rgba(120,80,10,0.35)'; ctx.shadowBlur=14; ctx.shadowOffsetY=4;
      pill(ctx, W/2, pcy, pw, ph, '#E9C25F', '#B98419'); ctx.restore();
      rrPath(ctx, W/2-pw/2+1.5, pcy-ph/2+1.5, pw-3, ph-3, ph/2-1.5); ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font = "900 31px 'Tajawal'"; ctx.fillText(periodLabel, W/2, pcy+11);
      [-1,1].forEach(sd=>{
        const x0 = W/2 + sd*(pw/2+14), x1 = W/2 + sd*(pw/2+120);
        const lg = ctx.createLinearGradient(x0,0,x1,0); lg.addColorStop(0,RC.gold); lg.addColorStop(1,'rgba(199,154,46,0)');
        ctx.strokeStyle = lg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0,pcy); ctx.lineTo(x1,pcy); ctx.stroke();
        ctx.fillStyle = RC.gold; ctx.beginPath(); ctx.moveTo(x0+sd*6,pcy-9); ctx.lineTo(x0+sd*15,pcy); ctx.lineTo(x0+sd*6,pcy+9); ctx.lineTo(x0-sd*3,pcy); ctx.closePath(); ctx.fill();
      });
      // stat cards (RTL: first card on the right)
      const cardY = 420, cardH = 122, gap = 22, cw = (W - 2*mX - 3*gap)/4;
      const cards = isDay ? [
        { color:['#7A4FB5','#4B2A86'], icon:'cal',    value: now.toLocaleDateString('ar-EG', {day:'numeric', month:'long'}), label:'تاريخ اليوم', f:"900 31px 'Tajawal'" },
        { color:['#2C86C9','#0F4F86'], icon:'clip',   value: periodExams.length, label:'إجمالي الاختبارات' },
        { color:['#2E8B63','#0A4634'], icon:'star',   value: dayPass, label:'ناجح' },
        { color:['#D4604F','#9E2F22'], icon:'people', value: dayFail, label:'إعادة' },
      ] : [
        { color:['#7A4FB5','#4B2A86'], icon:'cal',    value: periodLabel, label: period==='year'?'السنة المحددة':'الشهر المحدد', f:"900 31px 'Tajawal'" },
        { color:['#2C86C9','#0F4F86'], icon:'clip',   value: periodExams.length, label:'إجمالي الاختبارات' },
        { color:['#E0A93A','#A9701A'], icon:'people', value: rows.length, label:'عدد الطلاب' },
        { color:['#2E8B63','#0A4634'], icon:'star',   value: avgAll, label:'متوسط الدرجات' },
      ];
      cards.forEach((c,i)=> statCard(ctx, W-mX-cw-i*(cw+gap), cardY, cw, cardH, c.color, c.icon, c.value, c.label, c.f));
    }

    // section bar + table
    const barBottom = sectionBar(ctx, barY, isFirst ? (isDay ? 'نتائج الطلاب' : 'بيانات الطلاب') : `تابع ${reportName}`, isFirst ? 'people' : 'book');
    const bodyTop = barBottom - 20;
    rrPath(ctx, mX, bodyTop, tW, tableBottom-bodyTop, 24); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.strokeStyle = RC.goldL; ctx.lineWidth = 2.5; ctx.stroke();
    sectionBar(ctx, barY, isFirst ? (isDay ? 'نتائج الطلاب' : 'بيانات الطلاب') : `تابع ${reportName}`, isFirst ? 'people' : 'book');
    const headBottom = (isDay ? drawDayHead : drawTableHead)(ctx, barBottom + 14);
    ctx.save(); rrPath(ctx, inX, headBottom, inW, tableBottom-headBottom-12, 14); ctx.clip();
    if(chunk.length===0){
      ctx.fillStyle='#fff'; ctx.fillRect(inX, headBottom, inW, rowH);
      ctx.fillStyle = RC.soft; ctx.textAlign='center'; ctx.font="500 21px 'Tajawal'"; ctx.fillText(isDay ? 'ما في اختبارات مسجّلة اليوم' : 'لا توجد اختبارات ناجحة في هذه الفترة', W/2, headBottom+rowH/2+8);
    }
    chunk.forEach((row,i)=> (isDay ? drawDayRow : drawRow)(ctx, headBottom + i*rowH, row, i));
    ctx.restore();

    // footer text
    ctx.direction='rtl'; ctx.textAlign='center';
    const fTop = H - footerH;
    if(isLast){
      if(isDay){
        ctx.fillStyle = '#0B2F24'; ctx.font = "900 40px 'Tajawal'"; ctx.fillText(`متوسط علامات اليوم: ${avgAll}`, W/2+8, fTop+Math.round(117*S)-14);
        ctx.fillStyle = '#9A6A1A'; ctx.font = "700 27px 'Tajawal'"; ctx.fillText('وفّقكم الله وبارك في حفظكم', W/2+8, fTop+Math.round(117*S)+30);
      } else {
      ctx.fillStyle = '#0B2F24'; ctx.font = "700 42px 'Amiri', serif"; ctx.fillText('نَسأَلُ اللهَ أَنْ يَتَقَبَّلَ مِنَ الجَمِيعِ', W/2+8, fTop+Math.round(117*S)-14);
      ctx.fillStyle = '#9A6A1A'; ctx.font = "700 27px 'Tajawal'"; ctx.fillText('(وأن يجعل القرآن نوراً لهم في الدنيا والآخرة)', W/2+8, fTop+Math.round(117*S)+30);
      }
    }
    if(totalPages>1){
      ctx.fillStyle = RC.soft; ctx.font = "700 22px 'Tajawal'";
      ctx.fillText(`صفحة ${pageIdx+1} من ${totalPages}`, W/2, isLast ? H-26 : fTop+Math.round(120*S)+8);
    }
    return canvas;
  });

  return { pages, monthExams: periodExams };
}

async function generateMonthlyReport(btnEl, period, monthStr){
  period = period || 'month';
  if(btnEl) btnEl.disabled = true;
  try{
    if(!window.jspdf || !window.jspdf.jsPDF){
      showToast('تعذّر تحميل مكتبة PDF — تأكد إنك متصل بالإنترنت أول مرة تستخدم هذا الزر');
      return;
    }
    const { pages, monthExams } = await drawMonthlyReportPages(period, monthStr);
    if(monthExams.length === 0){
      showToast(period==='year' ? 'لا توجد اختبارات مسجّلة هالسنة بعد' : 'لا توجد اختبارات مسجّلة بهذا الشهر');
      return;
    }
    const { jsPDF } = window.jspdf;
    const first = pages[0];
    const pdf = new jsPDF({ orientation: first.width>=first.height?'l':'p', unit:'pt', format:[first.width, first.height] });
    pages.forEach((canvas, i)=>{
      if(i>0) pdf.addPage([canvas.width, canvas.height], canvas.width>=canvas.height?'l':'p');
      const imgData = canvas.toDataURL('image/jpeg', 0.93);
      pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
    });

    const now = new Date();
    const [fnYear, fnMonth] = (period==='month' && monthStr && /^\d{4}-\d{1,2}$/.test(monthStr))
      ? monthStr.split('-').map(Number)
      : [now.getFullYear(), now.getMonth()+1];
    const fileName = period==='year'
      ? `تقرير-سنوي-${now.getFullYear()}.pdf`
      : `تقرير-شهري-${fnYear}-${fnMonth}.pdf`;
    const blob = pdf.output('blob');
    const file = new File([blob], fileName, { type:'application/pdf' });
    const title = period==='year' ? 'التقرير السنوي' : 'التقرير الشهري';

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title, text: title + ' لـ' + getCenterSettings().name });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast(period==='year' ? 'تم حفظ التقرير السنوي كملف PDF' : 'تم حفظ التقرير الشهري كملف PDF');
    }
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذّر إصدار التقرير، حاول مرة ثانية');
    }
  }finally{
    if(btnEl) btnEl.disabled = false;
  }
}

/* Same daily results report, exported as a one-page PDF instead of a
   PNG — some people prefer sending/printing a PDF. Reuses the exact
   same canvas drawing; only the export format differs. */
/* Batch certificate generation — one combined PDF with one page per
   eligible exam (passed, not a retry) within the chosen month. Reuses
   the exact same drawCertificate() used for individual shares, so the
   design always stays in sync automatically. */
async function generateBatchCertificatesPDF(monthStr, btnEl){
  if(btnEl) btnEl.disabled = true;
  const errEl = document.getElementById('batch-cert-error');
  if(errEl) errEl.textContent = '';
  try{
    if(!window.jspdf || !window.jspdf.jsPDF){
      showToast('تعذّر تحميل مكتبة PDF — تأكد إنك متصل بالإنترنت أول مرة تستخدم هذا الزر');
      return;
    }
    if(!monthStr){ if(errEl) errEl.textContent = 'اختر الشهر أولاً'; return; }
    const eligible = visibleExams()
      .filter(e => !e.stoppedEarly && e.score >= 80 && e.date.slice(0,7) === monthStr)
      .sort((a,b)=> a.studentName.localeCompare(b.studentName, 'ar'));
    if(eligible.length === 0){
      showToast('ما في شهادات مستحقة خلال هذا الشهر');
      return;
    }
    showToast(`جاري توليد ${eligible.length} شهادة...`);
    const { jsPDF } = window.jspdf;
    let pdf = null;
    let failedCount = 0;
    const startedAt = Date.now();
    for(let i=0; i<eligible.length; i++){
      showToast(`جاري توليد الشهادة ${i+1} من ${eligible.length}...`);
      // Yield to the browser between certificates so it actually gets a
      // chance to paint that progress toast and stay responsive, instead
      // of running all the canvas work back-to-back on one long block
      // that can look like a frozen/blank screen on a slower phone.
      await new Promise(r => setTimeout(r, 0));
      let canvas;
      try{
        // A stuck font load or image decode should not freeze the whole
        // batch forever — skip that one certificate and keep going
        // rather than leaving the person staring at "جاري توليد" with
        // no feedback and no result.
        canvas = await withTimeout(drawCertificate(eligible[i]), 15000);
      }catch(e){
        console.warn('تعذّر توليد شهادة الطالب', eligible[i].studentName, e);
        failedCount++;
        continue;
      }
      // JPEG instead of PNG: certificates have no transparency to lose,
      // and this cuts file size drastically (often 5-10x smaller) —
      // important for a multi-page batch PDF on a mobile connection,
      // where a huge PNG-based file is the most likely reason nothing
      // seems to happen after "جاري توليد".
      const imgData = canvas.toDataURL('image/jpeg', 0.85);
      if(!pdf){
        pdf = new jsPDF({ orientation:'l', unit:'pt', format:[canvas.width, canvas.height], compress: true });
      } else {
        pdf.addPage([canvas.width, canvas.height], 'l');
      }
      pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
    }
    if(!pdf){
      showToast('تعذّر توليد أي شهادة — جرّب مرة ثانية أو تحقّق من الاتصال');
      return;
    }
    const successCount = eligible.length - failedCount;
    const elapsedSec = Math.round((Date.now() - startedAt) / 1000);
    showToast(`جاري تجهيز الملف (${elapsedSec} ثانية)...`);
    const [year, month] = monthStr.split('-');
    const fileName = `شهادات-${year}-${month}.pdf`;
    const blob = pdf.output('blob');

    // Batch PDFs can get large (many pages) — handing a large file to
    // the OS share sheet is the more failure-prone path on mobile
    // (can silently do nothing on some devices/browsers), so batches
    // always go straight to a direct download instead of navigator.share.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 30000);
    showToast(failedCount>0
      ? `تم توليد ${successCount} من ${eligible.length} شهادة (تعذّر توليد ${failedCount}) — تحقّق من مجلد التنزيلات`
      : `تم توليد ${successCount} شهادة بملف واحد — تحقّق من مجلد التنزيلات`);
  }catch(e){
    if(e && e.name !== 'AbortError'){
      console.error(e);
      showToast('تعذّر توليد الشهادات، حاول مرة ثانية');
    }
  }finally{
    if(btnEl) btnEl.disabled = false;
  }
}

  const upcomingWeek = state.schedule
    .filter(s => !s.done)

      return diffDays >= -0.5 && diffDays <= 7;
    })
    .sort((a,b) => new Date(a.date) - new Date(b.date));

    const lastDate = sessions.reduce((max, m) => Math.max(max, new Date(m.date).getTime()), 0);

  }).filter(t => t.daysSince === null || t.daysSince >= INACTIVE_DAYS);

  return `

  <div class="stat-row">

  <div class="settings-block">
    <h3>مواعيد الأسبوع الجاي</h3>
    ${upcomingWeek.length===0 ? `<p style="font-size:12.5px; color:var(--ink-soft);">ما في مواعيد محجوزة خلال الأسبوع الجاي.</p>` : upcomingWeek.slice(0,8).map(s=>{
      const d = new Date(s.date).toLocaleDateString('ar-EG', {weekday:'long', month:'short', day:'numeric'});

    }).join('')}

  </div>

function statsView(){
  const studentCounts = {}, teacherCounts = {}, studentScores = {};
  state.exams.forEach(e=>{
    const s = e.studentName.trim(), t = e.teacherName.trim();
    studentCounts[s] = (studentCounts[s]||0) + 1;
    teacherCounts[t] = (teacherCounts[t]||0) + 1;
    if(!studentScores[s]) studentScores[s] = { total:0, count:0 };
    studentScores[s].total += e.score;
    studentScores[s].count += 1;
  });

  const uniqueStudents = Object.keys(studentCounts).length;
  const topStudent = Object.entries(studentCounts).sort((a,b)=>b[1]-a[1])[0];
  const topTeacher = Object.entries(teacherCounts).sort((a,b)=>b[1]-a[1])[0];

  // "أفضل طالب" ranking: a raw average lets a student with a single
  // lucky 90+ exam outrank a student who has taken many exams and
  // consistently scored 92-99. To fix that we pull every student's
  // average toward the overall average by a fixed number of "virtual"
  // exams (Bayesian/Laplace smoothing) — so a student with very few
  // exams needs a very high score to compete, while a student with
  // lots of exams is barely affected (their real average speaks for
  // itself). The displayed average is still each student's true,
  // unsmoothed average — only the ranking uses the smoothed score.
  const allScoresCount = state.exams.length;
  const overallAvg = allScoresCount ? state.exams.reduce((s,e)=>s+e.score,0)/allScoresCount : 0;
  const MIN_EXAMS_FOR_BEST = 3; // below this, treat the student as "not enough data yet"
  const SMOOTHING_WEIGHT = 4;  // acts like 4 extra exams at the overall average
  const bestStudentCandidates = Object.entries(studentScores)
    .map(([name,d])=>({
      name,
      avg: Math.round(d.total/d.count),
      count: d.count,
      ranked: (d.total + SMOOTHING_WEIGHT*overallAvg) / (d.count + SMOOTHING_WEIGHT),
    }));
  const bestStudentPool = bestStudentCandidates.filter(c=>c.count >= MIN_EXAMS_FOR_BEST);
  const bestStudent = (bestStudentPool.length ? bestStudentPool : bestStudentCandidates)
    .sort((a,b)=> b.ranked - a.ranked)[0];

/* Best-effort "which teacher does this student belong to" — explicit
   registration wins, otherwise inferred from whoever has tested or
   logged memorization sessions for them most. */
function getStudentTeacherName(student){
  if(student.registeredByTeacher) return student.registeredByTeacher;
  const counts = {};
  state.exams.forEach(e=>{
    if(e.studentName.trim().toLowerCase()===student.name.trim().toLowerCase() && e.teacherName){
      counts[e.teacherName] = (counts[e.teacherName]||0) + 1;
    }
  });
  state.memorization.forEach(m=>{
    if(m.studentName.trim().toLowerCase()===student.name.trim().toLowerCase() && m.teacherName){
      counts[m.teacherName] = (counts[m.teacherName]||0) + 1;
    }
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return entries.length ? entries[0][0] : null;
}

/* Booking rules helpers (used by the schedule form) — see requirement:
   bookings only on Sat/Mon/Wed, max BOOKING_MAX_PER_DAY per day, and a
   student whose most recent exam was a fail (<80) within the last
   week can't book again until the cooldown passes. */
function isAllowedBookingDay(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  return BOOKING_ALLOWED_WEEKDAYS.includes(d.getDay());
}
function bookingDayCount(dateStr){
  return state.schedule.filter(s=>s.date===dateStr && !s.done).length;
}
/* Juz' that require having passed a cumulative ("تجميعي") checkpoint
   exam first, per the center's curriculum. Selecting any of these when
   starting a new test triggers a reminder prompt before the examiner
   can proceed (see attachTestSetupHandlers → btn-start-test). */
const CUMULATIVE_CHECKPOINT_JUZ = [27, 25, 22, 19, 17];

/* Mirrors studentBookingBlockedReason's 7-day fail cooldown, but for
   actually entering the test-scoring page (not just booking a slot):
   a student whose most recent exam was a fail/retry within the last
   week can't be scored again until the cooldown passes, unless the
   examiner explicitly overrides it. */
function studentTestCooldownBlockedReason(studentName){
  const trimmed = (studentName||'').trim();
  if(!trimmed) return null;
  const examsForStudent = state.exams.filter(e=>e.studentName.trim()===trimmed).sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!examsForStudent.length) return null;
  const last = examsForStudent[0];
  const isFail = last.stoppedEarly || last.score < 80;
  if(!isFail) return null;
  const daysSince = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24);
  if(daysSince >= BOOKING_FAIL_COOLDOWN_DAYS) return null;
  const daysLeft = Math.max(1, Math.ceil(BOOKING_FAIL_COOLDOWN_DAYS - daysSince));
  const daysWord = daysLeft===1 ? 'يوم واحد' : daysLeft===2 ? 'يومين' : `${daysLeft} أيام`;
  return `الطالب لم يجتز آخر اختبار تقدّم له — ممنوع يعيد الاختبار إلا بعد أسبوع من تاريخ الاختبار الذي لم يجتزه (متبقي تقريباً ${daysWord}).`;
}

function studentBookingBlockedReason(studentName){
  const trimmed = (studentName||'').trim();
  if(!trimmed) return null;
  const examsForStudent = state.exams.filter(e=>e.studentName.trim()===trimmed).sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!examsForStudent.length) return null;
  const last = examsForStudent[0];
  const daysSince = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24);
  if(last.score < 80 && daysSince < BOOKING_FAIL_COOLDOWN_DAYS){
    const daysLeft = Math.max(1, Math.ceil(BOOKING_FAIL_COOLDOWN_DAYS - daysSince));
    const daysWord = daysLeft===1 ? 'يوم واحد' : daysLeft===2 ? 'يومين' : `${daysLeft} أيام`;
    return `المحفظ الحبيب: في حال عدم نجاح الطالب في الاختبار يحرم من الحجز خلال أسبوع. (متبقي تقريباً ${daysWord})`;
  }
  return null;
}

function attachScheduleHandlers(){
  document.querySelectorAll('.notif-read').forEach(b=>{
    b.onclick = async ()=>{
      const n = state.notifications.find(x=>x.id===b.dataset.id);
      if(n){
        if(!n.readBy) n.readBy = [];
        if(!n.readBy.includes(state.currentUser)) n.readBy.push(state.currentUser);
        await saveNotifications();
        render();
      }
    };
  });

  const toggleBtn = document.getElementById('btn-toggle-schedule-form');
  const formWrap = document.getElementById('schedule-form-wrap');
  if(toggleBtn && formWrap) toggleBtn.onclick = ()=>{
    formWrap.style.display = formWrap.style.display==='none' ? 'block' : 'none';
  };

  const saveBtn = document.getElementById('btn-save-schedule');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const errEl = document.getElementById('sch-error');
    if(errEl) errEl.textContent = '';
    const studentName = document.getElementById('sch-student').value.trim();
    const date = document.getElementById('sch-date').value;
    const note = document.getElementById('sch-note').value.trim();
    const teacherSel = document.getElementById('sch-teacher');
    const teacherName = state.currentRole==='teacher' ? (state.currentTeacherLink || '') : (teacherSel ? teacherSel.value : '');
    if(!studentName || !date){ showToast('الرجاء تعبئة اسم الطالب والتاريخ'); return; }
    if(!isAllowedBookingDay(date)){
      const msg = `الحجز متاح بس أيام ${bookingDaysText()} — اختر تاريخ تاني.`;
      if(errEl) errEl.textContent = msg; showToast(msg); return;
    }
    if(bookingDayCount(date) >= BOOKING_MAX_PER_DAY){
      const msg = `المحفظ الحبيب: العدد عند المختبر مكتمل لهذا اليوم (${BOOKING_MAX_PER_DAY} طلاب) — بإمكانك تحجز بموعد تاني.`;
      if(errEl) errEl.textContent = msg; showToast(msg); return;
    }
    const blockReason = studentBookingBlockedReason(studentName);
    const overrideEl = document.getElementById('sch-override');
    const isOverride = state.currentRole !== 'teacher' && overrideEl && overrideEl.checked;
    if(blockReason && !isOverride){
      if(errEl) errEl.textContent = blockReason; showToast(blockReason); return;
    }
    state.schedule.push({
      id: 'sc_' + Date.now(), studentName, teacherName, date, note, done:false, createdAt: new Date().toISOString(),
      ...(blockReason && isOverride ? { overriddenBy: state.currentUser } : {}),
    });
    await saveSchedule();
    showToast(blockReason && isOverride ? 'تم إضافة الموعد استثنائياً رغم الرسوب الأخير' : 'تم إضافة الموعد');
    render();
  };

  document.querySelectorAll('.sch-done').forEach(b=>{
    b.onclick = async ()=>{
      const item = state.schedule.find(s => s.id===b.dataset.id);
      if(item) item.done = true;
      await saveSchedule();
      render();
    };
  });

  document.querySelectorAll('.sch-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('حذف هذا الموعد؟')) return;
      state.schedule = state.schedule.filter(s => s.id!==b.dataset.id);
      await saveSchedule();
      render();
    };
  });
}

function memorizationView(){

/* A student "belongs" to a teacher if the teacher explicitly registered
   them here, or if they show up in that teacher's exam/memorization
   history — this way students created earlier (before this feature
   existed) still show up for the right teacher without manual re-entry. */
function getTeacherStudentNames(teacherName){
  const names = new Set();
  state.students.forEach(s=>{ if(s.registeredByTeacher === teacherName) names.add(s.name.trim().toLowerCase()); });
  state.exams.forEach(e=>{ if(e.teacherName === teacherName) names.add(e.studentName.trim().toLowerCase()); });
  state.memorization.forEach(m=>{ if(m.teacherName === teacherName) names.add(m.studentName.trim().toLowerCase()); });
  return names;
}

/* Exam-results recovery import — for exams that were completed and
   scored but never made it into the saved data (e.g. the device
   closed before the write went through). Lets an admin/examiner
   re-enter them from a spreadsheet in bulk instead of redoing each
   exam one by one through the scoring screen. */
async function downloadExamImportTemplate(){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('نتائج الاختبارات', { views: [{ rightToLeft: true }] });
  ws.columns = [
    { header: 'اسم الطالب', key: 'name', width: 26 },
    { header: 'اسم المحفّظ', key: 'teacher', width: 24 },
    { header: 'الجزء (رقم)', key: 'juz', width: 14 },
    { header: 'العلامة (أو اكتب إعادة)', key: 'score', width: 20 },
    { header: 'التاريخ (YYYY-MM-DD)', key: 'date', width: 20 },
  ];
  ws.getRow(1).font = { bold: true };
  ws.addRow({ name: 'مثال: أحمد محمد', teacher: 'سيف الدين الجرجاوي', juz: 21, score: 95, date: '2026-09-12' });
  ws.addRow({ name: 'مثال: خالد سامي', teacher: 'محمود بكير', juz: 29, score: 'إعادة', date: '2026-09-12' });
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'نموذج-نتائج-اختبارات.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function importExamsFromExcel(file){
  try{
    const wb = new ExcelJS.Workbook();
    const buf = await file.arrayBuffer();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    let added = 0;
    const batchEntries = [];
    let rowIndex = 0;
    ws.eachRow((row, rowNumber)=>{
      if(rowNumber === 1) return; // header row
      const name = String(row.getCell(1).value || '').trim();
      if(!name || name.startsWith('مثال')) return;
      const teacherName = String(row.getCell(2).value || '').trim();
      const juz = String(row.getCell(3).value || '').trim();
      const scoreRaw = String(row.getCell(4).value || '').trim();
      let dateRaw = row.getCell(5).value;
      let dateStr = '';
      if(dateRaw instanceof Date) dateStr = dateRaw.toISOString().slice(0,10);
      else if(dateRaw) dateStr = String(dateRaw).trim();
      if(!name || !juz || !dateStr) return;

      const isRetry = /إعادة|retry/i.test(scoreRaw);
      const score = isRetry ? 0 : (parseFloat(scoreRaw) || 0);
      rowIndex++;
      const record = {
        id: 'e_' + Date.now() + '_' + rowIndex,
        studentName: name,
        teacherName,
        juz,
        notes: '',
        testerName: state.currentUser,
        deductions: { lahn: 0, khataa: 0, tanbih: 0 },
        score,
        date: new Date(dateStr + 'T12:00:00').toISOString(),
        ...(isRetry ? { stoppedEarly: true } : {}),
        importedFromExcel: true,
      };
      state.exams.unshift(record);
      upsertStudentFromExam(record);
      batchEntries.push({ examId: record.id });
      added++;
    });
    if(batchEntries.length){
      state.importBatches.unshift({
        id: 'ib_' + Date.now(),
        source: 'exams-excel',
        date: new Date().toISOString(),
        importedBy: state.currentUser,
        fileName: file.name,
        entries: batchEntries,
      });
      await saveImportBatches();
    }
    state.exams.sort((a,b)=> new Date(b.date) - new Date(a.date));
    await saveExams();
    await saveStudents();
    showToast(`تم استرجاع ${added} نتيجة اختبار بنجاح`);
    render();
  }catch(e){
    console.error(e);
    showToast('تعذّر قراءة الملف — تأكد إنه بنفس صيغة النموذج');
  }
}

async function importStudentsFromExcel(file){
  try{
    const wb = new ExcelJS.Workbook();
    const buf = await file.arrayBuffer();
    await wb.xlsx.load(buf);
    const ws = wb.worksheets[0];
    let added = 0, updated = 0;
    const batchEntries = [];
    ws.eachRow((row, rowNumber)=>{
      if(rowNumber === 1) return; // header row
      const name = String(row.getCell(1).value || '').trim();
      if(!name || name.startsWith('مثال')) return;
      const nationalId = String(row.getCell(2).value || '').trim();
      let birthDateRaw = row.getCell(3).value;
      let birthDate = '';
      if(birthDateRaw instanceof Date){
        birthDate = birthDateRaw.toISOString().slice(0,10);
      } else if(birthDateRaw){
        birthDate = String(birthDateRaw).trim();
      }
      const phone = String(row.getCell(4).value || '').trim();

      let student = state.students.find(s => s.name.trim().toLowerCase()===name.toLowerCase());
      let wasNew = false;
      let prevSnapshot = null;
      if(!student){
        student = { id: makeStudentId(), name, phone:'', notes:'', juzProgress:[], createdAt: new Date().toISOString() };
        state.students.push(student);
        added++;
        wasNew = true;
      } else {
        updated++;
        prevSnapshot = {
          nationalId: student.nationalId || '', birthDate: student.birthDate || null,
          phone: student.phone || '', registeredByTeacher: student.registeredByTeacher || null,
        };
      }
      student.registeredByTeacher = student.registeredByTeacher || state.currentTeacherLink;
      if(nationalId) student.nationalId = nationalId;
      if(birthDate) student.birthDate = birthDate;
      if(phone) student.phone = phone;
      batchEntries.push({ studentId: student.id, wasNew, prevSnapshot });
    });
    if(batchEntries.length){
      state.importBatches.unshift({
        id: 'ib_' + Date.now(),
        source: 'students-excel',
        date: new Date().toISOString(),
        importedBy: state.currentUser,
        teacherName: state.currentTeacherLink,
        fileName: file.name,
        entries: batchEntries,
      });
      await saveImportBatches();
    }
    await saveStudents();
    showToast(`تم الاستيراد: ${added} طالب جديد، ${updated} طالب محدَّث`);
    render();
  }catch(e){
    console.error(e);
    showToast('تعذّر قراءة الملف — تأكد إنه بنفس صيغة النموذج');
  }
}

/* Reverts a mistaken import: newly-created students are removed
   entirely (unless they've since gained real exam/memorization
   history, in which case only the imported fields are cleared to
   avoid deleting genuine records); updated students have their prior
   field values restored exactly as they were before the import. */
async function undoImportBatch(batchId){
  const batch = state.importBatches.find(b => b.id===batchId);
  if(!batch) return;

  if(batch.source === 'exams-excel'){
    if(!confirm(`متأكد إنك بدك تتراجع عن استيراد هذه النتائج (${batch.entries.length} اختبار)؟`)) return;
    const examIds = new Set(batch.entries.map(e => e.examId));
    const affectedStudents = new Set(state.exams.filter(e => examIds.has(e.id)).map(e => e.studentName.trim().toLowerCase()));
    state.exams = state.exams.filter(e => !examIds.has(e.id));
    // Recompute juzProgress for affected students from their remaining
    // real exam history, so an undone import doesn't leave behind a
    // "completed juz" that no longer has a passing exam backing it.
    affectedStudents.forEach(nameKey=>{
      const student = state.students.find(s => s.name.trim().toLowerCase()===nameKey);
      if(!student) return;
      student.juzProgress = [];
      state.exams
        .filter(e => e.studentName.trim().toLowerCase()===nameKey && !e.stoppedEarly && e.score >= 80)
        .forEach(e=>{
          (String(e.juz).match(/\d+/g) || []).map(Number).forEach(n=>{
            if(n>=1 && n<=30 && !student.juzProgress.includes(n)) student.juzProgress.push(n);
          });
        });
    });
    state.importBatches = state.importBatches.filter(b => b.id !== batchId);
    await saveExams();
    await saveStudents();
    await saveImportBatches();
    showToast(`تم التراجع: ${examIds.size} اختبار محذوف`);
    render();
    return;
  }

  if(!confirm(`متأكد إنك بدك تتراجع عن هذا الاستيراد (${batch.entries.length} طالب)؟`)) return;

  let removed = 0, reverted = 0;
  batch.entries.forEach(entry=>{
    const student = state.students.find(s => s.id===entry.studentId);
    if(!student) return;
    if(entry.wasNew){
      const hasHistory = state.exams.some(e=>e.studentName.trim().toLowerCase()===student.name.trim().toLowerCase())
        || state.memorization.some(m=>m.studentName.trim().toLowerCase()===student.name.trim().toLowerCase());
      if(!hasHistory){
        state.students = state.students.filter(s => s.id !== student.id);
        removed++;
      } else {
        student.nationalId = ''; student.birthDate = null; student.phone = ''; student.registeredByTeacher = null;
        reverted++;
      }
    } else if(entry.prevSnapshot){
      student.nationalId = entry.prevSnapshot.nationalId;
      student.birthDate = entry.prevSnapshot.birthDate;
      student.phone = entry.prevSnapshot.phone;
      student.registeredByTeacher = entry.prevSnapshot.registeredByTeacher;
      reverted++;
    }
  });
  state.importBatches = state.importBatches.filter(b => b.id !== batchId);
  await saveStudents();
  await saveImportBatches();
  showToast(`تم التراجع: ${removed} طالب محذوف، ${reverted} طالب رجّع لبياناته القديمة`);
  render();
}

      .filter(e => e.studentName.trim().toLowerCase()===student.name.trim().toLowerCase())

      : `${getCenterSettings().fullName}\nالطالب: ${student.name}\nالتقدّم التراكمي: ${student.juzProgress.length}/30 جزء`;

function attachSettingsHandlers(){
  const themeBtn = document.getElementById('btn-toggle-theme');
  if(themeBtn) themeBtn.onclick = toggleTheme;

  const testBadgeBtn = document.getElementById('btn-test-badge');
  if(testBadgeBtn) testBadgeBtn.onclick = ()=>{
    navigator.setAppBadge(3)
      .then(()=> showToast('تم — دوس زر الرجوع واقفل التطبيق وشوف الأيقونة'))
      .catch(err => showToast('تعذّر تفعيل البادج: ' + (err && err.message ? err.message : 'خطأ غير معروف')));
  };
  const clearBadgeBtn = document.getElementById('btn-clear-badge');
  if(clearBadgeBtn) clearBadgeBtn.onclick = ()=>{
    navigator.clearAppBadge().then(()=> showToast('تم مسح الرقم')).catch(()=>{});
  };

  const toggleCenterBtn = document.getElementById('btn-toggle-center-settings');
  if(toggleCenterBtn) toggleCenterBtn.onclick = ()=>{ centerSettingsExpanded = true; render(); };
  const collapseCenterBtn = document.getElementById('btn-collapse-center-settings');
  if(collapseCenterBtn) collapseCenterBtn.onclick = ()=>{ centerSettingsExpanded = false; render(); };

  const csLogoTrigger = document.getElementById('btn-cs-logo-trigger');
  const csLogoFile = document.getElementById('cs-logo-file');
  let pendingLogoDataUri = null;
  if(csLogoTrigger && csLogoFile){
    csLogoTrigger.onclick = ()=> csLogoFile.click();
    csLogoFile.onchange = ()=>{
      const file = csLogoFile.files[0];
      if(!file) return;

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

/* App startup:
   - Firebase Auth mode: wait for Firebase to report whether a session
     is already persisted (auto-login across reloads) before rendering,
     and re-check the user's Firestore profile (role/disabled) every
     time auth state changes.
   - Legacy mode: no session to restore, just load data and render. */
if (firebaseAuth){
  let firstAuthCheck = true;
  let firstCheckDone = false;

  // Failsafe: on a slow/flaky connection, Firebase's initial handshake
  // (and the Firestore profile lookup below) can hang far longer than a
  // user will wait. If nothing has resolved within 6 seconds, stop
  // waiting and show the login screen anyway — onAuthStateChanged keeps
  // listening in the background and will still update the view later
  // if/when the connection catches up.
  const finishFirstCheck = async ()=>{
    if (firstCheckDone) return;
    firstCheckDone = true;
    firstAuthCheck = false;
    await loadAppData();
  };

  // If the device has no internet right at startup, don't wait on
  // Firebase's own session check at all — restore straight from our
  // own local cache of the last successful login on this device.
  // Firebase's offline behavior for a brand-new page load isn't fast
  // or reliable enough to depend on here; this sidesteps it entirely,
  // and is what makes "log in once, then always land on your own page
  // even with zero connectivity afterward" actually work.
  let restoredFromOfflineCache = false;
  function tryRestoreOfflineSession(){
    if (firstCheckDone || navigator.onLine) return false;
    try{
      const uid = localStorage.getItem('last_session_uid');
      if(!uid) return false;
      const cached = localStorage.getItem('cached_profile_' + uid);
      if(!cached) return false;
      const profile = JSON.parse(cached);
      state.currentUser = profile.username;
      state.currentRole = profile.role;
      state.currentTeacherLink = profile.teacherLink;
      state.currentUid = uid;
      restoredFromOfflineCache = true;
      finishFirstCheck();
      return true;
    }catch(e){ return false; }
  }

  if (!tryRestoreOfflineSession()){
    setTimeout(()=>{ finishFirstCheck(); }, 6000);
  }

  firebaseAuth.onAuthStateChanged(async (user)=>{
    if (user){
      try{
        const doc = await withTimeout(firestoreDb.collection('users').doc(user.uid).get(), 5000);
        if (doc.exists && !doc.data().disabled){
          state.currentUser = doc.data().username;
          state.currentRole = doc.data().role || 'examiner';
          state.currentTeacherLink = doc.data().teacherLink || null;
          state.currentUid = user.uid;
          try{
            localStorage.setItem('cached_profile_' + user.uid, JSON.stringify({
              username: state.currentUser, role: state.currentRole, teacherLink: state.currentTeacherLink,
            }));
            localStorage.setItem('last_session_uid', user.uid);
          }catch(e){}
        } else {
          await firebaseAuth.signOut();
          state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
          try{ localStorage.removeItem('last_session_uid'); }catch(e){}
        }
      }catch(e){
        console.warn('تعذّر تحميل بيانات الحساب من الخادم — استخدام آخر نسخة محفوظة محلياً', e);
        // Fully offline with no warmed-up Firestore cache yet: restore
        // the session from our own localStorage snapshot of this same
        // profile, saved the last time the read above succeeded. This
        // is what lets someone who logged in once (while online) keep
        // landing straight on their own page every time they reopen the
        // app with no internet at all, instead of a stuck loading screen.
        try{
          const cached = localStorage.getItem('cached_profile_' + user.uid);
          if(cached){
            const profile = JSON.parse(cached);
            state.currentUser = profile.username;
            state.currentRole = profile.role;
            state.currentTeacherLink = profile.teacherLink;
            state.currentUid = user.uid;
          }
        }catch(e2){}
      }
      restoredFromOfflineCache = false;
    } else if (restoredFromOfflineCache && !navigator.onLine){
      // Firebase is reporting no session, but we're still offline and
      // already showing a session we restored from our own cache above
      // — Firebase's own offline determination right after a cold page
      // load isn't reliable enough to act on here, so keep what we've
      // got instead of bouncing the person back to the login screen.
    } else {
      state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
      try{ localStorage.removeItem('last_session_uid'); }catch(e){}
    }
    if (!firstCheckDone){
      await finishFirstCheck();
    } else {
      render();
    }
  });
} else {
  loadAppData();
}

/* Connectivity feedback: lets the examiner know their results are
   still safe (saved locally) even with no internet, and confirms when
   everything has synced back up automatically. */
window.addEventListener('offline', ()=>{
  showToast('غير متصل بالإنترنت — النتائج بتنحفظ عندك وبترفع تلقائياً لما يرجع الاتصال');
});
window.addEventListener('online', ()=>{
  showToast('رجع الاتصال بالإنترنت — جاري رفع البيانات المحفوظة');
  flushPendingSync();
  updateAppBadge();
});

/* App icon badge (installed PWA only, on browsers that support the
   Badging API): shows the number of not-yet-synced items on the app
   icon itself when there's anything pending (most urgent signal), or
   otherwise today's remaining appointment count — so someone can tell
   at a glance, without even opening the app, whether data needs
   attention or how many students are booked today. Falls back to
   doing nothing where the API isn't available (iOS Safari, etc). */
function updateAppBadge(){
  if(!('setAppBadge' in navigator)) return;
  try{
    const pending = getPendingSyncKeys().length;
    if(pending > 0){
      navigator.setAppBadge(pending).catch(()=>{});
      return;
    }
    const todayStr = todayStamp();
    const todayCount = state.schedule ? state.schedule.filter(s => !s.done && s.date === todayStr).length : 0;
    if(todayCount > 0) navigator.setAppBadge(todayCount).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){}
}

/* Keep the sync-status badge in the topbar live (pending count changes
   asynchronously as writes/flushes resolve, with nothing else in the
   UI necessarily triggering a re-render at that moment). */
updateAppBadge();
setInterval(()=>{
  const badge = document.getElementById('sync-status-badge');
  if(badge && state.currentUser) badge.outerHTML = syncStatusBadge();
  updateAppBadge();
}, 4000);

/* Register the service worker so the app shell (this page's HTML/CSS/JS,
   fonts, and icons) loads instantly even with zero connectivity — the
   actual data (exams/students/schedule/accounts) is handled separately
   by Firestore's own offline persistence above. Must be served over
   https:// (or from localhost) — browsers block service workers on
   file:// and plain http://, so this silently does nothing in those
   cases rather than breaking the app. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .catch(e => console.warn('تعذّر تسجيل service worker', e));
  });
}

</script>
</body>
