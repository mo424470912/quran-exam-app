function attachSettingsHandlers(){
  const themeBtn = document.getElementById('btn-toggle-theme');
  if(themeBtn) themeBtn.onclick = toggleTheme;

  const testBadgeBtn = document.getElementById('btn-test-badge');
  if(testBadgeBtn) testBadgeBtn.onclick = ()=>{
    navigator.setAppBadge(3)
      .then(()=> showToast('تم — دوس زر الرجوع واقفل التطبيق وشوف الأيقونة'))
      .catch(err => showToast('تعذّر تفعيل البادج: ' + (err && err.message ? err.message : 'خطأ غير معروف')));
  };
  const clearBadgeBtn = document.getElementById('btn-clear-badge');
  if(clearBadgeBtn) clearBadgeBtn.onclick = ()=>{
    navigator.clearAppBadge().then(()=> showToast('تم مسح الرقم')).catch(()=>{});
  };

  const toggleCenterBtn = document.getElementById('btn-toggle-center-settings');
  if(toggleCenterBtn) toggleCenterBtn.onclick = ()=>{ centerSettingsExpanded = true; render(); };
  const collapseCenterBtn = document.getElementById('btn-collapse-center-settings');
  if(collapseCenterBtn) collapseCenterBtn.onclick = ()=>{ centerSettingsExpanded = false; render(); };

  const csLogoTrigger = document.getElementById('btn-cs-logo-trigger');
  const csLogoFile = document.getElementById('cs-logo-file');
  let pendingLogoDataUri = null;
  if(csLogoTrigger && csLogoFile){
    csLogoTrigger.onclick = ()=> csLogoFile.click();
    csLogoFile.onchange = ()=>{
      const file = csLogoFile.files[0];
      if(!file) return;
      if(file.size > 1024*1024){ showToast('الصورة كبيرة كتير — اختر صورة أصغر من 1 ميغابايت'); return; }
      const reader = new FileReader();
      reader.onload = ()=>{
        pendingLogoDataUri = reader.result;
        const preview = document.getElementById('cs-logo-preview');
        if(preview) preview.src = pendingLogoDataUri;
      };
      reader.readAsDataURL(file);
    };
  }

  const saveCenterBtn = document.getElementById('btn-save-center-settings');
  if(saveCenterBtn) saveCenterBtn.onclick = async ()=>{
    const name = document.getElementById('cs-name').value.trim();
    const fullName = document.getElementById('cs-fullname').value.trim();
    const tagline = document.getElementById('cs-tagline').value.trim();
    const directorName = document.getElementById('cs-director').value.trim();
    state.centerSettings = {
      ...(state.centerSettings || {}),
      name: name || undefined,
      fullName: fullName || undefined,
      tagline: tagline || undefined,
      directorName: directorName || undefined,
      logoDataUri: pendingLogoDataUri || (state.centerSettings && state.centerSettings.logoDataUri) || undefined,
    };
    await saveCenterSettings();
    showToast('تم حفظ هوية المركز');
    centerSettingsExpanded = false;
    render();
  };

  const genBatchBtn = document.getElementById('btn-generate-batch-certs');
  if(genBatchBtn) genBatchBtn.onclick = ()=>{
    const monthInput = document.getElementById('batch-cert-month');
    generateBatchCertificatesPDF(monthInput ? monthInput.value : '', genBatchBtn);
  };

  const examTemplateBtn = document.getElementById('btn-download-exam-template');
  if(examTemplateBtn) examTemplateBtn.onclick = downloadExamImportTemplate;

  const importExamsTrigger = document.getElementById('btn-import-exams-trigger');
  const importExamsInput = document.getElementById('import-exams-file-input');
  if(importExamsTrigger && importExamsInput){
    importExamsTrigger.onclick = ()=> importExamsInput.click();
    importExamsInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(file) importExamsFromExcel(file);
      importExamsInput.value = '';
    };
  }

  document.querySelectorAll('.undo-import-batch').forEach(b=>{
    b.onclick = ()=> undoImportBatch(b.dataset.id);
  });

  const sendNotifBtn = document.getElementById('btn-send-notif');
  if(sendNotifBtn) sendNotifBtn.onclick = async ()=>{
    const targetSel = document.getElementById('notif-target');
    const msgEl = document.getElementById('notif-message');
    const message = msgEl.value.trim();
    if(!message){ showToast('اكتب نص الإشعار الأول'); return; }
    state.notifications.unshift({
      id: 'nt_' + Date.now(),
      message,
      teacherName: targetSel.value || null,
      from: state.currentUser,
      createdAt: new Date().toISOString(),
      readBy: [],
    });
    await saveNotifications();
    showToast('تم إرسال الإشعار');
    render();
  };

  document.querySelectorAll('.del-notif').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('حذف هذا الإشعار؟')) return;
      state.notifications = state.notifications.filter(n=>n.id!==b.dataset.id);
      await saveNotifications();
      render();
    };
  });

  const exportJsonBtn = document.getElementById('btn-export-json');
  if(exportJsonBtn) exportJsonBtn.onclick = exportDataJSON;

  const exportExcelBtn = document.getElementById('btn-export-excel');
  if(exportExcelBtn) exportExcelBtn.onclick = exportDataExcel;

  const importTriggerBtn = document.getElementById('btn-import-trigger');
  const importInput = document.getElementById('import-file-input');
  if(importTriggerBtn && importInput){
    importTriggerBtn.onclick = ()=> importInput.click();
    importInput.onchange = ()=>{
      if(importInput.files && importInput.files[0]){
        if(confirm('رح يتم دمج بيانات الملف مع البيانات الحالية، بدون حذف أي شي موجود. متابعة؟')){
          importDataFromFile(importInput.files[0]);
        }
        importInput.value = '';
      }
    };
  }

  document.querySelectorAll('.restore-backup').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('استرجاع هذه النسخة رح يستبدل كل البيانات الحالية بمحتوى النسخة الاحتياطية. متابعة؟')){
        restoreBackup(b.dataset.key);
      }
    };
  });

  const createManualBackupBtn = document.getElementById('btn-create-manual-backup');
  if(createManualBackupBtn) createManualBackupBtn.onclick = ()=>{
    const label = prompt('اسم النسخة الاحتياطية (اختياري):', '');
    if(label === null) return; // cancelled
    createManualBackup(label);
    showToast('تم إنشاء النسخة الاحتياطية');
    render();
  };

  document.querySelectorAll('.update-manual-backup').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('تحديث هذه النسخة رح يستبدل محتواها بأحدث البيانات الحالية. متابعة؟')){
        updateManualBackup(b.dataset.key);
        showToast('تم تحديث النسخة الاحتياطية');
        render();
      }
    };
  });

  document.querySelectorAll('.del-manual-backup').forEach(b=>{
    b.onclick = ()=>{
      if(confirm('حذف هذه النسخة الاحتياطية نهائياً؟')){
        deleteManualBackup(b.dataset.key);
        showToast('تم حذف النسخة الاحتياطية');
        render();
      }
    };
  });

  document.getElementById('btn-change-pass').onclick = async ()=>{
    const val = document.getElementById('new-pass').value;
    if(!val || val.length<4){ showToast('كلمة المرور يجب ألا تقل عن 4 أحرف'); return; }

    if (firebaseAuth){
      if(val.length < 6){ showToast('كلمة المرور يجب ألا تقل عن 6 أحرف'); return; }
      try{
        await firebaseAuth.currentUser.updatePassword(val);
        showToast('تم تحديث كلمة المرور');
        document.getElementById('new-pass').value = '';
      }catch(e){
        showToast(mapAuthError(e));
      }
      return;
    }

    const acc = state.accounts.find(a=>a.username===state.currentUser);
    if(acc){ acc.password = val; await saveAccounts(); showToast('تم تحديث كلمة المرور'); render(); }
  };

  // Account management: works in both Firebase Auth mode (writes to
  // Firestore) and legacy mode (writes to the shared local accounts array).
  const saveMyEmailBtn = document.getElementById('btn-save-my-email');
  if(saveMyEmailBtn) saveMyEmailBtn.onclick = async ()=>{
    const val = document.getElementById('my-email').value.trim();
    if(!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ showToast('اكتب بريد إلكتروني صحيح'); return; }
    const myAcc = state.accounts.find(a=>(a.localId && a.localId===state.currentLocalId) || (!state.currentLocalId && a.username===state.currentUser));
    if(!myAcc) return;
    if(state.accounts.some(a=>a!==myAcc && (a.email||'').toLowerCase()===val.toLowerCase())){
      showToast('هذا البريد الإلكتروني مستخدم من حساب تاني'); return;
    }
    myAcc.email = val; await saveAccounts(); showToast('تم حفظ البريد الإلكتروني'); render();
  };

  document.querySelectorAll('.save-email').forEach(b=>{
    b.onclick = async ()=>{
      const lid = b.dataset.lid;
      const input = document.querySelector(`.email-edit[data-lid="${CSS.escape(lid)}"]`);
      if(!input) return;
      const val = input.value.trim();
      if(!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ showToast('اكتب بريد إلكتروني صحيح'); return; }
      const acc = state.accounts.find(a=>a.localId===lid);
      if(!acc) return;
      if(state.accounts.some(a=>a!==acc && (a.email||'').toLowerCase()===val.toLowerCase())){
        showToast('هذا البريد الإلكتروني مستخدم من حساب تاني'); return;
      }
      acc.email = val; await saveAccounts(); showToast('تم حفظ البريد الإلكتروني'); render();
    };
  });

  document.querySelectorAll('.toggle-acct').forEach(b=>{
    b.onclick = async ()=>{
      const uid = b.dataset.uid;
      const lid = b.dataset.lid;
      if(firebaseAuth){
        if(!uid) return;
        const acc = state.accounts.find(a=>a.uid===uid);
        const willDisable = !(acc && acc.disabled);
        if(!confirm(willDisable ? 'تعطيل هذا الحساب؟ لن يقدر صاحبه يسجّل دخول.' : 'تفعيل هذا الحساب؟')) return;
        try{
          await firestoreDb.collection('users').doc(uid).update({ disabled: willDisable });
          await loadAccountsFromFirestore();
          showToast(willDisable ? 'تم تعطيل الحساب' : 'تم تفعيل الحساب');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        const acc = state.accounts.find(a=>a.localId===lid);
        if(!acc) return;
        const willDisable = !acc.disabled;
        if(!confirm(willDisable ? 'تعطيل هذا الحساب؟ لن يقدر صاحبه يسجّل دخول.' : 'تفعيل هذا الحساب؟')) return;
        acc.disabled = willDisable;
        await saveAccounts();
        showToast(willDisable ? 'تم تعطيل الحساب' : 'تم تفعيل الحساب');
        render();
      }
    };
  });

  document.querySelectorAll('.role-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.dataset.uid;
      const lid = sel.dataset.lid;
      const newRole = sel.value;
      if(!confirm(`تبديل دور هذا الحساب إلى "${roleLabel[newRole]}"؟`)){ render(); return; }
      if(firebaseAuth){
        if(!uid) return;
        try{
          const updates = { role: newRole };
          if(newRole !== 'teacher') updates.teacherLink = null;
          await firestoreDb.collection('users').doc(uid).update(updates);
          await loadAccountsFromFirestore();
          showToast('تم تحديث الدور');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        const acc = state.accounts.find(a=>a.localId===lid);
        if(!acc) return;
        acc.role = newRole;
        if(newRole !== 'teacher') acc.teacherLink = null;
        await saveAccounts();
        showToast('تم تحديث الدور');
        render();
      }
    };
  });

  document.querySelectorAll('.teacher-link-select').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.dataset.uid;
      const lid = sel.dataset.lid;
      const newLink = sel.value || null;
      if(firebaseAuth){
        if(!uid) return;
        try{
          await firestoreDb.collection('users').doc(uid).update({ teacherLink: newLink });
          await loadAccountsFromFirestore();
          showToast('تم ربط الحساب بالمحفّظ');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        const acc = state.accounts.find(a=>a.localId===lid);
        if(!acc) return;
        acc.teacherLink = newLink;
        await saveAccounts();
        showToast('تم ربط الحساب بالمحفّظ');
        render();
      }
    };
  });

  // Deletes the account's Firestore profile. In Firebase mode this is
  // effectively a full delete from the app's point of view — without a
  // profile doc the account can no longer sign in (onAuthStateChanged
  // signs them out automatically, see app startup code below). Note: the
  // underlying Firebase Authentication login entry itself can only be
  // fully removed from the Firebase Console (client apps can't delete
  // other users' Auth entries without a backend) — this is rare to need
  // since the account is already locked out of the app either way.
  document.querySelectorAll('.del-acct').forEach(b=>{
    b.onclick = async ()=>{
      const uid = b.dataset.uid;
      const lid = b.dataset.lid;
      if(firebaseAuth){
        if(!uid) return;
        if(!confirm('حذف هذا الحساب نهائياً؟ لن يقدر صاحبه يسجّل دخول أو يستخدم البرنامج بعدها.')) return;
        try{
          await firestoreDb.collection('users').doc(uid).delete();
          await loadAccountsFromFirestore();
          showToast('تم حذف الحساب');
          render();
        }catch(e){ showToast('تعذّر تنفيذ العملية'); }
      } else {
        if(!confirm('حذف هذا الحساب؟')) return;
        state.accounts = state.accounts.filter(a=>a.localId!==lid);
        await saveAccounts();
        render();
      }
    };
  });

  const refreshAcctsBtn = document.getElementById('btn-refresh-accounts');
  if(refreshAcctsBtn) refreshAcctsBtn.onclick = async ()=>{
    refreshAcctsBtn.disabled = true;
    await loadAccountsFromFirestore();
    showToast('تم تحديث قائمة الحسابات');
    render();
  };

  const clearBtn = document.getElementById('btn-clear-data');
  if(clearBtn) clearBtn.onclick = async ()=>{
    if(!confirm('سيتم حذف جميع سجلات الاختبارات نهائياً. هل أنت متأكد؟')) return;
    state.exams = [];
    await saveExams();
    showToast('تم حذف جميع السجلات');
    render();
  };

  // Full factory reset (legacy/local mode, admin only) — wipes every
  // stored collection including accounts, then drops back to the
  // "create the first admin account" screen, exactly like a brand-new
  // install. Guarded by two separate confirmations since it cannot be
  // undone from inside the app.
  const fullResetBtn = document.getElementById('btn-full-reset');
  if(fullResetBtn) fullResetBtn.onclick = async ()=>{
    if(!confirm('هاد رح يمسح كل شي نهائياً: الاختبارات، الطلاب، المواعيد، وكل الحسابات (بما فيها حسابك). ما في رجعة بعد هالخطوة. متأكد إنك بدك تكمل؟')) return;
    const typed = prompt('اكتب كلمة "حذف" بالضبط للتأكيد النهائي:');
    if(typed !== 'حذف'){ showToast('ما تمت العملية — الكلمة المكتوبة مش مطابقة'); return; }
    state.exams = [];
    state.students = [];
    state.schedule = [];
    state.accounts = [];
    state.notifications = [];
    state.memorization = [];
    state.importBatches = [];
    await saveExams();
    await saveStudents();
    await saveSchedule();
    await saveAccounts();
    await saveNotifications();
    await saveMemorization();
    await saveImportBatches();
    state.currentUser = null;
    state.currentRole = null;
    state.currentTeacherLink = null;
    state.currentLocalId = null;
    state.authMode = 'register';
    showToast('تم إعادة ضبط البرنامج بالكامل');
    render();
  };

  document.getElementById('btn-logout-2').onclick = doLogout;
}

/* ---------------- utils ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

/* App startup:
   - Firebase Auth mode: wait for Firebase to report whether a session
     is already persisted (auto-login across reloads) before rendering,
     and re-check the user's Firestore profile (role/disabled) every
     time auth state changes.
   - Legacy mode: no session to restore, just load data and render. */
if (firebaseAuth){
  let firstAuthCheck = true;
  let firstCheckDone = false;

  // Failsafe: on a slow/flaky connection, Firebase's initial handshake
  // (and the Firestore profile lookup below) can hang far longer than a
  // user will wait. If nothing has resolved within 6 seconds, stop
  // waiting and show the login screen anyway — onAuthStateChanged keeps
  // listening in the background and will still update the view later
  // if/when the connection catches up.
  const finishFirstCheck = async ()=>{
    if (firstCheckDone) return;
    firstCheckDone = true;
    firstAuthCheck = false;
    await loadAppData();
  };

  // If the device has no internet right at startup, don't wait on
  // Firebase's own session check at all — restore straight from our
  // own local cache of the last successful login on this device.
  // Firebase's offline behavior for a brand-new page load isn't fast
  // or reliable enough to depend on here; this sidesteps it entirely,
  // and is what makes "log in once, then always land on your own page
  // even with zero connectivity afterward" actually work.
  let restoredFromOfflineCache = false;
  function tryRestoreOfflineSession(){
    if (firstCheckDone || navigator.onLine) return false;
    try{
      const uid = localStorage.getItem('last_session_uid');
      if(!uid) return false;
      const cached = localStorage.getItem('cached_profile_' + uid);
      if(!cached) return false;
      const profile = JSON.parse(cached);
      state.currentUser = profile.username;
      state.currentRole = profile.role;
      state.currentTeacherLink = profile.teacherLink;
      state.currentUid = uid;
      restoredFromOfflineCache = true;
      finishFirstCheck();
      return true;
    }catch(e){ return false; }
  }

  if (!tryRestoreOfflineSession()){
    setTimeout(()=>{ finishFirstCheck(); }, 6000);
  }

  firebaseAuth.onAuthStateChanged(async (user)=>{
    if (user){
      try{
        const doc = await withTimeout(firestoreDb.collection('users').doc(user.uid).get(), 5000);
        if (doc.exists && !doc.data().disabled){
          state.currentUser = doc.data().username;
          state.currentRole = doc.data().role || 'examiner';
          state.currentTeacherLink = doc.data().teacherLink || null;
          state.currentUid = user.uid;
          try{
            localStorage.setItem('cached_profile_' + user.uid, JSON.stringify({
              username: state.currentUser, role: state.currentRole, teacherLink: state.currentTeacherLink,
            }));
            localStorage.setItem('last_session_uid', user.uid);
          }catch(e){}
        } else {
          await firebaseAuth.signOut();
          state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
          try{ localStorage.removeItem('last_session_uid'); }catch(e){}
        }
      }catch(e){
        console.warn('تعذّر تحميل بيانات الحساب من الخادم — استخدام آخر نسخة محفوظة محلياً', e);
        // Fully offline with no warmed-up Firestore cache yet: restore
        // the session from our own localStorage snapshot of this same
        // profile, saved the last time the read above succeeded. This
        // is what lets someone who logged in once (while online) keep
        // landing straight on their own page every time they reopen the
        // app with no internet at all, instead of a stuck loading screen.
        try{
          const cached = localStorage.getItem('cached_profile_' + user.uid);
          if(cached){
            const profile = JSON.parse(cached);
            state.currentUser = profile.username;
            state.currentRole = profile.role;
            state.currentTeacherLink = profile.teacherLink;
            state.currentUid = user.uid;
          }
        }catch(e2){}
      }
      restoredFromOfflineCache = false;
    } else if (restoredFromOfflineCache && !navigator.onLine){
      // Firebase is reporting no session, but we're still offline and
      // already showing a session we restored from our own cache above
      // — Firebase's own offline determination right after a cold page
      // load isn't reliable enough to act on here, so keep what we've
      // got instead of bouncing the person back to the login screen.
    } else {
      state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
      try{ localStorage.removeItem('last_session_uid'); }catch(e){}
    }
    if (!firstCheckDone){
      await finishFirstCheck();
    } else {
      render();
    }
  });
} else {
  loadAppData();
}

/* Connectivity feedback: lets the examiner know their results are
   still safe (saved locally) even with no internet, and confirms when
   everything has synced back up automatically. */
window.addEventListener('offline', ()=>{
  showToast('غير متصل بالإنترنت — النتائج بتنحفظ عندك وبترفع تلقائياً لما يرجع الاتصال');
});
window.addEventListener('online', ()=>{
  showToast('رجع الاتصال بالإنترنت — جاري رفع البيانات المحفوظة');
  flushPendingSync();
  updateAppBadge();
});

/* App icon badge (installed PWA only, on browsers that support the
   Badging API): shows the number of not-yet-synced items on the app
   icon itself when there's anything pending (most urgent signal), or
   otherwise today's remaining appointment count — so someone can tell
   at a glance, without even opening the app, whether data needs
   attention or how many students are booked today. Falls back to
   doing nothing where the API isn't available (iOS Safari, etc). */
function updateAppBadge(){
  if(!('setAppBadge' in navigator)) return;
  try{
    const pending = getPendingSyncKeys().length;
    if(pending > 0){
      navigator.setAppBadge(pending).catch(()=>{});
      return;
    }
    const todayStr = todayStamp();
    const todayCount = state.schedule ? state.schedule.filter(s => !s.done && s.date === todayStr).length : 0;
    if(todayCount > 0) navigator.setAppBadge(todayCount).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){}
}

/* Keep the sync-status badge in the topbar live (pending count changes
   asynchronously as writes/flushes resolve, with nothing else in the
   UI necessarily triggering a re-render at that moment). */
updateAppBadge();
setInterval(()=>{
  const badge = document.getElementById('sync-status-badge');
  if(badge && state.currentUser) badge.outerHTML = syncStatusBadge();
  updateAppBadge();
}, 4000);

/* Register the service worker so the app shell (this page's HTML/CSS/JS,
   fonts, and icons) loads instantly even with zero connectivity — the
   actual data (exams/students/schedule/accounts) is handled separately
   by Firestore's own offline persistence above. Must be served over
   https:// (or from localhost) — browsers block service workers on
   file:// and plain http://, so this silently does nothing in those
   cases rather than breaking the app. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .catch(e => console.warn('تعذّر تسجيل service worker', e));
  });
}
