<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>اختبارات حفظ القرآن الكريم</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4332">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اختبارات القرآن">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg: #F7F1E4;
  --paper: #FFFFFF;
  --ink: #26231C;
  --ink-soft: #6B6355;
  --green: #1B4332;
  --green-dark: #10281F;
  --green-soft: #E7EEE8;
  --gold: #C08A28;
  --gold-soft: #F4E6C4;
  --red: #A23E36;
  --red-soft: #F7E4E1;
  --amber: #B07A1E;
  --amber-soft: #F6ECD6;
  --line: #E4DBC6;
  --radius: 14px;
  --shadow: 0 6px 20px rgba(27,67,50,0.09);
}
html[data-theme="dark"]{
  --bg: #14231C;
  --paper: #1B2E24;
  --ink: #EDE7D6;
  --ink-soft: #A9A28D;
  --green: #4E9C77;
  --green-dark: #0B1712;
  --green-soft: #223A2E;
  --gold: #D9A94E;
  --gold-soft: #3A331E;
  --red: #E28277;
  --red-soft: #3A2320;
  --amber: #E0B45C;
  --amber-soft: #3A311E;
  --line: #33473C;
  --shadow: 0 6px 20px rgba(0,0,0,0.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.display{ font-family:'Amiri', serif; }

/* Decorative star corner */
.star-corner{
  position:fixed; width:120px; height:120px; opacity:0.05; pointer-events:none; z-index:0;
}
.star-corner svg{ width:100%; height:100%; fill: var(--green); }
.star-corner.tl{ top:-20px; right:-20px; transform:rotate(10deg);}
.star-corner.bl{ bottom:-20px; left:-20px; transform:rotate(45deg);}

#app{ position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

/* ---------- Loading ---------- */
.loading-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
.spinner{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} }

/* ---------- Auth ---------- */
.auth-wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; gap:22px; }
.brand{ text-align:center; }
.brand-mark{ width:130px; height:auto; margin:0 auto 8px; }
.brand-mark svg, .brand-mark img{ width:100%; height:auto; display:block; }
.brand-name{ font-family:'Amiri', serif; font-size:30px; color:var(--green); font-weight:700; line-height:1.3; }
.brand-badge{
  display:inline-block; margin-top:8px; padding:6px 18px; background:var(--green);
  color:#fff; border-radius:20px; font-size:12.5px; font-weight:700; font-family:'Tajawal';
}
.brand-title-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px; }
.brand-title-row svg{ width:20px; height:20px; fill:var(--gold); flex-shrink:0; }
.brand h1{ font-family:'Amiri', serif; font-size:24px; color:var(--gold); font-weight:700; }
.brand-sub-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:8px; }
.brand-sub-row .ln{ height:1px; width:26px; background:var(--gold); opacity:0.6; }
.brand p{ color:var(--green); font-size:13.5px; font-weight:700; }

.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px 22px; width:100%; }
.field{ margin-bottom:16px; }
.field-label-row{ display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-bottom:8px; }
.field label{ font-size:14.5px; color:var(--ink); margin-bottom:0; font-weight:700; }
.field-icon{
  width:28px; height:28px; border-radius:50%; background:var(--green); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.field-icon svg{ width:15px; height:15px; }
.input-wrap{ position:relative; }
.input-wrap .in-icon{
  position:absolute; top:50%; left:14px; transform:translateY(-50%);
  color:var(--ink-soft); pointer-events:none; display:flex;
}
.input-wrap .in-icon svg{ width:17px; height:17px; }
.input-wrap .toggle-eye{
  position:absolute; top:50%; right:14px; transform:translateY(-50%);
  color:var(--ink-soft); background:none; border:none; cursor:pointer; display:flex; padding:0;
}
.input-wrap .toggle-eye svg{ width:18px; height:18px; }
.field input, .field select{
  width:100%; padding:12px 44px 12px 40px; border:1.5px solid var(--line); border-radius:10px;
  font-family:'Tajawal'; font-size:14.5px; background:#FCFAF3; color:var(--ink);
  transition: border-color .15s;
}
.field input:focus, .field select:focus{ outline:none; border-color:var(--green); background:#fff; }
.field input.error{ border-color:var(--red); }
.options-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.forgot-link{ color:var(--green); font-size:13px; font-weight:700; text-decoration:underline; background:none; border:none; cursor:pointer; font-family:'Tajawal'; }
.remember-row{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink); font-weight:500; }
.remember-row input{ width:17px; height:17px; accent-color:var(--green); cursor:pointer; }
.btn-primary svg{ width:17px; height:17px; }
.card-footer-divider{ display:flex; align-items:center; justify-content:center; gap:10px; margin:18px 0 10px; }
.card-footer-divider .ln{ height:1px; flex:1; max-width:70px; background:var(--line); }
.card-footer-divider svg{ width:18px; height:18px; fill:var(--gold); }
.card-footer-text{ text-align:center; font-size:12.5px; color:var(--green); font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; }
.card-footer-text svg{ width:13px; height:13px; fill:var(--gold); }

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:13px 16px; border:none; border-radius:10px;
  font-family:'Tajawal'; font-weight:700; font-size:15px; cursor:pointer;
  transition: transform .1s, opacity .15s;
}
.btn:active{ transform:scale(0.98); }
.btn-primary{ background:var(--green); color:#fff; }
.btn-primary:hover{ background:var(--green-dark); }
.btn-ghost{ background:transparent; color:var(--green); border:1.5px solid var(--green); }
.btn-danger{ background:var(--red-soft); color:var(--red); }
.link-btn{ background:none; border:none; color:var(--green); font-family:'Tajawal'; font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:underline; }
.hint{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:4px; }
.error-msg{ color:var(--red); font-size:13px; margin-top:8px; text-align:center; }

/* ---------- Header / Nav ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; background:var(--green); color:#fff;
}
.topbar .who{ font-size:12.5px; opacity:0.85; }
.topbar h2{ font-family:'Amiri'; font-size:19px; }
.topbar .logout{ background:rgba(255,255,255,0.15); border:none; color:#fff; padding:7px 12px; border-radius:8px; font-size:12.5px; font-family:'Tajawal'; cursor:pointer; }

.content{ flex:1; padding:18px; padding-bottom:90px; overflow-y:auto; }

.tabbar{
  position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
  display:flex; background:var(--paper); border-top:1px solid var(--line);
  box-shadow: 0 -4px 16px rgba(0,0,0,0.05); z-index:10;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:11px 4px 9px; background:none; border:none; cursor:pointer; color:var(--ink-soft);
  font-family:'Tajawal'; font-size:11.5px; font-weight:700;
}
.tab-btn svg{ width:21px; height:21px; }
.tab-btn.active{ color:var(--green); }
.tab-btn.tab-locked{ opacity:.4; }

/* ---------- Section titles ---------- */
.section-title{ font-family:'Amiri'; font-size:21px; color:var(--green); margin-bottom:16px; }

/* ---------- Test view ---------- */
.score-panel{
  background:var(--green); border-radius:var(--radius); padding:22px; text-align:center; color:#fff; margin-bottom:18px;
  position:relative; overflow:hidden;
}
.score-panel .ring-deco{ position:absolute; inset:0; opacity:0.08; }
.score-num{ font-family:'Amiri'; font-size:56px; font-weight:700; position:relative; }
.score-label{ font-size:12.5px; opacity:0.85; position:relative; }

.deduct-row{ display:flex; gap:9px; margin-bottom:16px; }
.deduct-btn{
  flex:1; border:none; border-radius:12px; padding:14px 6px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px; font-family:'Tajawal';
  transition: transform .1s;
}
.deduct-btn:active{ transform:scale(0.95); }
.deduct-btn .val{ font-weight:900; font-size:16px; }
.deduct-btn .lbl{ font-size:12px; font-weight:700; }
.deduct-btn .cnt{ font-size:11px; opacity:0.75; min-height:14px; }
.deduct-btn.lahn{ background:var(--red-soft); color:var(--red); }
.deduct-btn.khataa{ background:var(--amber-soft); color:var(--amber); }
.deduct-btn.tanbih{ background:var(--gold-soft); color:var(--gold); }

.undo-row{ text-align:center; margin-bottom:16px; }

/* ---------- History ---------- */
.stat-row{ display:flex; gap:10px; margin-bottom:16px; }
.stat-card{ flex:1; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
.stat-card .num{ font-family:'Amiri'; font-size:26px; color:var(--green); font-weight:700; }
.stat-card .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

.highlight-card{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
.highlight-card.best{ border-color:var(--gold); background:#FFFBF0; }
.hc-icon{ width:44px; height:44px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.highlight-card.best .hc-icon{ background:var(--gold); }
.hc-icon svg{ width:22px; height:22px; }
.hc-body{ flex:1; min-width:0; }
.hc-lbl{ font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
.hc-val{ font-size:17px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hc-sub{ font-size:12px; color:var(--green); font-weight:600; margin-top:2px; }

.scoring-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.scoring-head .link-btn{ font-size:13px; }
.scoring-meta{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }

.student-card{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; }
.student-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.student-name{ font-size:15.5px; font-weight:700; color:var(--ink); }
.student-exam-count{ font-size:12px; color:var(--ink-soft); }
.progress-row{ display:flex; align-items:center; gap:10px; }
.progress-bar{ flex:1; height:8px; background:#EFE9D8; border-radius:5px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--green)); border-radius:5px; }
.progress-label{ font-size:11.5px; color:var(--green); font-weight:700; white-space:nowrap; }

.juz-progress-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:8px; }
.juz-progress-item{
  font-size:12px; background:#FCFAF3; border:1px solid var(--line); border-radius:8px;
  padding:8px 2px; text-align:center; cursor:pointer; color:var(--ink-soft); font-weight:600;
}
.juz-progress-item input{ display:none; }
.juz-progress-item.done{ background:var(--green); border-color:var(--green); color:#fff; }

.delete-student-btn{
  width:100%; background:none; border:1px solid var(--red); color:var(--red); border-radius:10px;
  padding:11px; font-family:'Tajawal'; font-weight:700; font-size:13px; cursor:pointer; margin-top:18px;
}

.search-box{ position:relative; margin-bottom:14px; }
.search-box input{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; font-family:'Tajawal'; font-size:14.5px; background:var(--paper); }

.record{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
.record-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.record-top .name{ font-weight:700; font-size:15.5px; }
.record-score{ font-family:'Amiri'; font-weight:700; font-size:20px; padding:2px 12px; border-radius:8px; }
.score-high{ background:var(--green-soft); color:var(--green); }
.score-mid{ background:var(--amber-soft); color:var(--amber); }
.score-low{ background:var(--red-soft); color:var(--red); }
.record-alert{ border-color:var(--red); background:var(--red-soft); }
.record-alert .name{ color:var(--red); }
.record-alert .record-meta{ color:var(--red); }
.record-alert .record-meta b{ color:var(--red); }
.record-meta{ font-size:12.5px; color:var(--ink-soft); line-height:1.9; }
.record-meta b{ color:var(--ink); font-weight:600; }
.record-actions{ display:flex; gap:10px; margin-top:10px; }
.record-del{ background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; font-family:'Tajawal'; font-weight:700; }
.record-share{
  background:none; border:none; color:var(--green); font-size:12px; cursor:pointer;
  font-family:'Tajawal'; font-weight:700; display:flex; align-items:center; gap:4px;
}
.record-share svg{ width:14px; height:14px; }
.record-share:disabled{ opacity:0.5; cursor:default; }
.empty-state{ text-align:center; color:var(--ink-soft); padding:40px 20px; font-size:14px; }
.history-toolbar{ display:flex; gap:10px; margin-bottom:16px; }
.btn-report{
  flex:1; background:var(--gold); color:#fff; border:none; border-radius:10px;
  padding:11px 14px; font-family:'Tajawal'; font-weight:700; font-size:13.5px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-report:disabled{ opacity:0.6; cursor:default; }
.btn-report svg{ width:16px; height:16px; }

.filters-panel{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; }
.filters-row{ display:flex; gap:8px; margin-bottom:8px; }
.filters-row:last-child{ margin-bottom:0; }
.filters-row select, .filters-row input{
  flex:1; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px;
  font-family:'Tajawal'; font-size:12.5px; background:var(--bg); color:var(--ink); min-width:0;
}
.filters-clear{ background:none; border:none; color:var(--red); font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Tajawal'; }

.btn-load-more{
  width:100%; background:var(--paper); border:1.5px dashed var(--line); color:var(--green);
  border-radius:10px; padding:12px; font-family:'Tajawal'; font-weight:700; font-size:13px;
  cursor:pointer; margin-top:4px; margin-bottom:10px;
}

.backup-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.backup-row:last-child{ border-bottom:none; }
.backup-row button{
  background:none; border:1px solid var(--green); color:var(--green); border-radius:8px;
  padding:4px 12px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:'Tajawal';
}
.data-btn-row{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.data-btn-row button{
  flex:1; min-width:0; background:var(--green); color:#fff; border:none; border-radius:9px;
  padding:10px 8px; font-family:'Tajawal'; font-weight:700; font-size:12.5px; cursor:pointer;
}
.data-btn-row button.ghost{ background:none; border:1.5px solid var(--green); color:var(--green); }
.theme-toggle-row{ display:flex; align-items:center; justify-content:space-between; }
.whatsapp-btn{
  width:100%; background:#25D366; color:#fff; border:none; border-radius:9px; padding:10px;
  font-family:'Tajawal'; font-weight:700; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:14px;
}
.whatsapp-btn svg{ width:16px; height:16px; }

.schedule-row{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
.sch-name{ font-size:13.5px; font-weight:700; color:var(--ink); }
.sch-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.sch-badge{ display:inline-block; font-size:10px; font-weight:700; border-radius:10px; padding:1px 8px; margin-inline-start:6px; }
.sch-badge.today{ background:var(--gold-soft); color:var(--amber); }
.sch-badge.overdue{ background:var(--red-soft); color:var(--red); }
.sch-actions{ display:flex; gap:6px; flex-shrink:0; }
.sch-actions button{
  background:none; border:1px solid var(--line); border-radius:7px; padding:5px 10px;
  font-size:11px; font-weight:700; cursor:pointer; font-family:'Tajawal'; color:var(--ink-soft);
}
.sch-actions .sch-done{ color:var(--green); border-color:var(--green); }
.sch-actions .sch-del{ color:var(--red); border-color:var(--red); }
.theme-switch{
  width:46px; height:26px; border-radius:14px; background:var(--line); border:none;
  position:relative; cursor:pointer; flex-shrink:0;
}
.theme-switch::after{
  content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:var(--paper); transition:transform .15s;
}
html[data-theme="dark"] .theme-switch{ background:var(--green); }
html[data-theme="dark"] .theme-switch::after{ transform:translateX(-20px); }

/* ---------- Settings ---------- */
.settings-block{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
.settings-block h3{ font-size:14.5px; margin-bottom:12px; color:var(--green); }
.acct-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
.acct-row:last-child{ border-bottom:none; }
.acct-row button{ background:none; border:none; color:var(--red); font-size:12.5px; cursor:pointer; font-family:'Tajawal'; margin-inline-start:8px; }
.acct-row .toggle-acct, .acct-row .role-acct{ color:var(--green); }
.acct-row-expanded{ display:block; padding:10px 0; }
.acct-row-expanded .acct-row-top{ display:flex; justify-content:space-between; align-items:center; }
.acct-email{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.acct-manage-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.acct-manage-row select{ font-size:12px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font-family:'Tajawal'; }
.acct-manage-row button{ font-size:12px; padding:5px 10px; border:1px solid var(--line); border-radius:8px; margin-inline-start:0; }
.role-badge{ display:inline-block; background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:1px 9px; font-size:11px; color:var(--ink-soft); margin-inline-start:6px; }
.role-badge-off{ color:var(--red); border-color:var(--red); }

.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:var(--green); color:#fff; padding:11px 22px; border-radius:30px; font-size:13.5px;
  box-shadow:var(--shadow); z-index:50; opacity:0; transition:opacity .25s, transform .25s;
  pointer-events:none; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<div class="star-corner tl"><svg viewBox="0 0 100 100"><path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z"/></svg></div>

/* Dark mode: applied immediately (before first render) so there's no
   flash of the light theme, and remembered per-device via localStorage. */
(function initTheme(){
  try{
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
})();
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){ document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('theme','light'); }catch(e){} }
  else { document.documentElement.setAttribute('data-theme','dark'); try{ localStorage.setItem('theme','dark'); }catch(e){} }
  render();
}

/* ================= إعداد قاعدة البيانات (Firebase) =================
   لتشغيل التطبيق من أي جهاز/متصفح خارج Claude ويشتغل نفس الحساب على
   كل الأجهزة، لازم تربطه بمشروع Firebase مجاني خاص فيك. بدون تعبئة
   البيانات تحت، التطبيق برجع يشتغل محلياً (على كل جهاز لحاله) فقط.

   خطوات الإعداد (٥ دقايق ومجاني بالكامل):
   1) افتح https://console.firebase.google.com وسجّل دخول بحساب Google.
   2) دوس "Add project" وأنشئ مشروع جديد (أي اسم).
   3) بصفحة المشروع دوس أيقونة الويب </> لإضافة تطبيق ويب (Web app)،
      سمّيه أي اسم، ومش لازم تفعّل Firebase Hosting.
   4) رح يطلعلك كائن باسم firebaseConfig فيه apiKey و projectId... الخ.
      انسخ القيم وحطها مكان FIREBASE_CONFIG تحت.
   5) من القائمة الجانبية: Build > Firestore Database > Create database،
      اختر "Start in test mode" (بعدين استبدل القواعد بالقواعد
      المقترحة تحت — هاد ضروري، مش اختياري، لأنه بدونه أي حد عنده
      رابط المشروع بيقدر يوصل للبيانات).
   6) من نفس القائمة الجانبية: Build > Authentication > Get started،
      وفعّل مزود "Email/Password" (Sign-in method > Email/Password).
      هاد هو اللي بيحمي كلمات السر فعلياً (تسجيل الدخول صار يمر عبر
      Firebase نفسها، مش عبر مقارنة نص عادي بقاعدة البيانات).
   7) بعد هيك، أي جهاز يفتح هالملف ومتصل بالإنترنت رح يقدر يسجّل
      دخول بنفس الحساب ويشوف نفس سجل الاختبارات.

   وضع الأوفلاين: التطبيق شغّال حتى بدون إنترنت — لو المختبِر اختبر
   طالب وهو مقطوع عن النت، النتيجة بتنحفظ عنده فوراً (محلياً على
   جهازه)، وأول ما يرجع الاتصال (حتى لو بعد ساعات) بترفع تلقائياً
   لقاعدة البيانات وتظهر عند الكل، من غير أي خطوة إضافية منه.
   بس لازم يكون الجهاز فتح التطبيق مرة واحدة عالأقل وهو متصل بالنت
   (حتى تنزّل نسخة من البيانات على الجهاز)، وسجّل دخول فيها مرة
   وحدة على الأقل؛ أول فتح للتطبيق نفسه لازم يكون فيه إنترنت.

   الأدوار: أول حساب ينسجل بالتطبيق بيصير تلقائياً "admin" (مدير)،
   وأي حساب بعده بيختار وقت التسجيل إذا كان "examiner" (مختبِر يدير
   البرنامج) أو "teacher" (محفّظ — بيقدر يحجز مواعيد اختبار لطلابه
   بس ويشوف نتائجهم، ما بيقدر يدخل يبدأ اختبار أو يشوف باقي الطلاب).
   حساب المحفّظ لازم يترابط باسمه من قائمة TEACHERS بالكود عشان
   يظهرله بس سجلات طلابه. المدير بس هو اللي بيقدر يعطّل/يفعّل
   حسابات، يبدّل دور أي حساب (ويربطه بمحفّظ إذا صار "محفّظ")، أو
   يحذف كل سجلات الاختبارات من الإعدادات — هاي الصلاحيات شغّالة سواء
   كان التطبيق متصل بـ Firebase أو شغّال محلياً بدونه.

   قواعد أمان مقترحة لـ Firestore (من تبويب Rules) — لازم تستبدل
   القواعد الافتراضية بهاي، مش بس تعتمد على "test mode":
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         function isSignedIn() { return request.auth != null; }
         function myRole() {
           return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role;
         }
         function isAdmin() { return isSignedIn() && myRole() == 'admin'; }

         match /users/{userId} {
           allow read: if isSignedIn();
           allow create: if isSignedIn() && request.auth.uid == userId;
           allow update: if isAdmin() || (isSignedIn() && request.auth.uid == userId
                          && request.resource.data.role == resource.data.role);
           allow delete: if isAdmin();
         }
         match /quran_app/{docId} {
           allow read, write: if isSignedIn();
         }
       }
     }
   ملاحظة مهمة: كلمات السر نفسها لا تنحفظ بـ Firestore أبداً (يديرها
   Firebase Authentication بشكل مشفّر بالكامل). Firestore بيخزّن بس
   اسم المستخدم والدور (admin/examiner) وحالة التفعيل.

   قيد معروف: حذف حساب مستخدم من Firebase Authentication نفسه (مش
   بس تعطيله) يتطلب صلاحيات إدارية من السيرفر (Admin SDK/Cloud
   Functions) ومش متاح من كود يشتغل بالمتصفح مباشرة لأسباب أمان.
   لهيك زر "حذف حساب" بالإعدادات صار "تعطيل/تفعيل حساب" — الحساب
   المعطّل ما بيقدر يسجّل دخول، بس سجله بـ Authentication بضل موجود.
   لحذفه نهائياً لازم تروح لـ Firebase Console > Authentication
   وتحذفه يدوياً من هناك.
====================================================================== */

  apiKey: "AIzaSyCFbL3yFCWmIbku4qp_rJeq-psRE1xxdI4",
  authDomain: "shqurantest.firebaseapp.com",
  projectId: "shqurantest",
  storageBucket: "shqurantest.firebasestorage.app",
  messagingSenderId: "1022797419545",
  appId: "1:1022797419545:web:df7121f5fb5c24de9bc688"
};

let firestoreDb = null;
let firebaseAuth = null;
try{
  if (FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('ضع-') && window.firebase) {
    firebase.initializeApp(FIREBASE_CONFIG);
    firestoreDb = firebase.firestore();
    firebaseAuth = firebase.auth();
    // Keep the login session remembered on this device/browser across
    // closing and reopening the app — so once someone logs in on their
    // phone, opening the app again lands them straight on their own
    // page instead of the login screen, with no network needed.
    firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(e => console.warn('تعذّر تفعيل تذكّر الجلسة على هذا الجهاز', e));
    // Offline persistence: caches data in IndexedDB so the app keeps
    // working (reading + saving) with no internet connection at all,
    // then syncs automatically with the server as soon as connectivity
    // returns — no action needed from the user.
    firestoreDb.enablePersistence({ synchronizeTabs: true })
      .catch(e => console.warn('تعذّر تفعيل وضع الأوفلاين الكامل (المتصفح لا يدعمه أو فيه أكثر من تبويب مفتوح)', e));
  }
}catch(e){ console.error('تعذّر الاتصال بـ Firebase', e); firestoreDb = null; firebaseAuth = null; }

/* Turns a (possibly Arabic) username into a deterministic, valid-looking
   email address so it can be used with Firebase Authentication, which
   requires an email format. Any character outside [a-z0-9._-] is
   replaced by its Unicode code point, so the same username always maps
   to the same fake email, and two different usernames essentially never
   collide. The real (original-script) username is stored separately in
   the user's Firestore profile and is what's shown in the UI. */
function usernameToEmail(username){
  const clean = String(username).trim().toLowerCase();
  let out = '';
  for (const ch of clean){
    out += /[a-z0-9._-]/.test(ch) ? ch : ('u' + ch.codePointAt(0).toString(16));
  }
  if(!out) out = 'user';
  return out + '@quran-app.local';
}

    'auth/wrong-password': 'اسم المستخدم أو كلمة المرور غير صحيحة',
    'auth/user-not-found': 'اسم المستخدم أو كلمة المرور غير صحيحة',
    'auth/invalid-credential': 'اسم المستخدم أو كلمة المرور غير صحيحة',
    'auth/too-many-requests': 'محاولات كثيرة متتالية — حاول لاحقاً',

  };
  return map[code] || 'صار في خطأ غير متوقع، حاول مرة ثانية';
}

/* Storage adapter, in priority order:
   1) Firestore (real shared database — works from any device, anywhere).
      Writes are fire-and-forget: Firestore queues them locally when
      offline and pushes them to the server automatically once the
      connection returns, so saving never blocks or fails just because
      there's no internet at that moment.
   2) window.storage (shared) — works when running as a Claude artifact
   3) localStorage — always kept as an extra local backup copy, and used
      directly if Firestore isn't configured/available at all. */
const storageAdapter = {
  async get(key){
    if (firestoreDb) {
      try{
        const doc = await firestoreDb.collection('quran_app').doc(key).get();
        if(doc.exists){
          try{ localStorage.setItem(key, doc.data().value); }catch(e){}
          return { value: doc.data().value };
        }
        return null;
      }catch(e){
        console.warn('تعذّر الوصول لـ Firestore (غالباً بسبب انقطاع الإنترنت)، استخدام آخر نسخة محفوظة محلياً', e);
      }
    }
    if (window.storage && typeof window.storage.get === 'function') {
      return await window.storage.get(key, true);
    }
    const value = localStorage.getItem(key);
    return value === null ? null : { value };
  },
  async set(key, value){
    // Always keep an immediate local backup, regardless of connectivity.
    try{ localStorage.setItem(key, value); }catch(e){}
    if (firestoreDb) {
      // Do NOT await this: while offline, a Firestore write's promise
      // stays pending (it doesn't reject) until the connection returns,
      // which would freeze the app's "saving..." step indefinitely.
      // Firestore has already queued the write locally at this point.
      firestoreDb.collection('quran_app').doc(key).set({ value })
        .catch(e => console.warn('لم يتم رفع البيانات بعد لقاعدة البيانات — راح تترفع تلقائياً لما يتوفر إنترنت', e));
      return { ok: true };
    }
    if (window.storage && typeof window.storage.set === 'function') {
      return await window.storage.set(key, value, true);
    }
    return { ok: true };
  }
};

let state = {
  loading: true,
  accounts: [], // {uid, username, email, role, teacherLink, disabled} — or legacy {username, email, password, role, teacherLink, disabled} when Firebase Auth isn't configured
  currentUser: null,
  currentRole: null, // 'admin' | 'examiner' | 'teacher' | null (legacy mode before login)
  currentTeacherLink: null, // for role==='teacher': which name from TEACHERS this account represents
  currentUid: null,
  currentLocalId: null, // legacy mode: the logged-in account's stable localId (see loadAppData) — used instead of username, which is not guaranteed unique
  view: 'test', // test | history | stats | students | schedule | settings
  exams: [],
  students: [],
  schedule: [], // upcoming exam appointments: {id, studentName, teacherName, date, note, done}
  notifications: [], // {id, message, teacherName (null = all teachers), from, createdAt, readBy: [usernames]}
  authMode: 'login', // login | register
};

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

/* Loads exam/student data (always) plus the accounts list:
   - Firebase Auth mode: state.accounts comes from the `users` Firestore
     collection (username/role/disabled — never passwords).
   - Legacy mode (no Firebase configured): state.accounts comes from the
     old single localStorage/window.storage document, same as before. */
async function loadAppData(){
  try{
    const ex = await storageAdapter.get(STORAGE_EXAMS);
    state.exams = ex ? JSON.parse(ex.value) : [];
  }catch(e){ state.exams = []; }
  try{
    const st = await storageAdapter.get(STORAGE_STUDENTS);
    state.students = st ? JSON.parse(st.value) : [];
  }catch(e){ state.students = []; }
  try{
    const sc = await storageAdapter.get(STORAGE_SCHEDULE);
    state.schedule = sc ? JSON.parse(sc.value) : [];
  }catch(e){ state.schedule = []; }
  try{
    const nt = await storageAdapter.get(STORAGE_NOTIFICATIONS);
    state.notifications = nt ? JSON.parse(nt.value) : [];
  }catch(e){ state.notifications = []; }

  if (firebaseAuth && firestoreDb){
    await loadAccountsFromFirestore();
  } else {
    try{
      const acc = await storageAdapter.get(STORAGE_ACCOUNTS);
      state.accounts = acc ? JSON.parse(acc.value) : [];
    }catch(e){ state.accounts = []; }
    // Older data may have accounts with no stable identifier, or even
    // duplicate usernames (e.g. from two people registering with very
    // similar details) — username-based lookups can't tell those apart,
    // which breaks role/email management for the affected accounts. Give
    // every legacy account a permanent unique localId once, and persist
    // it so this only needs to happen a single time per device.
    let neededFix = false;
    state.accounts.forEach((a, i)=>{
      if(!a.localId){ a.localId = 'la_' + Date.now() + '_' + i; neededFix = true; }
    });
    // Some very old accounts predate the role field and were never
    // assigned one at all — at login they silently default to
    // "examiner" (see the login handler below), even if this was meant
    // to be the original admin account, which can lock everyone out of
    // admin-only actions. If literally no account is marked admin,
    // treat the oldest account (first in the stored list) as the
    // intended admin and fix it in place, once.
    if(state.accounts.length > 0 && !state.accounts.some(a=>a.role==='admin')){
      state.accounts[0].role = 'admin';
      neededFix = true;
    }
    if(neededFix) await saveAccounts();
  }

  state.loading = false;
  render();
  maybeShowScheduleReminder();
}

let scheduleReminderShown = false;
function maybeShowScheduleReminder(){
  if(scheduleReminderShown) return;
  const todayStr = todayStamp();
  const dueToday = state.schedule.filter(s => !s.done && s.date===todayStr).length;
  const overdue = state.schedule.filter(s => !s.done && s.date<todayStr).length;
  if(dueToday>0 || overdue>0){
    scheduleReminderShown = true;
    setTimeout(()=> showToast(`📅 عندك ${dueToday} اختبار مجدول اليوم${overdue>0 ? ' و' + overdue + ' موعد متأخر' : ''}`), 900);
  }
}

let accountsLoadFailed = false; // true if a Firestore accounts read errored (e.g. blocked by security rules pre-login) — must NOT be treated as "zero accounts exist"

async function loadAccountsFromFirestore(){
  try{
    const snap = await firestoreDb.collection('users').get();
    state.accounts = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    accountsLoadFailed = false;
  }catch(e){
    console.warn('تعذّر تحميل قائمة الحسابات', e);
    accountsLoadFailed = true;
  }
}

/* Legacy-only: saves the whole accounts array back to the shared
   single-document store. Only used when Firebase Auth isn't configured
   (see FIREBASE_CONFIG setup instructions above). */
async function saveAccounts(){
  await storageAdapter.set(STORAGE_ACCOUNTS, JSON.stringify(state.accounts));
}
async function saveExams(){
  await storageAdapter.set(STORAGE_EXAMS, JSON.stringify(state.exams));
  maybeAutoBackup();
}
async function saveStudents(){
  await storageAdapter.set(STORAGE_STUDENTS, JSON.stringify(state.students));
  maybeAutoBackup();
}
async function saveSchedule(){
  await storageAdapter.set(STORAGE_SCHEDULE, JSON.stringify(state.schedule));
  maybeAutoBackup();
}
async function saveNotifications(){
  await storageAdapter.set(STORAGE_NOTIFICATIONS, JSON.stringify(state.notifications));
}

/* ---------------- DATA EXPORT / IMPORT / BACKUP ---------------- */
function todayStamp(){ return new Date().toISOString().slice(0,10); }

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportDataJSON(){
  const payload = { exportedAt: new Date().toISOString(), exams: state.exams, students: state.students, schedule: state.schedule };
  downloadBlob(JSON.stringify(payload, null, 2), `بيانات-${todayStamp()}.json`, 'application/json');
  showToast('تم تصدير البيانات (JSON)');
}

async function exportDataExcel(){
  if(typeof ExcelJS === 'undefined'){ showToast('تعذّر تحميل مكتبة إكسل — تحقق من الاتصال بالإنترنت وحاول ثانية'); return; }
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'مركز السيد هاشم لتعليم وتحفيظ القرآن الكريم';
    wb.created = new Date();

    const GREEN = 'FF1B4332', GOLD = 'FFC08A28', CREAM = 'FFF7F1E4', LINE = 'FFE4DBC6', RED = 'FFA23E36', GOLD_SOFT = 'FFF4E6C4';

    function styleHeaderRow(row){
      row.height = 26;
      row.eachCell(cell=>{
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 12 };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: GREEN } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = { bottom: { style: 'medium', color: { argb: GOLD } } };
      });
    }
    function bandRow(row, i){
      row.height = 20;
      const bandColor = i % 2 === 1 ? CREAM : 'FFFFFFFF';
      row.eachCell(cell=>{
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bandColor } };
        cell.border = { bottom: { style: 'thin', color: { argb: LINE } } };
      });
    }

    // ---- sheet 1: exams ----

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  }catch(e){
    console.error(e);
    showToast('تعذّر تصدير ملف الإكسل، حاول مرة ثانية');
  }
}

async function importDataFromFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || (!Array.isArray(data.exams) && !Array.isArray(data.students))){
      showToast('ملف غير صالح — لازم يكون ملف تصدير JSON من نفس البرنامج');
      return;
    }
    const importedExams = Array.isArray(data.exams) ? data.exams : [];
    const importedStudents = Array.isArray(data.students) ? data.students : [];

    let addedExams = 0;
    importedExams.forEach(e=>{
      if(e && e.id && !state.exams.some(x=>x.id===e.id)){ state.exams.push(e); addedExams++; }
    });

    let addedStudents = 0, mergedStudents = 0;
    importedStudents.forEach(s=>{
      if(!s || !s.name) return;
      const existing = state.students.find(x=>x.name.trim().toLowerCase()===s.name.trim().toLowerCase());
      if(existing){
        existing.juzProgress = [...new Set([...(existing.juzProgress||[]), ...(s.juzProgress||[])])];
        existing.phone = existing.phone || s.phone || '';
        existing.notes = existing.notes || s.notes || '';
        mergedStudents++;
      } else {
        state.students.push({
          id: s.id || ('st_' + Date.now() + Math.random().toString(36).slice(2,6)),
          name: s.name.trim(), phone: s.phone||'', notes: s.notes||'',
          juzProgress: s.juzProgress||[], createdAt: s.createdAt || new Date().toISOString(),
        });
        addedStudents++;
      }
    });

    state.exams.sort((a,b)=> new Date(b.date) - new Date(a.date));
    await saveExams();
    await saveStudents();
    showToast(`تم الاستيراد: ${addedExams} اختبار جديد، ${addedStudents} طالب جديد، ${mergedStudents} طالب محدَّث`);
    render();
  }catch(e){
    console.error(e);
    showToast('تعذّر قراءة الملف — تأكد إنه ملف JSON صحيح من نفس البرنامج');
  }
}

/* Once-per-day local snapshot (kept even if the shared database is
   unreachable), capped to the last 10 days, restorable from Settings. */
function maybeAutoBackup(){
  try{
    const todayKey = 'auto_backup_' + todayStamp();
    if(!localStorage.getItem(todayKey)){
      localStorage.setItem(todayKey, JSON.stringify({ exams: state.exams, students: state.students, schedule: state.schedule, savedAt: new Date().toISOString() }));
      const keys = Object.keys(localStorage).filter(k=>k.startsWith('auto_backup_')).sort();
      while(keys.length > 10){ localStorage.removeItem(keys.shift()); }
    }
  }catch(e){}
}
function listBackups(){
  try{ return Object.keys(localStorage).filter(k=>k.startsWith('auto_backup_')).sort().reverse(); }
  catch(e){ return []; }
}
async function restoreBackup(key){
  try{
    const data = JSON.parse(localStorage.getItem(key));
    if(!data) return;
    state.exams = data.exams || [];
    state.students = data.students || [];
    state.schedule = data.schedule || [];
    await saveExams();
    await saveStudents();
    await saveSchedule();
    showToast('تم استرجاع النسخة الاحتياطية');
    render();
  }catch(e){ showToast('تعذّر استرجاع النسخة الاحتياطية'); }
}

/* Manual, user-triggered backups — created on demand from Settings,
   and updatable in place (overwrite the same snapshot with the
   latest data) or deletable, independent of the once-per-day
   automatic snapshots above. */
function createManualBackup(label){
  try{
    const key = 'manual_backup_' + Date.now();
    const payload = {
      exams: state.exams, students: state.students, schedule: state.schedule,
      savedAt: new Date().toISOString(),
      label: (label && label.trim()) || ('نسخة بتاريخ ' + new Date().toLocaleString('ar-EG', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })),
    };
    localStorage.setItem(key, JSON.stringify(payload));
    return key;
  }catch(e){ return null; }
}
function listManualBackups(){
  try{
    return Object.keys(localStorage).filter(k=>k.startsWith('manual_backup_')).sort().reverse().map(key=>{
      let data = null;
      try{ data = JSON.parse(localStorage.getItem(key)); }catch(e){}
      return { key, label: (data && data.label) || key, savedAt: data && data.savedAt };
    });
  }catch(e){ return []; }
}
function updateManualBackup(key){
  try{
    let old = null;
    try{ old = JSON.parse(localStorage.getItem(key)); }catch(e){}
    const payload = {
      exams: state.exams, students: state.students, schedule: state.schedule,
      savedAt: new Date().toISOString(),
      label: (old && old.label) || 'نسخة محدّثة',
    };
    localStorage.setItem(key, JSON.stringify(payload));
    return true;
  }catch(e){ return false; }
}
function deleteManualBackup(key){
  try{ localStorage.removeItem(key); return true; }catch(e){ return false; }
}


/* Finds (or creates) a student profile by name, and — when the exam
   passed (score >= 80) — marks the tested juz as memorized in that
   student's cumulative progress checklist. Called right after an
   exam is saved. */
function upsertStudentFromExam(record){
  const key = record.studentName.trim();
  let student = state.students.find(s => s.name.trim().toLowerCase() === key.toLowerCase());
  if(!student){
    student = { id: 'st_' + Date.now(), name: key, phone: '', notes: '', juzProgress: [], createdAt: new Date().toISOString() };
    state.students.push(student);
  }
  if(!record.stoppedEarly && record.score >= 80){
    const nums = (String(record.juz).match(/\d+/g) || []).map(Number);
    nums.forEach(n=>{
      if(n>=1 && n<=30 && !student.juzProgress.includes(n)) student.juzProgress.push(n);
    });
  }
}

function attachAuthHandlers(){
  const goReg = document.getElementById('go-register');
  if(goReg) goReg.onclick = ()=>{ state.authMode='register'; render(); };
  const goLog = document.getElementById('go-login');
  if(goLog) goLog.onclick = ()=>{ state.authMode='login'; render(); };

  const btnLogin = document.getElementById('btn-login');
  if(btnLogin) btnLogin.onclick = async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const p = document.getElementById('login-pass').value;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if(!email || !p){ errEl.textContent='الرجاء إدخال البريد الإلكتروني وكلمة المرور'; return; }

    if (firebaseAuth){
      btnLogin.disabled = true;
      try{
        const cred = await firebaseAuth.signInWithEmailAndPassword(email, p);
        const doc = await firestoreDb.collection('users').doc(cred.user.uid).get();
        const data = doc.exists ? doc.data() : null;
        if(!data || data.disabled){
          await firebaseAuth.signOut();
          errEl.textContent = data && data.disabled ? 'هذا الحساب معطّل — تواصل مع المدير' : 'تعذّر إيجاد بيانات الحساب';
          return;
        }
        state.currentUser = data.username || email;
        state.currentRole = data.role || 'examiner';
        state.currentTeacherLink = data.teacherLink || null;
        state.currentUid = cred.user.uid;
        state.view = state.currentRole==='teacher' ? 'schedule' : 'test';
        render();
      }catch(e){
        errEl.textContent = mapAuthError(e);
      }finally{
        btnLogin.disabled = false;
      }
      return;
    }

    // Legacy fallback (no Firebase Auth configured — see setup notes above).
    const found = state.accounts.find(a=> (a.email||'').toLowerCase()===email.toLowerCase() && a.password===p);
    if(!found){ errEl.textContent='البريد الإلكتروني أو كلمة المرور غير صحيحة'; return; }
    if(found.disabled){ errEl.textContent='هذا الحساب معطّل — تواصل مع المدير'; return; }
    state.currentUser = found.username;
    state.currentRole = found.role || 'examiner';
    state.currentTeacherLink = found.teacherLink || null;
    state.currentLocalId = found.localId || null;
    state.view = state.currentRole==='teacher' ? 'schedule' : 'test';
    render();
  };

  // Allow pressing Enter in either login field to submit.
  const loginEmail = document.getElementById('login-email');
  const loginPass = document.getElementById('login-pass');
  [loginEmail, loginPass].forEach(el => {
    if(el) el.addEventListener('keydown', e => {
      if(e.key === 'Enter') btnLogin.click();
    });
  });

  // Remember-me: prefill last used email if previously saved.
  const rememberBox = document.getElementById('remember-me');
  if(loginEmail){
    const savedEmail = localStorage.getItem('remembered-email');
    if(savedEmail){ loginEmail.value = savedEmail; if(rememberBox) rememberBox.checked = true; }
  }
  if(btnLogin){
    const originalOnclick = btnLogin.onclick;
    btnLogin.onclick = ()=>{
      originalOnclick();
      if(rememberBox){
        if(rememberBox.checked) localStorage.setItem('remembered-email', loginEmail.value.trim());
        else localStorage.removeItem('remembered-email');
      }
    };
  }

  // Toggle password visibility.
  const toggleEye = document.getElementById('toggle-login-pass');
  if(toggleEye) toggleEye.onclick = ()=>{
    const isHidden = loginPass.type === 'password';
    loginPass.type = isHidden ? 'text' : 'password';
  };

  // Forgot password — sends a real reset email via Firebase Auth when
  // the app is connected to Firebase; otherwise explains that this
  // requires the Firebase setup described at the top of the code, and
  // that an admin can reset the password manually from Settings.
  const forgotBtn = document.getElementById('forgot-pass');
  if(forgotBtn) forgotBtn.onclick = async ()=>{
    const errEl = document.getElementById('auth-error');
    const emailVal = document.getElementById('login-email').value.trim();
    if(!firebaseAuth){
      showToast('استرجاع كلمة المرور عبر البريد يتطلب ربط التطبيق بـ Firebase — لحد هيك تواصل مع المدير ليعيد تعيينها لك من الإعدادات');
      return;
    }
    if(!emailVal){ if(errEl) errEl.textContent = 'اكتب بريدك الإلكتروني بالحقل فوق أولاً'; return; }
    forgotBtn.disabled = true;
    try{
      await firebaseAuth.sendPasswordResetEmail(emailVal);
      showToast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني');
    }catch(e){
      if(errEl) errEl.textContent = mapAuthError(e);
    }finally{
      forgotBtn.disabled = false;
    }
  };

  // On-device account recovery (legacy/local mode only) — see recoverForm().
  const goRecover = document.getElementById('go-recover');
  if(goRecover) goRecover.onclick = ()=>{ state.authMode='recover'; render(); };
  const goLoginFromRecover = document.getElementById('go-login-from-recover');
  if(goLoginFromRecover) goLoginFromRecover.onclick = ()=>{ state.authMode='login'; render(); };

  const recPass = document.getElementById('rec-pass');
  const toggleRecEye = document.getElementById('toggle-rec-pass');
  if(toggleRecEye && recPass) toggleRecEye.onclick = ()=>{
    const isHidden = recPass.type === 'password';
    recPass.type = isHidden ? 'text' : 'password';
  };

  const btnRecover = document.getElementById('btn-recover');
  if(btnRecover) btnRecover.onclick = async ()=>{
    const errEl = document.getElementById('auth-error');
    if(errEl) errEl.textContent = '';
    const localId = document.getElementById('rec-username').value;
    const email = document.getElementById('rec-email').value.trim();
    const newPass = recPass.value;
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      if(errEl) errEl.textContent = 'اكتب بريد إلكتروني صحيح'; return;
    }
    if(newPass && newPass.length < 4){
      if(errEl) errEl.textContent = 'كلمة المرور يجب ألا تقل عن 4 أحرف'; return;
    }
    if(state.accounts.some(a=>(a.localId||a.username)!==localId && (a.email||'').toLowerCase()===email.toLowerCase())){
      if(errEl) errEl.textContent = 'هذا البريد الإلكتروني مستخدم من حساب تاني'; return;
    }
    const acc = state.accounts.find(a=>(a.localId||a.username)===localId);
    if(!acc){ if(errEl) errEl.textContent = 'تعذّر إيجاد الحساب'; return; }
    acc.email = email;
    if(newPass) acc.password = newPass;
    await saveAccounts();
    // Log the recovered account straight in — no need to retype anything.
    state.currentUser = acc.username;
    state.currentRole = acc.role || 'examiner';
    state.currentTeacherLink = acc.teacherLink || null;
    state.currentLocalId = acc.localId || null;
    state.authMode = 'login';
    state.view = state.currentRole==='teacher' ? 'schedule' : 'test';
    showToast('تم استرجاع الوصول وتسجيل الدخول بنجاح');
    render();
  };

  // Registration: role selector reveals the "which محفّظ am I" field.
  const roleSel = document.getElementById('reg-role');
  const teacherLinkWrap = document.getElementById('reg-teacher-link-wrap');
  if(roleSel && teacherLinkWrap){
    const syncTeacherLinkVisibility = ()=>{
      teacherLinkWrap.style.display = roleSel.value==='teacher' ? 'block' : 'none';
    };
    roleSel.onchange = syncTeacherLinkVisibility;
    syncTeacherLinkVisibility();
  }

  const btnReg = document.getElementById('btn-register');
  if(btnReg) btnReg.onclick = async ()=>{
    const u = document.getElementById('reg-user').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const p = document.getElementById('reg-pass').value;
    const forced = state.accounts.length === 0;
    const role = forced ? 'admin' : (document.getElementById('reg-role').value || 'examiner');
    const teacherLinkEl = document.getElementById('reg-teacher-link');
    const teacherLink = (role==='teacher' && teacherLinkEl) ? teacherLinkEl.value : null;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if(!u || !email || !p){ errEl.textContent='الرجاء تعبئة جميع الحقول'; return; }
    if(role==='teacher' && !teacherLink){ errEl.textContent='الرجاء اختيار اسمك من قائمة المحفّظين'; return; }

    if (firebaseAuth){
      if(p.length < 6){ errEl.textContent='كلمة المرور يجب أن لا تقل عن 6 أحرف'; return; }
      btnReg.disabled = true;
      try{
        const cred = await firebaseAuth.createUserWithEmailAndPassword(email, p);
        await firestoreDb.collection('users').doc(cred.user.uid).set({
          username: u, email, role, teacherLink: teacherLink || null, disabled: false, createdAt: new Date().toISOString()
        });
        state.currentUser = u;
        state.currentRole = role;
        state.currentTeacherLink = teacherLink || null;
        state.currentUid = cred.user.uid;
        state.authMode = 'login';
        state.view = role==='teacher' ? 'schedule' : 'test';
        render();
      }catch(e){
        errEl.textContent = mapAuthError(e);
      }finally{
        btnReg.disabled = false;
      }
      return;
    }

    // Legacy fallback (no Firebase Auth configured — see setup notes above).
    if(state.accounts.some(a=>(a.email||'').toLowerCase()===email.toLowerCase())){ errEl.textContent='هذا البريد الإلكتروني مستخدم بالفعل'; return; }
    if(p.length < 4){ errEl.textContent='كلمة المرور يجب أن لا تقل عن 4 أحرف'; return; }
    const newAcc = {localId: 'la_' + Date.now() + '_' + state.accounts.length, username:u, email, password:p, role, teacherLink: teacherLink || null, disabled:false};
    state.accounts.push(newAcc);
    await saveAccounts();
    state.currentUser = u;
    state.currentRole = role;
    state.currentTeacherLink = teacherLink || null;
    state.currentLocalId = newAcc.localId;
    state.authMode = 'login';
    state.view = role==='teacher' ? 'schedule' : 'test';
    render();
  };
}

/* Shared logout: signs out of Firebase Auth when configured (this also
   clears the persisted session so a reload won't auto-login again),
   otherwise just clears local state (legacy mode). */
async function doLogout(){
  if (firebaseAuth){
    try{ await firebaseAuth.signOut(); }catch(e){ console.warn(e); }
    // onAuthStateChanged listener above will clear state and re-render.
  } else {
    state.currentUser = null; state.currentRole = null; state.currentUid = null; state.currentTeacherLink = null; state.currentLocalId = null;
    render();
  }
}

function attachMainHandlers(){
  document.getElementById('btn-logout').onclick = ()=>{
    if(state.view==='test' && testForm.stage==='scoring'){
      showToast('لازم تحفظ أو ترجع عن الاختبار الحالي قبل الخروج');
      return;
    }
    doLogout();
  };
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{
      if(state.view==='test' && testForm.stage==='scoring' && b.dataset.view !== 'test'){
        showToast('لازم تحفظ أو ترجع عن الاختبار الحالي قبل ما تتنقل لصفحة ثانية');
        return;
      }
      state.view = b.dataset.view; selectedStudentId = null; resetTestForm(); render();
    };
  });

  window.onbeforeunload = (state.view==='test' && testForm.stage==='scoring')
    ? (e)=>{ e.preventDefault(); e.returnValue = ''; return ''; }
    : null;

  const currentView = effectiveView();
  if(currentView==='test') attachTestHandlers();
  if(currentView==='history') attachHistoryHandlers();
  if(currentView==='stats') attachStatsHandlers();
  if(currentView==='students') attachStudentsHandlers();
  if(currentView==='schedule') attachScheduleHandlers();
  if(currentView==='settings') attachSettingsHandlers();
}

function studentHistoryPanelHTML(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return '';
  const prior = state.exams.filter(e=>e.studentName.trim()===trimmed).sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!prior.length) return '';
  return `
    <div style="font-size:12.5px;font-weight:700;color:var(--green);margin-bottom:6px;">سجل الطالب السابق (${prior.length} اختبار)</div>
    ${prior.slice(0,6).map(e=>{
      const d = new Date(e.date).toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'});
      const isRetry = !!e.stoppedEarly;
      const cls = isRetry ? 'score-low' : (e.score>=90 ? 'score-high' : e.score>=80 ? 'score-mid' : 'score-low');
      return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);">
        <span>${escapeHtml(formatJuzRange(e.juz))} · ${d}${e.notes ? ' · ' + escapeHtml(e.notes) : ''}</span>
        <span class="record-score ${cls}" style="padding:2px 8px;border-radius:8px;font-size:12px;">${isRetry ? 'إعادة' : e.score}</span>
      </div>`;
    }).join('')}
  `;
}

function attachTestHandlers(){
  if(testForm.stage === 'scoring') attachTestScoringHandlers();
  else attachTestSetupHandlers();
}

function attachTestSetupHandlers(){
  const sEl = document.getElementById('f-student');
  const tEl = document.getElementById('f-teacher');
  const jEl = document.getElementById('f-juz');
  const nEl = document.getElementById('f-notes');
  sEl.oninput = ()=>{
    testForm.studentName = sEl.value;
    const panel = document.getElementById('student-history-panel');
    if(panel){
      const html = studentHistoryPanelHTML(testForm.studentName);
      panel.innerHTML = html;
      panel.style.display = html ? 'block' : 'none';
    }
  };
  tEl.onchange = ()=> testForm.teacherName = tEl.value;
  if(nEl) nEl.oninput = ()=> testForm.notes = nEl.value;

  document.querySelectorAll('.juz-mode-btn').forEach(b=>{
    b.onclick = ()=>{
      testForm.juzMode = b.dataset.mode;
      if(testForm.juzMode==='multi' && !String(testForm.juz).startsWith('الأجزاء:')) testForm.juz = 'تجميعي';
      if(testForm.juzMode==='single' && String(testForm.juz).match(/^\\d+$/) === null) testForm.juz = '1';
      render();
    };
  });

  if(jEl) jEl.onchange = ()=>{ testForm.juz = jEl.value; };

  document.querySelectorAll('.juz-check').forEach(cb=>{
    cb.onchange = ()=>{
      const selected = [...document.querySelectorAll('.juz-check:checked')]
        .map(x=>Number(x.value))
        .sort((a,b)=>a-b);
      testForm.juz = selected.length ? 'الأجزاء: ' + selected.join(' + ') : 'تجميعي';
    };
  });

  document.getElementById('btn-start-test').onclick = ()=>{
    const errs = [];
    if(!testForm.studentName.trim()) errs.push('student');
    if(!testForm.teacherName.trim()) errs.push('teacher');
    if(errs.includes('student')) document.getElementById('f-student').classList.add('error');
    if(errs.includes('teacher')) document.getElementById('f-teacher').classList.add('error');
    if(errs.length){ showToast('الرجاء تعبئة اسم الطالب والمحفّظ'); return; }

    testForm.studentName = testForm.studentName.trim();
    testForm.teacherName = testForm.teacherName.trim();
    testForm.clicks = [];
    testForm.questionsDone = [false,false,false,false,false];
    testForm.stage = 'scoring';
    render();
  };
}

function attachTestScoringHandlers(){
  document.querySelectorAll('.deduct-btn').forEach(b=>{
    b.onclick = ()=>{
      testForm.clicks.push({ type: b.dataset.type, value: parseFloat(b.dataset.val) });
      rerenderTestOnly();
    };
  });

  document.querySelectorAll('.question-chip').forEach(b=>{
    b.onclick = ()=>{
      const i = Number(b.dataset.i);
      if(!testForm.questionsDone) testForm.questionsDone = [false,false,false,false,false];
      testForm.questionsDone[i] = !testForm.questionsDone[i];
      rerenderTestOnly();
    };
  });

  const undoBtn = document.getElementById('btn-undo');
  if(undoBtn) undoBtn.onclick = ()=>{
    testForm.clicks.pop();
    rerenderTestOnly();
  };

  const backBtn = document.getElementById('btn-back-setup');
  if(backBtn) backBtn.onclick = ()=>{
    if(testForm.clicks.length && !confirm('الرجوع رح يفقد الخصومات المسجّلة لهاد الاختبار، متأكد؟')) return;
    testForm.stage = 'setup';
    testForm.clicks = [];
    render();
  };

  const stopBtn = document.getElementById('btn-stop-test');
  if(stopBtn) stopBtn.onclick = async ()=>{
    if(!confirm('تنبيه: إيقاف الاختبار الآن رح يسجّل نتيجة الطالب بالعلامة الحالية (' + currentScore() + ' من 100) ويعتبر الاختبار منتهي — ولازم الطالب يعيد الاختبار لاحقاً. متأكد إنك بدك توقف الاختبار؟')) return;
    const record = {
      id: 'e_' + Date.now(),
      studentName: testForm.studentName.trim(),
      teacherName: testForm.teacherName.trim(),
      juz: testForm.juz,
      notes: (testForm.notes||'').trim(),
      testerName: state.currentUser,
      deductions: { lahn: countOf('lahn'), khataa: countOf('khataa'), tanbih: countOf('tanbih') },
      score: currentScore(),
      stoppedEarly: true,
      date: new Date().toISOString(),
    };
    state.exams.unshift(record);
    upsertStudentFromExam(record);
    await saveExams();
    await saveStudents();
    showToast('تم إيقاف الاختبار وتسجيل النتيجة — الطالب بحاجة لإعادة الاختبار');
    resetTestForm();
    render();
  };

  document.getElementById('btn-save').onclick = async ()=>{
    const record = {
      id: 'e_' + Date.now(),
      studentName: testForm.studentName.trim(),
      teacherName: testForm.teacherName.trim(),
      juz: testForm.juz,
      notes: (testForm.notes||'').trim(),
      testerName: state.currentUser,
      deductions: {
        lahn: countOf('lahn'),
        khataa: countOf('khataa'),
        tanbih: countOf('tanbih'),
      },
      score: currentScore(),
      date: new Date().toISOString(),
    };
    state.exams.unshift(record);
    upsertStudentFromExam(record);
    await saveExams();
    await saveStudents();
    showToast('تم حفظ نتيجة الاختبار بنجاح');
    resetTestForm();
    render();
  };
}

function rerenderTestOnly(){
  document.getElementById('content').innerHTML = testView();
  attachTestHandlers();
}

/* ---------------- HISTORY VIEW ---------------- */
let historySearch = '';
let historyFilters = { score: 'all', juz: '', dateFrom: '', dateTo: '' };
let historyVisibleCount = 20;
let editingTeacherRecordId = null; // exam.id currently showing the "edit teacher" inline form (admin/examiner only)
const HISTORY_PAGE_SIZE = 20;

function applyHistoryFilters(list){
  return list.filter(e=>{
    if(!e.studentName.toLowerCase().includes(historySearch.toLowerCase())) return false;
    if(historyFilters.score==='high' && e.score<90) return false;
    if(historyFilters.score==='pass' && e.score<80) return false;
    if(historyFilters.score==='low' && e.score>=80) return false;
    if(historyFilters.juz){
      const wanted = historyFilters.juz.trim();
      if(wanted && !String(e.juz).includes(wanted)) return false;
    }
    if(historyFilters.dateFrom && new Date(e.date) < new Date(historyFilters.dateFrom)) return false;
    if(historyFilters.dateTo && new Date(e.date) > new Date(historyFilters.dateTo + 'T23:59:59')) return false;
    return true;
  });
}

function visibleExams(){
  return state.currentRole === 'teacher'
    ? state.exams.filter(e => e.teacherName === state.currentTeacherLink)
    : state.exams;
}

function historyView(){
  const exams = visibleExams();
  const uniqueStudents = new Set(exams.map(e=>e.studentName.trim().toLowerCase())).size;
  const filtered = applyHistoryFilters(exams);
  const visible = filtered.slice(0, historyVisibleCount);

  return `
  <div class="section-title">${state.currentRole==='teacher' ? 'نتائج طلابي' : 'سجل الاختبارات'}</div>
  <div class="stat-row">
    <div class="stat-card"><div class="num">${exams.length}</div><div class="lbl">إجمالي الاختبارات</div></div>
    <div class="stat-card"><div class="num">${uniqueStudents}</div><div class="lbl">عدد الطلاب المختبَرين</div></div>
  </div>
  <div class="history-toolbar">
    <button class="btn-report" id="btn-monthly-report">${iconReport()} تقرير شهري</button>
  </div>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="ابحث عن طالب..." value="${escapeHtml(historySearch)}">
  </div>
  <div class="filters-panel">
    <div class="filters-row">
      <select id="filter-score">
        <option value="all" ${historyFilters.score==='all'?'selected':''}>كل الدرجات</option>
        <option value="high" ${historyFilters.score==='high'?'selected':''}>ممتاز (90+)</option>
        <option value="pass" ${historyFilters.score==='pass'?'selected':''}>ناجح (80+)</option>
        <option value="low" ${historyFilters.score==='low'?'selected':''}>أقل من 80</option>
      </select>
      <input type="text" id="filter-juz" placeholder="رقم الجزء" value="${escapeHtml(historyFilters.juz)}">
    </div>
    <div class="filters-row">
      <input type="date" id="filter-date-from" value="${historyFilters.dateFrom}">
      <input type="date" id="filter-date-to" value="${historyFilters.dateTo}">
    </div>
    <div class="filters-row" style="justify-content:flex-end;">
      <button class="filters-clear" id="btn-clear-filters">مسح الفلاتر</button>
    </div>
  </div>
  <div id="records-list">
    ${renderRecords(visible, filtered.length)}
  </div>
  `;
}

function iconReport(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`;
}
function iconShare(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>`;
}

function renderRecords(list, totalCount){
  const total = totalCount === undefined ? list.length : totalCount;
  if(list.length===0){
    return `<div class="empty-state">لا توجد نتائج اختبارات ${(historySearch || historyFilters.score!=='all' || historyFilters.juz || historyFilters.dateFrom || historyFilters.dateTo) ? 'مطابقة لبحثك/فلاترك' : 'بعد'}</div>`;
  }
  const canEditTeacher = state.currentRole !== 'teacher';
  const cards = list.map(r=>{
    const isRetry = !!r.stoppedEarly;
    const scoreClass = isRetry ? 'score-low' : (r.score>=90 ? 'score-high' : r.score>=80 ? 'score-mid' : 'score-low');
    const alertClass = (isRetry || r.score<80) ? ' record-alert' : '';
    const d = new Date(r.date);
    const dateStr = d.toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'});
    const isEditingTeacher = canEditTeacher && editingTeacherRecordId === r.id;
    return `
    <div class="record${alertClass}">
      <div class="record-top">
        <div class="name">${escapeHtml(r.studentName)}</div>
        <div class="record-score ${scoreClass}">${isRetry ? 'إعادة' : r.score}</div>
      </div>
      <div class="record-meta">
        ${isEditingTeacher ? `
        <span>المحفّظ:</span>
        <select class="teacher-edit-select" data-id="${r.id}" style="font-family:'Tajawal';font-size:12.5px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);">
          ${TEACHERS.map(n=>`<option value="${escapeHtml(n)}" ${r.teacherName===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
        </select>
        <button class="teacher-edit-save" data-id="${r.id}" style="font-size:11px;padding:2px 8px;">حفظ</button>
        <button class="teacher-edit-cancel" style="font-size:11px;padding:2px 8px;">إلغاء</button>
        ` : `المحفّظ: <b>${escapeHtml(r.teacherName)}</b>`} · الأجزاء المختبَر فيها: <b>${escapeHtml(String(r.juz))}</b><br>
        المختبِر: <b>${escapeHtml(r.testerName)}</b> · التاريخ: <b>${dateStr}</b><br>
        لحن جلي: <b>${r.deductions.lahn}</b> · خطأ: <b>${r.deductions.khataa}</b> · تنبيه: <b>${r.deductions.tanbih}</b>
        ${r.notes ? `<br>ملاحظات: <b>${escapeHtml(r.notes)}</b>` : ''}
      </div>
      <div class="record-actions">
        ${!isRetry ? `<button class="record-share" data-id="${r.id}">${iconShare()} مشاركة شهادة</button>` : ''}
        ${canEditTeacher && !isEditingTeacher ? `<button class="record-edit-teacher" data-id="${r.id}">تعديل المحفّظ</button>` : ''}
        ${state.currentRole!=='teacher' ? `<button class="record-del" data-id="${r.id}">حذف السجل</button>` : ''}
      </div>
    </div>`;
  }).join('');
  const loadMore = total > list.length
    ? `<button class="btn-load-more" id="btn-load-more">تحميل المزيد (${total - list.length} متبقي)</button>`
    : '';
  return cards + loadMore;
}

function refreshHistoryList(){
  const filtered = applyHistoryFilters(visibleExams());
  const visible = filtered.slice(0, historyVisibleCount);
  document.getElementById('records-list').innerHTML = renderRecords(visible, filtered.length);
  attachDeleteHandlers();
  attachShareHandlers();
  attachTeacherEditHandlers();
  const loadMoreBtn = document.getElementById('btn-load-more');
  if(loadMoreBtn) loadMoreBtn.onclick = ()=>{
    historyVisibleCount += HISTORY_PAGE_SIZE;
    refreshHistoryList();
  };
}

function attachHistoryHandlers(){
  const input = document.getElementById('search-input');
  input.oninput = ()=>{
    historySearch = input.value;
    historyVisibleCount = HISTORY_PAGE_SIZE;
    refreshHistoryList();
  };

  const scoreSel = document.getElementById('filter-score');
  const juzInput = document.getElementById('filter-juz');
  const fromInput = document.getElementById('filter-date-from');
  const toInput = document.getElementById('filter-date-to');
  const onFilterChange = ()=>{
    historyFilters = {
      score: scoreSel.value, juz: juzInput.value,
      dateFrom: fromInput.value, dateTo: toInput.value,
    };
    historyVisibleCount = HISTORY_PAGE_SIZE;
    refreshHistoryList();
  };
  scoreSel.onchange = onFilterChange;
  juzInput.oninput = onFilterChange;
  fromInput.onchange = onFilterChange;
  toInput.onchange = onFilterChange;

  document.getElementById('btn-clear-filters').onclick = ()=>{
    historyFilters = { score:'all', juz:'', dateFrom:'', dateTo:'' };
    historySearch = '';
    historyVisibleCount = HISTORY_PAGE_SIZE;
    document.getElementById('content').innerHTML = historyView();
    attachHistoryHandlers();
  };

  refreshHistoryList();

  const reportBtn = document.getElementById('btn-monthly-report');
  if(reportBtn) reportBtn.onclick = ()=> generateMonthlyReport(reportBtn);
}

function attachDeleteHandlers(){
  document.querySelectorAll('.record-del').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('هل تريد حذف هذا السجل؟')) return;
      state.exams = state.exams.filter(e=>e.id!==b.dataset.id);
      await saveExams();
      render();
    };
  });
}

function attachShareHandlers(){
  document.querySelectorAll('.record-share').forEach(b=>{
    b.onclick = ()=>{
      const record = state.exams.find(e=>e.id===b.dataset.id);
      if(record) shareCertificate(record, b);
    };
  });
}

// Lets admin/examiner correct the "المحفّظ" name stored on an existing
// exam record — needed when it was picked wrong (or left unset) at test
// time, since that's the only thing that decides which teacher account
// sees this student under "نتائج طلابي".
function attachTeacherEditHandlers(){
  document.querySelectorAll('.record-edit-teacher').forEach(b=>{
    b.onclick = ()=>{
      editingTeacherRecordId = b.dataset.id;
      refreshHistoryList();
    };
  });
  document.querySelectorAll('.teacher-edit-cancel').forEach(b=>{
    b.onclick = ()=>{
      editingTeacherRecordId = null;
      refreshHistoryList();
    };
  });
  document.querySelectorAll('.teacher-edit-save').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const sel = document.querySelector(`.teacher-edit-select[data-id="${id}"]`);
      const newName = sel ? sel.value : '';
      const exam = state.exams.find(e=>e.id===id);
      if(exam && newName){
        exam.teacherName = newName;
        await saveExams();
        showToast('تم تحديث اسم المحفّظ');
      }
      editingTeacherRecordId = null;
      refreshHistoryList();
    };
  });
}

/* ============================================================
   Shared decorative canvas helpers for the certificate & the
   monthly report, styled after the ornate green/gold Islamic
   certificate template (arch frame, hanging lanterns, logo,
   pill badges, seal stamp, table).
   ============================================================ */
const PAL = { green:'#1B4332', green2:'#0F2E22', gold:'#C08A28', goldLight:'#D9B15C', cream:'#FCF8EC', ink:'#26231C', inkSoft:'#6B6355' };

function buildArchPath(ctx, W, H, margin, shoulderY, stepW, apexY){
  ctx.beginPath();
  ctx.moveTo(margin, H-margin);
  ctx.lineTo(margin, shoulderY);
  ctx.lineTo(margin+stepW, shoulderY);
  ctx.bezierCurveTo(margin+stepW, shoulderY-70, W/2-130, apexY+50, W/2, apexY);
  ctx.bezierCurveTo(W/2+130, apexY+50, W-margin-stepW, shoulderY-70, W-margin-stepW, shoulderY);
  ctx.lineTo(W-margin, shoulderY);
  ctx.lineTo(W-margin, H-margin);
  ctx.closePath();
}

function drawFrame(ctx, W, H){
  buildArchPath(ctx, W, H, 34, H*0.18, W*0.115, H*0.035);
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 9; ctx.stroke();
  buildArchPath(ctx, W, H, 56, H*0.18-16, W*0.115-16, H*0.035+16);
  ctx.strokeStyle = PAL.green; ctx.lineWidth = 3; ctx.stroke();
}

function drawBottomSwoosh(ctx, W, H){
  ctx.beginPath();
  ctx.moveTo(0, H*0.885);
  ctx.bezierCurveTo(W*0.22, H*0.885, W*0.36, H*0.80, W/2, H*0.80);
  ctx.bezierCurveTo(W*0.64, H*0.80, W*0.78, H*0.885, W, H*0.885);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fillStyle = PAL.green; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, H*0.885);
  ctx.bezierCurveTo(W*0.22, H*0.885, W*0.36, H*0.80, W/2, H*0.80);
  ctx.bezierCurveTo(W*0.64, H*0.80, W*0.78, H*0.885, W, H*0.885);
  ctx.strokeStyle = PAL.gold; ctx.lineWidth = 3.5; ctx.stroke();
}

function drawLantern(ctx, cx, topY, w, h, color){
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1.3, w*0.045);
  ctx.beginPath(); ctx.moveTo(cx, topY-h*0.32); ctx.lineTo(cx, topY); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, topY-h*0.34, w*0.07, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-w*0.2, topY+h*0.06);
  ctx.quadraticCurveTo(cx, topY-h*0.1, cx+w*0.2, topY+h*0.06);
  ctx.closePath(); ctx.fill();
  const bodyTop = topY+h*0.08, bodyBot = topY+h*0.72;
  ctx.beginPath();
  ctx.moveTo(cx-w*0.3, bodyTop+h*0.06);
  ctx.lineTo(cx-w*0.4, bodyTop+h*0.32);
  ctx.lineTo(cx-w*0.26, bodyBot);
  ctx.lineTo(cx+w*0.26, bodyBot);
  ctx.lineTo(cx+w*0.4, bodyTop+h*0.32);
  ctx.lineTo(cx+w*0.3, bodyTop+h*0.06);
  ctx.closePath();
  ctx.globalAlpha = 0.14; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(cx+i*w*0.13, bodyTop+h*0.12);
    ctx.lineTo(cx+i*w*0.09, bodyBot-h*0.03);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx-w*0.09, bodyBot); ctx.lineTo(cx, bodyBot+h*0.13); ctx.lineTo(cx+w*0.09, bodyBot);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, bodyBot+h*0.22, w*0.045, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLanterns(ctx, W, H){

  ctx.fillStyle = PAL.gold; ctx.fill();
  ctx.beginPath();
